  function scDictWord() {
    const R = scRun, r = R.rows[R.i], n = R.rows.length, last = R.i === n - 1;
    scOpen(scHead("Practice dictation", R.i, n, true) + scTitle("Listen and write", "<b>Listen.</b> <b>Write</b> the word on your paper.") +
      '<div class="sc-sheet" aria-hidden="true"><span class="sc-num">' + (R.i + 1) + '.</span><span class="sc-rule"></span>' + ICON("pencil") + "</div>" +

  }
  function scDictMark() {
    const R = scRun, n = R.rows.length;
    const count = () => Object.keys(R.marks).filter(k => R.marks[k]).length;
    const tally = () => { const c = count(); return c ? c + " of " + n + " right" : ""; };   // nothing shows "0"
    scOpen('<header class="pg-head"><span class="eyebrow">Practice dictation</span><span class="grow sc-grow"></span><button type="button" class="btn quiet" id="sc-stop">Stop here</button></header>' + scTitle("Check your paper", "<b>Check</b> your paper. <b>Tap</b> the words you got right.") +
      '<div class="sc-marks nozh' + (n > 15 ? " sc-many" : "") + '" id="sc-marks">' + R.rows.map((r, i) => '<button type="button" class="sc-mark" data-id="' + W.esc(r.id) + '" aria-pressed="false"><span class="sc-n">' + (i + 1) + ".</span><span class=\"sc-w\">" + W.esc(r.word) + "</span>" + ICON("check") + "</button>").join("") + "</div>" +
      '<footer class="pg-foot"><span class="hint zhk" id="sc-tally"></span><span class="grow"></span><button type="button" class="btn primary" id="sc-done">Done' + ICON("arrow") + "</button></footer>", true);
    $("panelBody").querySelectorAll(".sc-mark").forEach(b => b.onclick = () => {

  async function scDictScore() {
    const R = scRun; if (R.saving) return; R.saving = true;
    const total = R.rows.length, right = R.rows.filter(r => R.marks[r.id]), missed = R.rows.filter(r => !R.marks[r.id]);
    const row = { student_id: student.id, dictation_date: R.list.date, taken_on: today(), score: right.length, total, missed: missed.map(r => r.word), self_marked: true };
    try {
      const { data, error } = await sb.from("school_tests").insert(row).select().single();
      scTests.push(error || !data ? row : data); if (error) banner("No internet? The score was not saved.");
    } catch (e) { scTests.push(row); }
    logEvent("school_test", { dictation_date: R.list.date, score: right.length, total, missed: row.missed, self_marked: true });

    const some = right.length > 0;
    scOpen(scHead("Practice dictation") + '<div class="sc-mid sc-end"><div class="stamp sc-ok"><span>dictation</span><b>' + (some ? right.length + "/" + total : ICON("check")) + "</b><span>practice</span></div>" +

      '<p class="sc-gems">' + ICON("gem") + "<span>You earned 3 diamonds.</span></p>" +
      (missed.length ? '<p class="do">Now type the words you missed. Then you are ready.</p>' : '<p class="do">All right! You are ready.</p>') + "</div>" +

  }

  }, [
    [/^The school dictation is on (\w+)\.$/, m => ({ Monday: "星期一", Tuesday: "星期二", Wednesday: "星期三", Thursday: "星期四", Friday: "星期五", Saturday: "星期六", Sunday: "星期日" }[m[1]] || m[1]) + "学校听写。"],

  // ============ "Which word did you hear?" (owner: pairs helper, prefix pr-) ============
  // A short listening game inside the level: two words that differ only in the vowel (bed / bid). He hears ONE of them and
  // taps the one he heard. Not yet: both words are said in one voice (A, a pause, B), each button lighting while its word
  // is said, then a freshly chosen word from the same pair is asked; a second miss shows which one it was and moves on.
  // 3 pairs in EVERY level (the owners, 25 November; it was once a day), other pairs than in an earlier level of the same
  // day, under a minute, no diamonds. The words are said with up to three of the device's own English voices in
  // turn (learning a sound from one speaker alone does not carry over well to other speakers).
  // The level calls (another helper wires it, after the quick check, before the two main words):
  //   if (typeof pairsStep === "function" && pairsReady()) pairsStep(next); else next();
  // Data: site/pairs.js (window.WW_PAIR_LIST, window.WW_PAIR_CONTRASTS, window.WW_PAIRS_STATS for the tutor's page).
  // Events: "pair" { a, b, contrast, target, chosen, right, try, voice, level } for every answer, "pairs_done" { right, of, level }.
  const PR_PER_DAY = 3, PR_RATE = 0.8, PR_DAYS = 30, PR_FRESH = 7;
  const PR_READER = ["buttery", "airy", "glassy"];   // three of the claude.ai reader's voices (the names site/common.js uses)
  const PR_GAP = 600;                                // the pause between word A and word B
  let prEv = null, prLoading = null, prDone = "", prRun = 0;
  const prToday = [];   // this page's own answers today (the loaded events may be older than the first level's game)

  const prList = () => (window.WW_PAIR_LIST || []).filter(p => Array.isArray(p) && p[0] && p[1] && p[2]);
  function prContrasts(list) {
    const out = (window.WW_PAIR_CONTRASTS || []).map(c => c[0]);
    (list || prList()).forEach(p => { if (out.indexOf(p[2]) < 0) out.push(p[2]); });
    return out;
  }
  const prDay = e => { try { return e && e.created_at ? W.dkey(new Date(e.created_at)) : ""; } catch (x) { return ""; } };
  const prPairKey = (a, b) => String(a).toLowerCase() + "/" + String(b).toLowerCase();
  const prLevel = () => (q && q.day) || 0;
  const prFlag = lv => "ww.pairs." + (student ? student.id : "") + "." + today() + "." + (lv == null ? prLevel() : lv);
  // A small random stream with a seed: the same student and day give the same pairs, targets and sides after a reload.
  function prRand(seed) {
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
    return () => { h = (h + 0x6D2B79F5) | 0; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ---- which pairs today (pure: events, student id, day) ----
  // Only events from before today count, so a reload in the middle of today's game gives the same three pairs.
  // Per contrast, the share right on the first try in the last 30 days; the main contrast is the one with the lowest share
  // (no answers yet: the first one, "e-i"). It gives 2 pairs; 1 more comes from another contrast: the one played least
  // recently (never played first, in list order). Inside a contrast the pairs go in list order, on from the last one
  // played; a pair right on the first try at both of its last two plays within 7 days waits (unless every pair waits).
  // avoid: pair keys ("a/b") already played today in another level: they come only when no other pair is left.
  function pairsChoose(events, sid, day, list, avoid, level) {
    list = list || prList();
    const from = W.addDays(day, -PR_DAYS), fresh = W.addDays(day, -PR_FRESH);
    const firsts = (events || []).filter(e => e && e.type === "pair" && e.detail && +e.detail.try === 1)
      .map(e => ({ d: e.detail, day: prDay(e), at: String(e.created_at || "") }))
      .filter(e => e.day && e.day >= from && e.day < day)
      .sort((x, y) => (x.at < y.at ? -1 : x.at > y.at ? 1 : 0));
    const order = prContrasts(list).filter(c => list.some(p => p[2] === c));
    if (!order.length) return [];
    const st = {}; order.forEach((c, i) => { st[c] = { c, i, right: 0, of: 0, last: "" }; });
    firsts.forEach(e => { const s = st[e.d.contrast]; if (!s) return; s.of++; if (e.d.right) s.right++; s.last = e.at; });
    const played = order.filter(c => st[c].of > 0);
    const main = played.length ? played.slice().sort((x, y) => st[x].right / st[x].of - st[y].right / st[y].of || st[x].i - st[y].i)[0] : order[0];
    const others = order.filter(c => c !== main).sort((x, y) => (st[x].last < st[y].last ? -1 : st[x].last > st[y].last ? 1 : st[x].i - st[y].i));
    const taken = new Set();
    function pick(c, n) {
      const pairs = list.filter(p => p[2] === c), out = [];
      if (!pairs.length) return out;
      const mine = firsts.filter(e => e.d.contrast === c);
      let start = 0;
      if (mine.length) { const l = mine[mine.length - 1].d, at = pairs.findIndex(p => prPairKey(p[0], p[1]) === prPairKey(l.a, l.b)); if (at >= 0) start = at + 1; }
      const waits = p => {
        const plays = mine.filter(e => prPairKey(e.d.a, e.d.b) === prPairKey(p[0], p[1])).slice(-2);
        return plays.length === 2 && plays.every(e => e.d.right && e.day >= fresh);
      };
      for (const pass of [0, 1, 2]) for (let k = 0; k < pairs.length && out.length < n; k++) {
        const p = pairs[(start + k) % pairs.length], key = prPairKey(p[0], p[1]) + "|" + c;
        if (taken.has(key) || (pass === 0 && waits(p)) || (pass < 2 && avoid && avoid.has(prPairKey(p[0], p[1])))) continue;
        taken.add(key); out.push(p);
      }
      return out;
    }
    const a = pick(main, 2);
    let b = [];
    for (const c of others) { b = pick(c, 1); if (b.length) break; }
    const got = [a[0], b[0], a[1]].filter(Boolean);
    if (got.length < PR_PER_DAY) got.push(...pick(main, PR_PER_DAY - got.length));
    const rnd = prRand(String(sid) + "|" + day + "|pairs" + (level ? "|" + level : ""));
    return got.slice(0, PR_PER_DAY).map(p => {
      const flip = rnd() < 0.5;
      return { a: p[0], b: p[1], c: p[2], left: flip ? p[1] : p[0], right: flip ? p[0] : p[1], targets: [rnd() < 0.5 ? p[0] : p[1], rnd() < 0.5 ? p[0] : p[1]] };
    });
  }
  // For the tutor's page (later): per contrast, first tries of the last 14 days (site/pairs.js, also loadable there).
  function pairsStats(events, now) { return typeof window.WW_PAIRS_STATS === "function" ? window.WW_PAIRS_STATS(events, now) : []; }

  // With recordings (site/voice.js, 24 November) the game needs no voice of the laptop: every pair word is recorded, in two voices.
  const prClips = () => { try { return !!(W.clipsOn && W.clipsOn() && prList().some(p => W.clipFor(p[0], 0) && W.clipFor(p[1], 0))); } catch (e) { return false; } };
  function prCanSpeak() {
    try { return prClips() || !!(W.hasReader && W.hasReader()) || !!(W.devOk && W.devOk() && W.voiceList().length > 0); } catch (e) { return false; }
  }
  // The voices to take turns with: on claude.ai's reader three of its voices; on the device up to three of its own normal
  // English voices (W.voiceRank below 20: not a network voice, not a joke voice); just one when the device has one.
  function prVoices() {
    if (prClips()) return [0, 1];   // the two recorded voices take turns (the second one where it has the word)
    if (W.hasReader && W.hasReader()) return [0, 1, 2];
    const out = [];
    try { W.voiceList().forEach((v, i) => { if (out.length < 3 && W.voiceRank(v) < 20) out.push(i); }); } catch (e) {}
    return out.length ? out : [0];
  }
  function prLoad() {
    if (!student) return Promise.resolve(null);
    if (prLoading) return prLoading;
    const since = new Date(Date.now() - (PR_DAYS + 1) * 864e5).toISOString(), sid = student.id;
    prLoading = (async () => {
      try {
        const r = await sb.from("events").select("*").eq("student_id", sid).in("type", ["pair", "pairs_done"]).gte("created_at", since);
        if (r.error) return null;
        if (student && student.id === sid) prEv = r.data || [];

      } catch (e) { return null; } finally { prLoading = null; }
    })();
    return prLoading;
  }
  // played in THIS level today (each level has its own pair game)
  const prDoneKey = () => student.id + "|" + today() + "|" + prLevel();
  const prDoneEv = (ev, lv) => (ev || []).some(e => e.type === "pairs_done" && prDay(e) === today() && e.detail && +e.detail.level === lv);
  function prPlayedToday() {
    if (!student) return false;

  function pairsReady() {
    try {
      if (!student || !q || q.ended || practising() || (q.day && isTest(q.day))) return false;
      if (student.pause_new === true) return false;

      return !prPlayedToday();
    } catch (e) { return false; }
  }

  (function prWatch(n) { if (prEv || n > 120) return; if (student && typeof sb !== "undefined") { prLoad(); return; } setTimeout(() => prWatch(n + 1), 1500); })(0);

  // ---- speaking: one word at a time, nothing over it ----
  // prSay(text, voice, onend, held): says one word slowly with that voice. The word counts as a word for Orbit
  // (W.wordBegin / W.wordEnd), so his line waits until it is over; held: the caller holds one ticket for several words.
  function prSay(text, n, onend, held) {
    let fin = false, safety = 0;
    const id = held ? 0 : W.wordBegin(1500 + 300 * String(text).length);
    const end = () => { if (fin) return; fin = true; clearTimeout(safety); if (id) W.wordEnd(id); if (onend) onend(); };
    safety = setTimeout(end, 9000);   // a voice that never says it is over: the game still goes on
    const other = () => {
      try {
        if (W.hasReader && W.hasReader()) W.read(text, { rate: PR_RATE * W.voice().rate, voice: PR_READER[n % PR_READER.length] }).then(end, end);
        else if (W.devOk && W.devOk()) W.devSay([{ text, rate: PR_RATE }], { voice: n, onend: end, noClip: true });
        else end();
      } catch (e) { end(); }
    };
    try {
      const clip = W.clipFor ? W.clipFor(text, n, false) : null;   // the recording first, at its normal speed (a word said alone is clear)
      if (clip) W.clipSay(clip, { ticket: id || 0, onend: end, onfail: other }); else other();
    } catch (e) { end(); }
  }

  // ---- the game ----
  function prHead() {
    let trail = "";
    try { if (q && q.items && cur()) trail = lvTrail(cur()); } catch (e) {}
    return '<header class="pg-head pr-head"><span class="eyebrow">' + (q && q.day ? "Level " + q.day + " · " : "") + "Listening</span>" + trail +
      '<button type="button" class="btn quiet" id="pauseBtn">Stop here</button></header>';
  }
  function pairsStep(next) {
    let called = false;
    const go = () => { if (called) return; called = true; try { next(); } catch (e) { try { console.warn("pairs", e); } catch (x) {} } };
    if (!student || !q || typeof next !== "function") return go();
    const myQ = q, run = ++prRun;
    prLoad().then(ev => {
      if (q !== myQ || run !== prRun) return;   // he left the level while it loaded: the level is gone, nothing to go on to
      const lv = prLevel();
      if (prDoneEv(ev, lv)) { prDone = prDoneKey(); return go(); }
      // the pairs another level played today wait (the owners: other pairs than in the first level of the day)
      const avoid = new Set(); (ev || prEv || []).concat(prToday).forEach(e => { if (e && e.type === "pair" && e.detail && prDay(e) === today() && +e.detail.level !== lv) avoid.add(prPairKey(e.detail.a, e.detail.b)); });
      const list = pairsChoose(ev || prEv || [], student.id, today(), null, avoid, lv);
      if (!list.length) return go();
      prPlay(list, myQ, run, go);
    });
  }
  function prPlay(list, myQ, run, go) {
    const voices = prVoices();
    const g = { i: 0, right: 0, said: 0, busy: false };
    const alive = () => q === myQ && run === prRun && !!$("prPick");
    const later2 = (fn, ms) => setTimeout(() => { if (alive()) fn(); }, ms);
    const btns = () => Array.from(qb.querySelectorAll(".pr-word"));
    const fb = (cls, html) => { const f = $("prFb"); if (f) { f.className = "fb" + (cls ? " " + cls : ""); f.innerHTML = html; } };
    const hush = on => { g.busy = on; const p = $("prPick"); if (p) p.classList.toggle("pr-hush", on); const h = $("prHear"); if (h) h.disabled = on; };
    // the word he must hear now, in the next voice of the turn
    function ask(it) {
      it.slot = voices[g.said % voices.length]; g.said++;
      sayTarget(it);
    }
    function sayTarget(it) {
      hush(true);
      prSay(it.target, it.slot, () => { if (alive()) hush(false); });
    }
    function page() {
      const it = list[g.i];
      it.tries = 0; it.target = it.targets[0];
      qp(prHead() + title("Which word did you hear?", "<b>Listen.</b> <b>Tap</b> the word.") +
        '<div class="pr-play"><div class="pr-ear">' + soundBtn("prHear", "Hear it again") + '<p class="kind pr-count">Pair ' + (g.i + 1) + " of " + list.length + "</p></div>" +
        '<div class="pr-pick" id="prPick">' + [it.left, it.right].map(w => '<button type="button" class="pr-word nozh" data-w="' + W.esc(w) + '">' + W.esc(w) + "</button>").join("") + "</div>" +
        '<p class="fb pr-fb" id="prFb" aria-live="polite"></p></div>');
      $("pauseBtn").onclick = () => { prRun++; pauseQuest(); showPage("world"); };
      $("prHear").onclick = () => { if (!g.busy && !it.over) sayTarget(it); };
      btns().forEach(b => b.onclick = () => tap(it, b));
      ask(it);
      if (g.i === 0) Guide.text("Listen. Tap the word you hear.", "听一听。点你听到的词。");   // waits until the word is over
    }
    function tap(it, b) {
      if (g.busy || it.over || !alive()) return;
      const chosen = b.dataset.w, right = chosen === it.target;
      it.tries++;
      logEvent("pair", { a: it.a, b: it.b, contrast: it.c, target: it.target, chosen, right, try: it.tries, voice: it.slot, level: prLevel() });
      prToday.push({ type: "pair", created_at: new Date().toISOString(), detail: { a: it.a, b: it.b, level: prLevel() } });
      if (right) {
        it.over = true; if (it.tries === 1) g.right++;
        b.classList.add("pr-right"); b.insertAdjacentHTML("afterbegin", ICON("check"));
        W.sfx("right"); fb("good", ICON("check") + "Yes. That is " + W.esc(it.target) + ".");
        hush(true); $("prPick").classList.remove("pr-hush");
        return later2(nextPair, 1500);
      }
      W.sfx("notyet");
      if (it.tries === 1) {
        // both words in ONE voice (the voice the word was said in), each button lighting while its word is said
        fb("bad", "Not yet. Listen to both."); hush(true); Guide.quiet();
        const [bl, br] = btns(), v = it.slot, ticket = W.wordBegin(9000);
        const lit = (el, on) => el && el.classList.toggle("pr-lit", on);
        later2(() => {
          lit(bl, true);
          prSay(it.left, v, () => {
            lit(bl, false); if (!alive()) return W.wordEnd(ticket);

              if (!alive()) return W.wordEnd(ticket);
              lit(br, true);
              prSay(it.right, v, () => {
                lit(br, false); W.wordEnd(ticket); if (!alive()) return;

      later2(() => prSay(it.target, it.slot, () => later2(nextPair, 1200)), 400);
    }

      g.i++;

      const of = list.length, right = g.right;
      logEvent("pairs_done", { right, of, level: prLevel() });
      prDone = prDoneKey();
      try { localStorage.setItem(prFlag(), "1"); } catch (e) {}
      qp(prHead() + '<div class="lv-center pr-end"><div class="stamp lv-ok"><span class="nozh">listening</span><b>' + ICON("check") + "</b><span>done</span></div>" +
        '<h3 class="pg-title">Good listening.</h3>' + (right ? '<p class="do">You heard <b>' + right + " of " + of + "</b>.</p>" : "") +
        '<footer class="pg-foot lv-mid"><button type="button" class="btn primary" id="prGo">Go on' + ICON("arrow") + "</button></footer></div>");
      $("pauseBtn").onclick = () => { prRun++; pauseQuest(); showPage("world"); };
      W.sfx("pop");
      $("prGo").onclick = () => { if (q !== myQ) return; prRun++; go(); };
      $("prGo").focus();
      Guide.text("Good listening.", "听得很好。");
    }
    page();
  }

  if (ZH) ZH.add({
    "Which word did you hear?": "你听到的是哪个词？", "Listen. Tap the word.": "听一听。点你听到的词。",
    "Listen. Tap the word you hear.": "听一听。点你听到的词。",
    "Not yet. Listen to both.": "还没对。两个都听一听。", "Listen again. Tap the word.": "再听一次。点你听到的词。",
    "Good listening.": "听得很好。"
  }, [
    [/^Level (\d+) · Listening$/, "第 $1 关 · 听一听"], [/^Listening$/, "听一听"],
    [/^Pair (\d+) of (\d+)$/, "第 $1 组，共 $2 组"],
    [/^Yes\. That is ([A-Za-z]+)\.$/, "对了。这是 $1。"], [/^It was ([A-Za-z]+)\.$/, "刚才说的是 $1。"],
    [/^You heard (\d+) of (\d+)\.$/, "$2 个里你听对了 $1 个。"]
  ]);
  // ============ (removed) the tip page before the quick check ============
  // The owners' daily sequence of 25 November takes it out of the game completely: no page, no words, no stamp, no diamond,
  // no dot on the trail, and no events of its own. Nothing calls this file. The pattern summary of his slips (site/patterns.js)
  // stays: the tutor's page and the weekly analysis read it, and report the pattern to the tutor instead.
  // ============ the night watch (part 86-raid, prefix rd-) ============
  // The island test, played as a watch at the gate of his outpost when the 3D world runs (site/raid3d.js draws it).
  // The words, their order, the scoring, the hints and what is saved are the island test's own: the strip below uses the
  // level's answer line (answerForm, wireAnswer) and its scoring step (checkSpelling) unchanged. What changes is what he sees:
  // ten Murks on the path, one for each word; nothing moves while it is his turn; after his answer a short show:
  //   right on the first try: the word's own object (its painted picture, cut out: tools/make_cutouts.py) is thrown, hits the
  //   Murk and it rolls home; right after a retry or hints: a softer hit knocks it aside and it sits beside the path (the word
  //   comes back tomorrow, as always); a word with no cut-out throws a star; a miss: nothing is thrown, the Murk takes one step
  //   closer and grows a little, then "Not yet. Try again." and the Hint button as on every typing page. A Murk that reaches the
  //   gate sits there till morning. After the last word: the morning page, then the level's own end page.
  // Hooks in 80-level.js (marked "raid hook"): renderStep hands the test's pages here, renderQ asks here before the end page.
  // Without 3D (window.__no3d, no WebGL) WWRaid.ok is false and the island test stays the plain page.
  const RAID_PICTURE_FIRST = false;   // true: the word's picture shows beside the sound button before he answers, as in the plain test
  const RD_GATE = 3;                  // misses that bring a Murk to the gate (raid3d.js walks it there on the same count)
  const RD_NUM = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];
  const RD_NUM_ZH = ["零", "一", "两", "三", "四", "五", "六", "七", "八", "九", "十"];
  const RD_HIT = [["{W} hits. The Murk rolls home.", "{W} 打中了。Murk 滚回家了。"], ["Good throw. {N} sent home.", "扔得好。赶回家 {N} 只了。"], ["Right. Off it goes.", "对了。它跑了。"]];
  const RD_ASIDE = ["{W} hits it aside. Back tomorrow.", "{W} 把它打到一边。明天再来。"];
  const RD_GATEHIT = ["{W} hits. It comes back tomorrow.", "{W} 打中了。它明天会再来。"];
  const RD_ATGATE = ["It cannot get in. It sits.", "它进不来。它坐下了。"];
  let rd = null;
  const rdW = () => (window.WWRaid && window.WWRaid.ok ? window.WWRaid : null);
  // The watch runs for a real island test when the 3D world runs. Practice never holds a test.
  function raidOn() { return !!(rdW() && q && !q.practice && q.row && q.items && isTest(q.day)); }
  const rdCap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
  const rdLine = (L, w, n) => [L[0].replace("{W}", rdCap(w)).replace("{N}", n), L[1].replace("{W}", w).replace("{N}", n)];
  // What happened to each word's Murk, kept on the device for this level (so a stop and a new start keep the ones at the gate).
  const rdKey = id => "ww.watch." + id;
  function rdLoad(id) { try { return JSON.parse(localStorage.getItem(rdKey(id)) || "{}") || {}; } catch (e) { return {}; } }
  function rdSave() { try { localStorage.setItem(rdKey(rd.q.row.id), JSON.stringify(rd.out)); } catch (e) { /* the morning page counts from the quest row */ } }
  const rdK = it => rd.base + rd.ids.indexOf(it.w.id);
  // What he throws for a word: its cut-out (img/words/cut/<word>.webp, listed in window.WW_CUTS by tools/make_cutouts.py, loaded
  // by raid3d.js) when the word shows the bank's own picture; else cut is "" and a star flies.
  function rdThing(w) {
    const k = W.plain(w.word), r = (window.WW_CUTS || {})[k], own = !w.picture || w.picture === "img/words/" + k + ".jpg";
    return r && own ? { word: w.word, cut: "img/words/cut/" + k + ".webp", ratio: r } : { word: w.word, cut: "", ratio: 1 };
  }

  function rdBegin() {
    const R = rdW(), r = q.row, ids = [];
    q.items.forEach(x => { if (x.part === "test" && x.w && ids.indexOf(x.w.id) < 0) ids.push(x.w.id); });
    const out = rdLoad(r.id), doneN = r.test_total || 0, home = Math.min(doneN, r.test_right || 0);

  // The level's pages of the island test, while the watch runs.
  function renderRaid(it) {

  const rdTurnText = k => "Word " + (k + 1) + " of " + rd.total;

  function rdTurn(it, k) {

  // Check: the level's scoring step decides and saves exactly as in the plain test; then the show for what happened.
  async function rdCheck(val) {
    const it = cur(), w = it.w, qq = q, R = rdW();
    if (!rd || !R || !norm(val) || q.busy || rd.busy) return;
    const first = !(w.id in q.results), hints = lvHints(), k = rdK(it), s = $("rdStrip");
    rd.busy = true; R.waiting(false); if (s) s.classList.remove("on");
    await checkSpelling(val);
    if (!rd || q !== qq || cur() !== it) { if (rd) rd.busy = false; return; }
    const thing = rdThing(w);
    if ($("ansLine") && $("ansLine").classList.contains("good")) {
      const kind = first && !hints ? "home" : (rd.misses[w.id] || 0) >= RD_GATE ? "gate" : "pushed";
      rd.out[w.id] = kind; rd.kinds[k] = kind; rdSave(); rdCount();
      let L;
      if (kind === "home") { L = rdLine(RD_HIT[rd.said++ % RD_HIT.length], w.word, rdHome()); rd.show = R.hit(k, thing); }
      else { L = rdLine(kind === "gate" ? RD_GATEHIT : RD_ASIDE, w.word, ""); rd.show = R.push(k, thing); }
      Guide.text(L[0], L[1]);

      rd.busy = false;
      return;
    }

    const inp = $("ans"); if (inp) inp.readOnly = true;
    rd.show = R.closer(k).catch(() => false).then(atGate => {
      if (!rd || q !== qq || cur() !== it) return;
      rd.busy = false;
      if (inp && inp.isConnected) { inp.readOnly = false; inp.focus(); }
      if (s) s.classList.add("on"); R.waiting(true);
      if (atGate && !rd.gateSaid[w.id]) { rd.gateSaid[w.id] = true; Guide.text(RD_ATGATE[0], RD_ATGATE[1]); }
    });
  }

  // ---- a game with the monster that was stopped (the tutor, 23 November) ----
  // Once an island test is started, he goes nowhere else until it is finished: only the map opens (and the mailbox when a new
  // letter comes), the walking view is locked, practice waits. 90-boot.js asks here in hdPlan and hdTaskDone (marked "raid
  // hook"); the usual rule (until today's task is done only the next part's place opens) then does the rest. It holds the
  // same with and without 3D, also on the next day, and also when it is his second level of the day.
  function rdHeld() {
    if (!student) return false;
    const d = openDay(); if (!d || !isTest(d)) return false;
    const r = questRow(d); return !!(r && !r.completed);
  }

  // ---- five diamonds for every finished game with the monster (the tutor, 23 November) ----
  // Paid once per island test, the first time it is finished (night watch or the plain test page), as their own row in
  // quests, as the school words pay theirs: { quest_day: null, kind: "watch:<level>", diamonds_earned: 5 } and no
  // "completed" (that would count as a level played). The kind names the level, so a test is never paid twice, also after
  // a reload between the last word and the end page. The level's own row and its end page reckoning stay as they were.
  const RD_GEMS = 5, rdGemKind = d => "watch:" + d;
  let rdPaying = {};
  async function rdPay(day) {
    if (!student || practising() || rdPaying[day] || quests.some(x => x.kind === rdGemKind(day))) return false;
    rdPaying[day] = true;
    try {
      const { data, error } = await sb.from("quests").insert({ student_id: student.id, quest_day: null, kind: rdGemKind(day), started_at: new Date().toISOString(), diamonds_earned: RD_GEMS }).select().single();
      if (error || !data) { banner("No internet? Your diamonds were not saved."); return false; }
      quests.push(data); renderStats();
      return true;
    } catch (e) { return false; } finally { rdPaying[day] = false; }
  }
  const rdGemLine = watch => RD_GEMS + " more diamonds for the " + (watch ? "night watch." : "island test.");
  // The level's own end page, then the two lines under its diamonds: the five more, and what opened in the shop.
  // The level's end page, with the watch's two lines under its diamonds. When a word was not right on its first try today the
  // level first asks it "One more time" (80-level.js againFirst) and comes back here afterwards: q.rdAgain keeps what the
  // first arrival knew (was it his first finish, which prize, watch or plain test), so the second arrival draws the page.
  function rdEnd(first, prize, watch) {
    q.rdEnding = false; q.rdAgain = { first, prize, watch };
    return Promise.resolve(renderEnd()).then(() => {
      const g = qb.querySelector(".lv-gems"); if (!g || !first) return;
      g.insertAdjacentHTML("afterend", '<p class="lv-gems rd-endmore">' + ICON("gem") + "<span>" + rdGemLine(watch) + "</span></p>" +
        (prize ? '<p class="do rd-endnew">' + bdThing(prize.id) + "<span>New in the shop: " + W.esc(prize.name) + ".</span></p>" : ""));

  // After the tenth word: the sun comes up and a journal page with few words. "Go on" opens the level's own end page.
  // The plain island test (no 3D) goes to its end page here too, after its five diamonds are paid.
  function raidMorning() {
    if (!q || q.practice || !q.row || !isTest(q.day)) return false;
    if (!rd || rd.q !== q || !rdW()) {
      if (q.rdEnding) return true;   // already on its way to the end page
      const qq = q, again = q.rdAgain || null, first = again ? again.first : !q.row.completed, prize = again ? again.prize : (first ? prizeFor(q.day) : null);
      q.rdEnding = true;
      (first && !again ? rdPay(q.day) : Promise.resolve(false)).then(() => { if (q === qq) rdEnd(first, prize, again ? again.watch : !!(rd && rd.q === qq)); });   // "night watch" only when a watch was played (26 November: a level without missed words has none)
      return true;
    }
    rdMorning();
    return true;
  }
  function rdMorning() {
    const r = q.row, R = rdW();

    const first = !r.completed, prize = first ? prizeFor(q.day) : null;   // a level finished before gives nothing new
    if (!rd.logged) {

    const earned = r.completed ? (r.diamonds_earned || 0) : scored + mixPaid + LEVEL_DONE + 5;   // what the end page will pay (80-level.js)
    let back = Object.keys(rd.out).filter(id => rd.out[id] !== "home").map(id => byId(id)).filter(Boolean);
    if (!back.length) back = rd.ids.filter(id => q.results[id] === false).map(id => byId(id)).filter(Boolean);

      '<h3 class="pg-title">Morning</h3>' +
      '<div class="rd-bar">' + rdPips("ink") + '<p class="zhk">' + (home ? home + " of " + rd.total + " sent home" : "A long night. More tomorrow.") + "</p></div>" +
      '<div class="rd-cols"><div>' +
      '<p class="rd-gem">' + ICON("gem") + '<b class="nozh">+' + earned + "</b></p>" +
      (first ? '<p class="rd-more">' + ICON("gem") + '<span class="zhk">' + rdGemLine(true) + "</span></p>" : "") +
      (prize ? '<p class="rd-more rd-prize">' + bdThing(prize.id) + '<span class="zhk">New in the shop: ' + W.esc(prize.name) + ".</span></p>" : "") +
      (back.length ? '<p class="eyebrow">Back tomorrow</p><div class="rd-words nozh">' + back.map(w => "<span>" + W.esc(w.word) + "</span>").join("") + "</div>" : "") +
      '</div><figure class="rd-keep"><i class="rd-kpic" role="img" aria-label="A watch-fire"></i><figcaption class="zhk">New: a watch-fire</figcaption></figure></div>' +

  // The watch-fire: one for every island test watched to the end, whatever the score. Owned, never sold; it waits in his
  // building bar. student.build.wf lists the levels (quest rows) that gave one, so a level never gives two.
  function rdGiveFire(questId) {
    if (!student) return false;
    const sbld = student.build && !Array.isArray(student.build) ? student.build : {}, got = Array.isArray(sbld.wf) ? sbld.wf : [];
    if (got.indexOf(questId) >= 0) return false;
    const b = buildObj(), own = Object.assign({}, b.bought); own.watchfire = (own.watchfire || 0) + 1;
    student.build = Object.assign({}, sbld, { cells: b.cells, bought: own, cells3: b.cells3, wf: got.concat([questId]) });

  if (ZH) ZH.add({
    "It waits": "它在等", "Morning": "天亮了", "Back tomorrow": "明天回来", "New: a watch-fire": "新东西：守夜火盆",
    "5 more diamonds for the night watch.": "守夜奖励：再加 5 颗钻石。", "5 more diamonds for the island test.": "小岛测验奖励：再加 5 颗钻石。"
  }, [
    [/^New in the shop: (.+)\.$/, m => "商店里的新东西：" + ((PRIZES.find(p => p.name === m[1]) || {}).zh || m[1]) + "。"],
    [/^Your turn · Word (\d+) of (\d+)$/, "轮到你了 · 第 $1 个词，共 $2 个"], [/^Word (\d+) of (\d+)$/, "第 $1 个词，共 $2 个"],
    [/^(\d+) of (\d+) sent home\.?$/, "赶回家 $1 只，一共 $2 只"], [/^A long night\. More tomorrow\.$/, "漫长的一夜。明天再来。"]
  ]);
  // ============ the word picker: which two words a level gets from level 4 on (owner: picker team, prefix pk-) ============
  // Levels 1 to 3 keep the bank's six words. When his next level is open (not locked) and has fewer than two approved words,
  // site/picker.js chooses the missing ones from site/pool.js (by his history, see the top of that file) and ONE call adds
  // them: sb.rpc("add_pool_words", { p_day, p_words }) (deploy/schema.sql; the stand-in and the test double do the same).
  // The tutor's own approved words on a level count; the picker only fills what is missing. Nothing is picked twice: the
  // words of every earlier "picked" event are left out too (a word she deleted does not come back).
  // No picker.js: nothing happens (the level waits for the tutor, as before). No pool.js: the bank's fixed course.
  // Called by unlock() (90-boot.js) and after a finished level (80-level.js renderEnd), each marked "picker hook".
  // The order of his main words (the tutor, 23 November; site/picker.js plan): his WAITING words first (his own rows:
  // approved, level 0, no level yet; words he did not know in the quick check; oldest first; one a level while her own words wait too), then the week's own words and words left over from an earlier week's list (pattern
  // weeks: window.WW_FIRST.weeks, site/first.js), then long words with the week's pattern near his band, then any long words by
  // his band. A waiting word is not added again: the same call gives it the level. Every 10th level is the island test: it gets no new words. "No new words for now" (student.pause_new,
  // the tutor's switch): nothing is added (see the old words without a lesson below).
  const PK_FIRST = 4;
  // The game's 2 words of level d: its words without the tutor's EXTRA words (words.extra, deploy/own-words.sql; the owner,
  // 27 November). Her extra words come on top (up to 10 a level) and never take one of the 2 places; everything that fills
  // or counts the 2 (this picker, the test account's "Go to level") uses this. Everything else (the cards, the level, the
  // map) takes every word of the level (dayWords).
  function pkGame(d) { return dayWords(d).filter(w => !w.extra); }
  let pkBusy = null;
  function pkNextLevel() { let d = 1; while (d <= maxDay() && dayDone(d)) d++; return d; }
  // One run at a time on this page; a second call waits for the first.
  function pkFill() {
    if (!pkBusy) pkBusy = pkRun().catch(e => { try { console.warn("picker", e); } catch (x) {} return false; }).then(r => { pkBusy = null; return r; });
    return pkBusy;
  }
  // Words of level d as the database has them now (another tab, or a call whose answer was lost, may have added them).
  async function pkReload(d) {
    const r = await sb.from("words").select("*").eq("student_id", student.id).eq("quest_day", d).eq("approved", true);
    if (r.error) return false;
    (r.data || []).forEach(w => { if (!words.some(x => x.id === w.id)) words.push(w); });
    return true;
  }
  const pkPaused = () => !!(student && student.pause_new);
  // his waiting words, oldest first (src: the rows of the words table this page has)
  const pkWaiting = list => list.filter(w => w.approved && !w.level && w.quest_day == null)
    .sort((a, b) => (a.created_at || "") < (b.created_at || "") ? -1 : (a.created_at || "") > (b.created_at || "") ? 1 : (a.sort_order || 0) - (b.sort_order || 0));
  async function pkRun() {
    const P = window.WW_PICKER;
    if (!P || !student || practising() || pkPaused()) return false;
    const d = pkNextLevel();
    if (d < PK_FIRST || d > LEVELS || isTest(d) || dayState(d) === "locked") return false;
    if (pkGame(d).length >= 2) return false;

  //    true, "ok" or the door gone = the game has started; "teacher": "That login is not the teacher's."; a wrong e-mail
  //    or password: "Not yet. Check your e-mail and password."; anything else or an error: "Can't open it. Try again."
  //    Whenever it did not open, the game's client signs out again, so no e-mail session stays on the page. In the
  //    practice copy (no accounts): no fields, "Practice copy: no password." and the button.
  //
  // How it is wired: 90-boot.js boot() calls doorOpen({ boot, hdDoor, sb, testerEnter }). 90-boot.js closes the game's shared
  // function scope ("})();" on its last line), so this part runs AFTER that scope; doorOpen is a plain function of the page
  // and this part keeps its own small helpers. ctx.sb is the game's own client (the session that becomes his).
  function doorOpen(ctx) { return window.WW_DOOR.open(ctx || {}); }
  (function () {
    const W = window.WT, ZH = window.WT_ZH, $ = id => document.getElementById(id);
    const ICON = name => '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
    const T = {
      title: "Welcome!", student: "Student", teacher: "Teacher", tester: "Tester",
      stuDo: "Type your name and your password.", name: "Name", pw: "Password", login: "Log in", mail: "E-mail",
      practice: "Practice copy. Password: practice",
      bad: "Not yet. Check your name and password.", many: "Too many tries. Wait a little.", net: "Can't connect. Tap Log in again.",
      teaDo: "Type your e-mail and password.", teaBad: "Not yet. Check your e-mail and password.",
      teaPractice: "Practice copy: no password.", teaGo: "Open the teacher page",
      tstDo: "For the adults who test the game.", tstGo: "Open the test account", tstNot: "That login is not the teacher's.",
      tstFail: "Can't open it. Try again."
    };
    const esc = s => (W && W.esc ? W.esc(s) : String(s));
    const demo = () => !!window.WW_DEMO;   // the practice copy (the stand-in database): no accounts
    let tab = "student", busy = false;
    const TABS = () => [["student", "pencil"], ["teacher", "book"], ["tester", "flag"]];
    const testerOn = ctx => typeof ctx.testerEnter === "function" || typeof window.doorTester === "function";
    const teacherLink = id => '<div class="pg-foot dr-foot"><a class="btn primary zhk" id="' + id + '" href="teacher.html">' + esc(T.teaGo) + "</a></div>";
    const field = (id, label, icon, input) => '<div class="dr-field"><span class="kind dr-lbl" id="' + id + 'L">' + esc(label) + '</span><label class="line">' + ICON(icon) + input.replace("<input ", '<input id="' + id + '" aria-labelledby="' + id + 'L" ') + "</label></div>";
    const isNet = m => /^network|fetch|failed to|timeout|load failed/i.test(m);
    async function open(ctx) {
      busy = false; window.WW_DOOR.ctx = ctx;   // the last door drawn (tests and the tester part may open it again with more)
      if (tab === "tester" && !testerOn(ctx)) tab = "student";
      const tabs = TABS().map(([k, ic]) => '<button type="button" role="tab" class="dr-tab' + (k === tab ? " on" : "") + '" id="drTab-' + k + '" data-tab="' + k + '"' +
        ' aria-controls="drPan-' + k + '" aria-selected="' + (k === tab) + '" tabindex="' + (k === tab ? 0 : -1) + '"' + (k === "tester" && !testerOn(ctx) ? " hidden" : "") + ">" +
        ICON(ic) + "<span>" + esc(T[k]) + "</span></button>").join("");
      const pan = (k, html) => '<div class="dr-pan" role="tabpanel" id="drPan-' + k + '" aria-labelledby="drTab-' + k + '"' + (tab === k ? "" : " hidden") + ">" + html + "</div>";
      const stu = '<p class="do">' + esc(T.stuDo) + "</p>" +
        '<form id="drStu" class="answer hd-entry dr-form" autocomplete="on" novalidate>' +
        field("drName", T.name, "pencil", '<input type="text" name="username" maxlength="80" autocomplete="username" autocapitalize="words" spellcheck="false">') +
        field("drPin", T.pw, "lock", '<input type="password" name="password" maxlength="40" autocomplete="current-password">') +
        '<button type="submit" class="btn primary" id="drEnter">' + esc(T.login) + "</button></form>" +
        '<p class="fb bad" id="drErr" aria-live="polite"></p>' + (demo() ? '<p class="hint dr-practice">' + esc(T.practice) + "</p>" : "");
      const tea = demo() ? '<p class="do">' + esc(T.teaPractice) + "</p>" + teacherLink("drTeacher") :
        '<p class="do">' + esc(T.teaDo) + "</p>" +
        '<form id="drTea" class="answer hd-entry dr-form" autocomplete="on" novalidate>' +
        field("drMail", T.mail, "mail", '<input type="email" name="email" maxlength="200" autocomplete="username" spellcheck="false">') +
        field("drTpw", T.pw, "lock", '<input type="password" name="password" maxlength="200" autocomplete="current-password">') +
        '<button type="submit" class="btn primary" id="drTLogin">' + esc(T.login) + "</button></form>" +
        '<p class="fb bad" id="drTErr" aria-live="polite"></p>';
      const tst = typeof ctx.testerEnter !== "function" ? "" : demo()
        ? '<p class="do">' + esc(T.teaPractice) + '</p><div class="pg-foot dr-foot"><button type="button" class="btn primary" id="drTester">' + esc(T.tstGo) + "</button></div>" +
          '<p class="fb bad" id="drTstErr" aria-live="polite"></p>'
        : '<p class="do">' + esc(T.tstDo) + "</p>" +
          '<form id="drTst" class="answer hd-entry dr-form" autocomplete="on" novalidate>' +
          field("drXMail", T.mail, "mail", '<input type="email" name="email" maxlength="200" autocomplete="username" spellcheck="false">') +
          field("drXPw", T.pw, "lock", '<input type="password" name="password" maxlength="200" autocomplete="current-password">') +
          '<button type="submit" class="btn primary" id="drTester">' + esc(T.tstGo) + "</button></form>" +
          '<p class="fb bad" id="drTstErr" aria-live="polite"></p>';
      ctx.hdDoor(T.title, "", '<div class="dr-door"><div class="dr-tabs" role="tablist" aria-label="Who is here">' + tabs + "</div>" + pan("student", stu) + pan("teacher", tea) + pan("tester", tst) + "</div>");
      wire(ctx);
    }
    function show(ctx, k, focus) {
      tab = k;
      document.querySelectorAll("#gate .dr-tab").forEach(b => { const on = b.dataset.tab === k; b.classList.toggle("on", on); b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
      document.querySelectorAll("#gate .dr-pan").forEach(p => { p.hidden = p.id !== "drPan-" + k; });
      if (k === "tester" && typeof ctx.testerEnter !== "function" && typeof window.doorTester === "function" && !$("drPan-tester").dataset.filled) { $("drPan-tester").dataset.filled = "1"; window.doorTester($("drPan-tester"), ctx); }
      if (focus === "tab") { const b = $("drTab-" + k); if (b) b.focus(); }
      else if (focus) {
        const f = k === "student" ? $("drName") : k === "teacher" ? ($("drMail") || $("drTeacher")) : ($("drXMail") || $("drTester"));
        if (f) f.focus();
      }
    }
    function wire(ctx) {
      const tabs = [...document.querySelectorAll("#gate .dr-tab")].filter(b => !b.hidden);
      tabs.forEach((b, i) => {
        b.onclick = () => show(ctx, b.dataset.tab, true);
        b.onkeydown = e => {   // arrows move between the tabs (the usual tab keys); Tab goes on into the open panel
          const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0; if (!d) return;
          e.preventDefault(); show(ctx, tabs[(i + d + tabs.length) % tabs.length].dataset.tab, "tab");
        };
      });
      $("drStu").onsubmit = e => { e.preventDefault(); login(ctx); };
      if ($("drTea")) $("drTea").onsubmit = e => { e.preventDefault(); teacher(); };
      if ($("drTst")) $("drTst").onsubmit = e => { e.preventDefault(); tester(ctx); };
      else if ($("drTester")) $("drTester").onclick = () => tester(ctx);
      show(ctx, tab, true);
    }
    function say(id, text) { const el = $(id); if (el) el.textContent = text; }
    // The game's anonymous sign-in: at most one per page load. The first submit makes it; later tries reuse the one the
    // game's client holds in memory. Nothing is signed in while the door merely shows.
    async function signedIn(db) {
      const r = await db.auth.getSession(), s = r && r.data && r.data.session;
      if (s) return { ok: true };
      const a = await db.auth.signInAnonymously();
      return a && !a.error ? { ok: true } : { ok: false, error: a && a.error };
    }
    async function login(ctx) {
      if (busy) return;
      const name = $("drName").value.trim(), pw = $("drPin").value.trim();
      if (!name || !pw) { say("drErr", T.bad); (name ? $("drPin") : $("drName")).focus(); return; }   // nothing to check: no try is counted
      busy = true; say("drErr", ""); $("drEnter").disabled = true;
      let res;
      try {
        const db = ctx.sb, s = await signedIn(db);
        res = s.ok ? await db.rpc("student_login", { p_name: name, p_pin: pw }) : { data: null, error: { message: "network: " + String(s.error && s.error.message || "") } };
      } catch (x) { res = { data: null, error: { message: "network: " + String(x && x.message || x) } }; }
      busy = false; if ($("drEnter")) $("drEnter").disabled = false;
      const { data, error } = res || {};
      if (data && !error) return ctx.boot(true);   // the game starts for the student of this session
      const m = String(error && error.message || "");
      say("drErr", /too many tries/i.test(m) ? T.many : error && isNet(m) ? T.net : T.bad);
      $("drPin").value = ""; $("drPin").focus();
    }
    // The tutor: her e-mail sign-in on the teacher client (kept in this tab only), then her page. The game never reads it.
    async function teacher() {
      if (busy) return;
      const mail = $("drMail").value.trim(), pw = $("drTpw").value;
      if (!mail || !pw) { say("drTErr", T.teaBad); (mail ? $("drTpw") : $("drMail")).focus(); return; }
      busy = true; say("drTErr", ""); $("drTLogin").disabled = true;
      let error = null;
      try { const tc = W.client("teacher"); const r = await tc.auth.signInWithPassword({ email: mail, password: pw }); error = r && r.error; }
      catch (x) { error = { message: "network: " + String(x && x.message || x) }; }
      busy = false; if ($("drTLogin")) $("drTLogin").disabled = false;
      if (!error) return window.WW_DOOR.go("teacher.html");
      say("drTErr", isNet(String(error.message || "")) ? T.net : T.teaBad);
      $("drTpw").value = ""; $("drTpw").focus();
    }
    async function tester(ctx) {
      if (busy) return;
      const form = !!$("drTst"), mail = form ? $("drXMail").value.trim() : "", pw = form ? $("drXPw").value : "";
      if (form && (!mail || !pw)) { say("drTstErr", T.teaBad); (mail ? $("drXPw") : $("drXMail")).focus(); return; }   // nothing to check
      busy = true; say("drTstErr", ""); $("drTester").disabled = true;
      const db = ctx.sb;
      const out = async line => {   // it did not open: the game's client lets go of the e-mail sign-in again
        if (form) { try { await db.auth.signOut(); } catch (e) {} }
        busy = false; if (!$("drTester")) return;
        $("drTester").disabled = false; say("drTstErr", line);
        if (form) { $("drXPw").value = ""; $("drXPw").focus(); }
      };
      if (form) {
        let error = null;
        try { const r = await db.auth.signInWithPassword({ email: mail, password: pw }); error = r && r.error; }
        catch (x) { error = { message: "network: " + String(x && x.message || x) }; }
        if (error) return out(isNet(String(error.message || "")) ? T.tstFail : T.teaBad);
      }
      let r; try { r = await ctx.testerEnter(); } catch (e) { r = { error: e }; }
      if (r === true || r === "ok" || $("gate").hidden || !$("drTester")) { busy = false; return; }   // the game has started
      return out(r === "teacher" ? T.tstNot : T.tstFail);
    }
    window.WW_DOOR = { open, texts: T, go: url => { location.href = url; } };
    if (ZH) ZH.add({
      "Welcome!": "欢迎！", "Student": "学生", "Teacher": "老师", "Tester": "测试员",
      "Type your name and your password.": "输入你的名字和密码。", "Name": "名字", "Password": "密码", "Log in": "登录", "E-mail": "邮箱",
      "Practice copy. Password: practice": "练习版。密码：practice",
      "Not yet. Check your name and password.": "还没对。检查一下名字和密码。", "Too many tries. Wait a little.": "试了太多次。等一会儿再试。",
      "Can't connect. Tap Log in again.": "连不上。再点一次“登录”。",
      "Type your e-mail and password.": "输入你的邮箱和密码。", "Not yet. Check your e-mail and password.": "还没对。检查一下邮箱和密码。",
      "Practice copy: no password.": "练习版：不用密码。", "Open the teacher page": "打开老师页面",
      "For the adults who test the game.": "给测试游戏的大人用。", "Open the test account": "打开测试账号",
      "That login is not the teacher's.": "这不是老师的账号。", "Can't open it. Try again.": "打不开。再试一次。"
    });
  })();
</script>
</body>
</html>
