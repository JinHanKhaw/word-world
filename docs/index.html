<script>
(function () {
  const W = window.WT, $ = id => document.getElementById(id);
  const sb = W.client();
  let student = null, words = [], sessions = [], quests = [], messages = [], todaySession = null, q = null;
  const PRAISE = ["Nice! You got it!", "Perfect spelling!", "Long word, no problem!", "Level up! Keep going!", "Wow, from memory!", "Your brain remembered!"];
  const today = () => W.today();
  const byId = id => words.find(w => w.id === id);
  const TN = () => (student && student.teacher_name) || "WordWizard"; // the teacher's gamer name inside the game
  function banner(msg) { const b = $("banner"); b.hidden = !msg; b.textContent = msg || ""; }
  // 中文: Chinese under every English instruction (zh.js). Remembered on the device; each flip is logged for the teacher.
  const ZH = window.WT_ZH;
  if (ZH) { ZH.init($("app")); $("zhToggle").setAttribute("aria-pressed", String(ZH.isOn())); }
  $("zhToggle").onclick = () => { if (!ZH) return; ZH.set(!ZH.isOn(), $("app")); $("zhToggle").setAttribute("aria-pressed", String(ZH.isOn())); logEvent("zh_toggle", { on: ZH.isOn() }); drawWorld(); };
  const zhOn = () => !!(ZH && ZH.isOn());

  // ============ data ============
  async function logEvent(type, detail) {
    if (!student) return;
    const { error } = await sb.from("events").insert({ student_id: student.id, session_id: todaySession ? todaySession.id : null, type, detail: detail || {} });
    if (error) banner("No internet? That last step was not saved.");
  }
  const practising = () => !!(q && q.practice);
  async function saveAttempt(w, kind, step, answer, correct, before, after) {
    if (practising()) return;
    const { error } = await sb.from("attempts").insert({ student_id: student.id, session_id: todaySession ? todaySession.id : null, quest_id: q && q.row ? q.row.id : null, word_id: w.id, word: w.word, kind, step, answer, correct, level_before: before, level_after: after });
    if (error) banner("No internet? That answer was not saved.");
  }
  async function saveWord(w, patch) { if (practising()) return; Object.assign(w, patch); const { error } = await sb.from("words").update(patch).eq("id", w.id); if (error) banner("No internet? Progress was not saved."); }
  async function saveSession(patch) { Object.assign(todaySession, patch); const { error } = await sb.from("sessions").update(patch).eq("id", todaySession.id); if (error) banner("No internet? Progress was not saved."); }
  async function saveQuest(row, patch) { if (practising()) return; Object.assign(row, patch); const { error } = await sb.from("quests").update(patch).eq("id", row.id); if (error) banner("No internet? Progress was not saved."); }
  async function loadAll() {
    const t = today();
    const [w, s, qs, m] = await Promise.all([
      sb.from("words").select("*").eq("student_id", student.id).eq("approved", true).order("sort_order").order("created_at"),
      sb.from("sessions").select("*").eq("student_id", student.id).gte("day", W.addDays(t, -400)).order("day"),
      sb.from("quests").select("*").eq("student_id", student.id).order("quest_day"),
      sb.from("messages").select("*").eq("student_id", student.id).order("created_at")
    ]);
    if (w.error || s.error || qs.error) { banner("Could not load your words. Check the internet and reload."); return false; }
    words = w.data || []; sessions = s.data || []; quests = qs.data || []; messages = m.data || [];
    todaySession = sessions.find(x => x.day === t) || null;
    await fromOldLadder();
    return true;
  }
  // An old save from the five-step ladder (1, 3, 7, 14, 30 days): words on step 4 or 5 move once to the new ladder
  // (W.fromOldLadder in common.js says how). A saved due date is kept or cleared, never moved earlier.
  async function fromOldLadder() {
    const moved = [];
    for (const w of words) {
      const p = W.fromOldLadder(w); if (!p) continue;
      const from = w.level; Object.assign(w, p); moved.push({ word: w.word, from, to: p.level });
      const { error } = await ("due" in p ? sb.from("words").update({ level: p.level, due: p.due }) : sb.from("words").update({ level: p.level })).eq("id", w.id);
      if (error) banner("No internet? Progress was not saved.");
    }
    if (moved.length) logEvent("ladder_moved", { words: moved });
  }
  // Entering the game is the daily check-in: that is what the streak counts.
  async function enterToday() {
    if (todaySession) { logEvent("login", {}); return; }
    const { data, error } = await sb.from("sessions").insert({ student_id: student.id, day: today() }).select().single();
    if (error) { banner("Could not check in. Check the internet and reload."); return; }
    todaySession = data; sessions.push(data);
    logEvent("login", { first: true });
  }

  // ============ the plan: 50 levels in 5 zones ============
  // Level 1 opens on the start date the teacher set. Level N opens the day after level N-1 is finished:
  // one level a day, in order, so two new words a day and never a binge. Every 10th level is the zone test.
  const INTRO = w => w.level > 0;
  const LEVELS = 50, PER_ZONE = 10;
  const ZONES = [
    { name: "Sunny Island", emoji: "🏝️", deco: "🌴 🐚 ⛵ 🦀 🌞" },
    { name: "Jungle", emoji: "🌴", deco: "🐒 🦜 🌺 🐸 🍌" },
    { name: "Under the Sea", emoji: "🐠", deco: "🐙 🐚 🪸 🐬 🫧" },
    { name: "Ice Cave", emoji: "🧊", deco: "🐧 ❄️ 💎 🐻‍❄️ ⛄" },
    { name: "Sky Castle", emoji: "☁️", deco: "🏰 🦅 🌈 ⭐ 🪁" }
  ];
  const zoneOf = d => Math.min(ZONES.length - 1, Math.floor((d - 1) / PER_ZONE));
  const isTest = d => d % PER_ZONE === 0;
  const startDate = () => student.start_date || today();
  const maxDay = () => Math.max(LEVELS, words.reduce((m, w) => Math.max(m, w.quest_day || 0), 0));
  const questRow = d => quests.find(x => x.quest_day === d) || null;
  const dayDone = d => { const r = questRow(d); return !!(r && r.completed); };
  const doneOn = d => { const r = questRow(d); return r && r.finished_at ? W.dkey(new Date(r.finished_at)) : null; }; // local date it was finished
  const dayWords = d => words.filter(w => w.quest_day === d);
  const LEVELS_A_DAY = 2; // decided in the interview: a second level may be played the same day, never a third
  const doneToday = () => { const t = today(); return quests.filter(x => x.completed && x.finished_at && W.dkey(new Date(x.finished_at)) === t).length; };
  function dayState(d) {
    if (dayDone(d)) return "done";
    if (d === 1 ? startDate() > today() : !(dayDone(d - 1) && (doneOn(d - 1) < today() || doneToday() < LEVELS_A_DAY))) return "locked";
    return dayWords(d).length ? "open" : "empty"; // empty: the teacher has not put words on this level yet
  }
  function openDay() { for (let d = 1; d <= maxDay(); d++) if (dayState(d) === "open") return d; return null; }
  function nextLockedDay() { for (let d = 1; d <= maxDay(); d++) { const st = dayState(d); if (st === "locked" || st === "empty") return d; } return null; }
  const zoneRule = zi => { const w = words.find(x => x.quest_day && zoneOf(x.quest_day) === zi && x.rule_en); return w ? { en: w.rule_en, zh: w.rule_zh } : null; };
  // Memory checks are limited each day (students.review_cap, W.REVIEW_CAP = 6 unless the teacher changes it); the words that
  // wait longest and are least sure come first (lowest step, then oldest due date); the rest wait for tomorrow.
  // Six a day is what a steady player meets: two new words a day, each met three times (after 1, 4 and 14 days).
  const CHECK_CAP = () => (student && student.review_cap) || W.REVIEW_CAP;
  const checksToday = () => { const t = today(); return quests.filter(x => x.started_at && W.dkey(new Date(x.started_at)) === t).reduce((a, x) => a + (x.reviews_right || 0) + (x.reviews_wrong || 0), 0); };
  function dueReviews() {
    const t = today();
    return words.filter(w => w.level > 0 && w.level < W.DIAMOND && w.due && w.due <= t && w.last_seen !== t)
      .sort((a, b) => a.level !== b.level ? a.level - b.level : (a.due < b.due ? -1 : 1))
      .slice(0, Math.max(0, CHECK_CAP() - checksToday()));
  }
  // The weekly goal replaces the streak: days played this week (Monday to Sunday), goal 5, and a total that never goes down.
  const weekDays = () => { const wk = W.weekStart(today()); return sessions.filter(x => x.day >= wk).length; };
  const totalDays = () => sessions.length;
  function streak() {
    const days = new Set(sessions.map(s => s.day)); let k = today(), n = 0;
    if (!days.has(k)) k = W.addDays(k, -1);
    while (days.has(k)) { n++; k = W.addDays(k, -1); }
    return n;
  }
  // Diamonds are earned by finishing levels and spent in the shop. The balance is worked out, never stored, so it cannot drift.
  const PRICES = { brick: 1, door: 3, window: 2, flower: 2, tree: 4, torch: 3, flag: 5 };
  const ITEMS = [{ id: "door", emoji: "🚪", name: "Door" }, { id: "window", emoji: "🪟", name: "Window" }, { id: "flower", emoji: "🌷", name: "Flower" }, { id: "tree", emoji: "🌳", name: "Tree" }, { id: "torch", emoji: "🔥", name: "Torch" }, { id: "flag", emoji: "🚩", name: "Flag" }];
  const ITEM_COL = { door: "#5c3a1e", window: "#a9ddff", flower: "#ff7ab6", tree: "#2f8f3a", torch: "#ff9b2f", flag: "#e04a3a" };
  const diamondsEarned = () => quests.reduce((a, s) => a + (s.diamonds_earned || 0), 0);

  // Centripetal Catmull-Rom (alpha .5) as cubic Beziers: no cusps or overshoot loops.

  function stepsFor(w, type) {
    const has = { gap: !!(w.sentence_en && W.hasWord(w.sentence_en, w.word)), talk: !!(w.dialogue_q && w.dialogue_a && W.hasWord(w.dialogue_a, w.word)) };
    if (type === "test") return ["listen"];
    if (type === "new") return ["meet", "type", "build", "sentence"];   // meet holds the beats; no "Write it" (21 November)

    const weak = (w.weak_types || []).filter(t => t === "bubbles" || (t === "gap" && has.gap) || (t === "talk" && has.talk));
    const pool = ["bubbles"].concat(has.gap ? ["gap"] : []).concat(has.talk ? ["talk"] : []);
    if (type === "extra") return [weak.length ? weak[(w.wrong_streak || 0) % weak.length] : pool[w.level % pool.length]]; // ONE extra game when an old word was not right (his weak kinds take turns)

        '<div class="lv-slips">' + b.order.map((o, j) => '<button type="button" class="lv-slip nozh" data-j="' + j + '"' + (b.used[j] ? " disabled" : "") + ">" + W.esc(o.p) + "</button>").join("") + "</div>" +
        '<p class="fb" id="fb" aria-live="polite"></p>');

      qb.querySelectorAll(".lv-slip").forEach(btn => btn.onclick = () => {
        const j = +btn.dataset.j; if (b.got >= n || b.used[j]) return;
        if (b.order[j].p === bs[b.got]) {
          b.used[j] = true; btn.disabled = true; W.speak(bs[b.got]); b.got++;
          const slots = qb.querySelectorAll("#built > span"); slots[b.got - 1].className = "lv-got"; slots[b.got - 1].textContent = bs[b.got - 1];
          $("fb").className = "fb"; $("fb").textContent = "";

      if ($("hear")) $("hear").onclick = () => W.speak(k);
      if ($("zhBtn")) $("zhBtn").onclick = () => { $("zhLine").hidden = false; $("zhBtn").hidden = true; logEvent("zh_shown", { word: k }); };

      }

        '<footer class="pg-foot"><button type="button" class="btn" id="hear">' + ICON("speaker") + 'Hear the word</button><span class="grow"></span><button type="button" class="btn primary" id="go">Next' + ICON("arrow") + "</button></footer>");

  // ---- copy the sentence: he builds the word's example sentence from word tiles, then copies it ----
  // At most 8 tiles: for a longer sentence, neighbours are joined (shortest pair first; never into the target word's tile).
  function tilesOf(sentence, word) {
    const t = String(sentence || "").replace(/[‘’]/g, "'").trim().split(/\s+/).filter(Boolean);
    const keyAt = () => t.findIndex(x => W.hasWord(x, word));
    while (t.length > 8) {
      const ki = keyAt(); let best = -1, bl = 1e9;
      for (let i = 0; i < t.length - 1; i++) { if (i === ki || i + 1 === ki) continue; const l = t[i].length + t[i + 1].length; if (l < bl) { bl = l; best = i; } }
      if (best < 0) best = 0;
      t.splice(best, 2, t[best] + " " + t[best + 1]);
    }
    return t;
  }
  // A sentence read aloud the way the story page reads (W.speak says single words only).
  let lvTts = null;
  try { if (window.claude && window.claude.use) window.claude.use("tts").then(t => { lvTts = t || null; }).catch(() => {}); } catch (e) {}
  function sayLine(text) {
    try {
      const vs = "speechSynthesis" in window ? speechSynthesis.getVoices() : [];
      if (vs.length) {
        speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text), v = vs.find(x => /^en(-|_)GB/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
        u.lang = "en-GB"; u.rate = 0.85; if (v) u.voice = v; speechSynthesis.speak(u); return true;
      }
      if (lvTts && lvTts.speak) { lvTts.speak(text).catch(() => {}); return true; }
    } catch (e) {}
    return false;
  }
  // The rude-word list (site/rude.js) for any old text that can still reach his screen (letters in the mailbox, see 10-mail.js).
  // A listed word counts as a whole token and also inside a longer one: with an ending ("idiots", "shitty", "dumbass"), with
  // letters repeated ("stuuupid"), with digits or signs for letters ("1d10t", "$hit"), after "mother" or "bull", spelled out
  // with spaces or dots ("s h i t"), and two pinyin syllables written apart ("sha bi"). Chinese entries match anywhere.
  // Ordinary words that merely contain a listed word ("animal", "scrap", "class") do not count.
  const RUDE_SUB = { "0": "o", "1": "i", "3": "e", "4": "a", "5": "s", "7": "t", "8": "b", "9": "g", "@": "a", "$": "s", "!": "i", "|": "i", "+": "t" };
  const rudeFold = t => String(t).toLowerCase().replace(/[01345789@$!|+]/g, c => RUDE_SUB[c] || c).replace(/[^a-z]/g, "");
  let rudeRes = null, rudeSrc = null;
  function rudeHits(s) {
    const R = window.WW_RUDE; if (!Array.isArray(R) || !R.length) return [];
    if (rudeSrc !== R) {   // one pattern per listed word: each letter may repeat; an ending may follow
      rudeSrc = R;
      const ENDS = "(?:s|es|z|ed|er|ers|ing|in|y|ie|ies|ish|ass|head|heads|face|hole|holes)?";
      // either the letters as listed with an ending, or letters repeated with at most a plural s ("worried" is not "wori" + "ed")
      rudeRes = [].concat(...R.map(x => String(x).toLowerCase()).filter(x => /^[a-z]+$/.test(x))
        .map(x => [new RegExp("^(?:mother|bull)?" + x + ENDS + "$"), new RegExp("^(?:mother|bull)?" + x.replace(/(.)\1*/g, (m, c) => c + "{" + m.length + ",}") + "s?$")]));
    }
    const low = String(s || "").toLowerCase(), hits = [];
    const bad = raw => { const f = rudeFold(String(raw).replace(/^[!|+]+|[!|+]+$/g, "")); return !!f && rudeRes.some(re => re.test(f)); };
    const toks = low.match(/[a-z0-9@$!|+]+/g) || [];
    toks.forEach(t => { if (bad(t)) hits.push(t); });
    for (let i = 0; i < toks.length - 1; i++) if (!bad(toks[i]) && !bad(toks[i + 1]) && bad(toks[i] + toks[i + 1])) hits.push(toks[i] + " " + toks[i + 1]);   // "sha bi"
    for (let i = 0; i < toks.length - 2; i++) if (!bad(toks[i]) && !bad(toks[i + 1]) && !bad(toks[i + 2]) && bad(toks[i] + toks[i + 1] + toks[i + 2])) hits.push(toks.slice(i, i + 3).join(" "));   // "ta ma de"
    (low.match(/(?:\b[a-z0-9@$]\b[\s.\-_*]*){3,}/g) || []).forEach(t => { if (bad(t)) hits.push(t.trim()); });   // "s h i t"
    R.forEach(x => { if (/[^\x00-\x7f]/.test(x) && low.indexOf(String(x).toLowerCase()) >= 0) hits.push(String(x)); });
    return hits;
  }
  function isRude(s) { return rudeHits(s).length > 0; }
  window.WW_LEVEL = Object.assign(window.WW_LEVEL || {}, { isRude, copyCheck: (t, m) => copyCheck(t, m) });   // for checks

  // ---- the sentence: he builds the word's example sentence from word tiles, then copies it on the line ----
  // The copy is checked exactly: capitals do not count, an apostrophe always does (curly = straight), the full stop at the end
  // may be left out, any run of spaces counts as one space. A miss marks the first place that differs; he fixes it.
  // Nothing he types here is saved or shown again; only that he copied it (and how many tries) is logged.
  const copyNorm = t => String(t || "").replace(/[\u2018\u2019`\u00b4]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/\s+/g, " ").trim();
  function copyCheck(typed, model) {
    const m = copyNorm(model), t = copyNorm(typed), ml = m.toLowerCase(), tl = t.toLowerCase();
    if (tl === ml || (/\.$/.test(ml) && tl === ml.slice(0, -1))) return { ok: true, at: -1 };
    let i = 0; while (i < ml.length && tl[i] === ml[i]) i++;
    return { ok: false, at: Math.min(i, ml.length - 1) };
  }
  const copyHtml = (model, at) => { const m = copyNorm(model); return at < 0 ? W.esc(m) : W.esc(m.slice(0, at)) + '<mark class="lv-cmark' + (m[at] === " " ? " lv-cspace" : "") + '">' + (m[at] === " " ? "&nbsp;" : W.esc(m[at])) + "</mark>" + W.esc(m.slice(at + 1)); };
  function renderTiles(w) {
    const k = w.word, s = String(w.sentence_en || "").trim();
    if (!s || !W.hasWord(s, k)) { logEvent("sentence_none", { word: k }); return nextStep(); }   // no example sentence with the word: nothing to build or copy
    if (q.tl && q.tl.copy) return renderCopy(w, s);
    if (!q.tl) {
      // tiles are compared by their text: two tiles with the same text are interchangeable ("the ... the")
      const tiles = tilesOf(s, k), inOrder = o => o.every((x, j) => tiles[x] === tiles[j]); let order = W.shuffle(tiles.map((t, i) => i));
      for (let n = 0; n < 12 && tiles.length > 1 && inOrder(order); n++) order = W.shuffle(order);
      for (let n = 0; n < tiles.length && inOrder(order); n++) order.push(order.shift());   // never starts in the right order
      q.tl = { tiles, order, got: 0, wrong: 0, used: [] };
    }
    const tl = q.tl, n = tl.tiles.length;
    qp(head() + title("Copy the sentence", "<b>Tap</b> the words in order.") +
      '<p class="lv-sline nozh" id="tlBuilt">' + tl.tiles.map((t, i) => i < tl.got ? '<span class="lv-tgot">' + W.esc(t) + "</span>" : '<span class="lv-tslot"></span>').join("") + "</p>" +
      '<div class="lv-tiles" id="tlTiles">' + tl.order.map((o, j) => '<button type="button" class="lv-tile nozh" data-j="' + j + '"' + (tl.used[j] ? " disabled" : "") + ">" + W.esc(tl.tiles[o]) + "</button>").join("") + "</div>" +
      '<p class="fb" id="fb" aria-live="polite"></p>');
    qb.querySelectorAll(".lv-tile").forEach(btn => btn.onclick = () => {
      const j = +btn.dataset.j; if (tl.got >= n || tl.used[j]) return;
      if (tl.tiles[tl.order[j]] === tl.tiles[tl.got]) {
        tl.used[j] = true; btn.disabled = true; tl.got++;
        const slots = qb.querySelectorAll("#tlBuilt > span"); slots[tl.got - 1].className = "lv-tgot"; slots[tl.got - 1].textContent = tl.tiles[tl.got - 1];
        $("fb").className = "fb"; $("fb").textContent = ""; W.sfx("pop");
        if (tl.got === n) built();
      } else {
        tl.wrong++; W.sfx("notyet"); btn.classList.add("lv-shake"); setTimeout(() => btn.classList.remove("lv-shake"), 400);
        $("fb").className = "fb bad"; $("fb").textContent = "Not yet. Which word comes next?";
      }
    });
    async function built() {
      const qq = q, ok = tl.wrong === 0;
      await saveAttempt(w, "sentence", "tiles", s, ok, w.level, w.level);
      logEvent("step_done", { word: k, step: "tiles", first_try: ok });

    }
    Guide.step("sentence");
  }
  // After the tiles: the sentence stays on the page; he types it. Only "Skip" leaves without it (logged).
  function renderCopy(w, s) {
    const k = w.word, cp = q.tl.copy;
    qp(head() + title("Copy the sentence", "<b>Copy</b> the sentence.") +
      '<div class="lv-sdone"><p class="lv-sline lv-sfull lv-cmodel nozh" id="tlBuilt">' + copyHtml(s, -1) + '</p><button type="button" class="sound" id="lvSay" aria-label="Hear the sentence">' + ICON("speaker") + "</button></div>" +
      '<form class="answer lv-copy" id="cf" autocomplete="off"><label class="line lv-long" id="ansLine">' + ICON("pencil") +

  // ---- one new-rule word at the end of a level: a word he was never taught that follows the island's rule ----
  // He hears it and types it, ONE try; then the spelling is shown in beats either way. +1 diamond when right; no ladder.
  const probeList = isl => ((window.WW_PROBES || {})[isl] || []).filter(p => p && p.word && !words.some(w => W.key(w.word) === W.key(p.word)));
  const probeKey = () => "ww.probes." + (student ? student.id : "");

      '<footer class="pg-foot" id="pbFoot" hidden><span class="grow"></span><button type="button" class="btn primary" id="go">Next' + ICON("arrow") + "</button></footer>");

  // Scoring step (type for new words, listen for old words and the island test): the first try sets the level; he keeps trying until it is right.
  async function checkSpelling(val) {

      else if (practising()) patch = { level: w.level };
      // the ladder (common.js): right -> one step up (after the 14-day meeting: star word); not right -> one step down, back tomorrow.
      // The island test is a fourth meeting on top of the three: right there leaves the step and the date as they are (so every
      // word still meets 1, 4 and 14 days, and the old words a day stay six); not right there drops the word as anywhere else.
      else if (it.type === "test" && right) patch = { level: w.level, last_seen: today(), wrong_streak: 0 };

      await lvAttempt(w, it.type, it.step, a, right, before, patch.level, hn);
      const s = {}, r = q.row;
      if (it.type === "new") { right ? s.new_right = (r.new_right || 0) + 1 : s.new_wrong = (r.new_wrong || 0) + 1; s.new_count = (r.new_count || 0) + 1; }
      else if (it.type === "test") { s.test_total = (r.test_total || 0) + 1; if (right) s.test_right = (r.test_right || 0) + 1; }
      else { right ? s.reviews_right = (r.reviews_right || 0) + 1 : s.reviews_wrong = (r.reviews_wrong || 0) + 1; }

      if (D && D.tables && !rows.length) {
        const seeds = D.tables.school_seed || (D.tables.school_seed = []);
        if (!seeds.some(x => x.student_id === student.id)) {
          seeds.push({ student_id: student.id, at: new Date().toISOString() });
          const now = new Date().toISOString(), date = W.addDays(today(), 3);
          r = await sb.from("school_words").insert(SC_SAMPLE.map(([word, zh]) => ({ student_id: student.id, word, meaning_zh: zh, dictation_date: date, added_at: now, tries: 0, right: 0, last_seen: null, last_right: null }))).select();
          rows = (r && r.data) || [];
        }
      }
      scRows = rows;
      const t = await sb.from("school_tests").select("*").eq("student_id", student.id);
      scTests = (t && t.data) || [];
    } catch (e) { scRows = scRows || []; }
    renderToday();
  }
  (function scWait() {   // no hook tells us when he is in: look until student and today's session are there
    const tick = () => { try { if (student && todaySession && scLoadedFor !== student.id) scLoad(); } catch (e) {} };
    const id = setInterval(() => { tick(); if (scLoadedFor) clearInterval(id); }, 300);
  })();

  // ---- the current list, the order, today's task ----
  function scList() {
    if (!scRows) return null;
    const t = today(), dates = scRows.map(r => r.dictation_date).filter(d => d && d >= t).sort();
    if (!dates.length) return null;
    const date = dates[0];
    return { date, rows: scRows.filter(r => r.dictation_date === date).sort((a, b) => (a.added_at || "") < (b.added_at || "") ? -1 : (a.added_at || "") > (b.added_at || "") ? 1 : 0) };
  }
  // Weakest first: never seen, then last time not right, then lowest share right, then longest not seen.
  function scWeakest(rows) {
    const rank = r => !r.tries ? 0 : r.last_right === false ? 1 : 2;
    const share = r => r.tries ? (r.right || 0) / r.tries : 0;
    return rows.slice().sort((a, b) => rank(a) - rank(b) || share(a) - share(b) || ((a.last_seen || "") < (b.last_seen || "") ? -1 : (a.last_seen || "") > (b.last_seen || "") ? 1 : 0));
  }
  // Has he typed it right from memory before (a first try that counted, on an earlier day)? Then Look and Copy are skipped.
  const scKnown = r => (r.right || 0) > 0;
  const scDayOf = iso => iso ? W.dkey(new Date(iso)) : "";
  const scDrillRow = () => quests.find(x => x.kind === "school" && scDayOf(x.started_at) === today()) || null;
  const scTestToday = () => scTests.find(x => x.taken_on === today()) || null;
  function scToday() {
    const list = scList(); if (!list) return null;
    const t = today(), dictDue = t >= W.addDays(list.date, -1) && !scTests.some(x => x.dictation_date === list.date);
    if (dictDue) return { list, mode: "dictation", done: false, n: list.rows.length };
    return { list, mode: "drill", done: !!(scDrillRow() || scTestToday()), n: Math.min(SC_DRILL, list.rows.length) };
  }
  // Today's fourth part (drawn by renderToday in 90-boot).
  function schoolPart() {
    const s = scToday(); if (!s) return null;
    return { done: s.done, n: s.done ? "" : s.n, label: "School words" };
  }

  // ---- what the game knows about a school word: its Chinese, its picture, its beats ----
  // The tutor's Chinese (meaning_zh) first; else the game's own word of the same spelling (his words, then the bank).
  // The picture: the school word's own painting (window.WW_SCHOOL_PICS, site/img/school/pics.js) first; else, for one of
  // the game's own words, its painting (picSrc falls back to img/words/ by itself).
  const scSchoolPic = r => { const SP = window.WW_SCHOOL_PICS || {}, low = String(r.word || "").toLowerCase().replace(/[\u2018\u2019`\u00b4]/g, "'"); return SP[low] || SP[W.key(r.word)] || ""; };
  let scBankBy = null;
  function scGameWord(r) {
    const k = W.key(r.word);
    const mine = (typeof words !== "undefined" && Array.isArray(words) ? words : []).find(w => W.key(w.word) === k);
    if (!scBankBy) { scBankBy = {}; (window.WW_BANK || []).forEach(b => { scBankBy[W.key(b[0])] = { word: b[0], chunks: b[1], meaning_zh: b[3] }; }); }
    const bank = scBankBy[k] || null;
    return { word: r.word, chunks: (mine && mine.chunks) || (bank && bank.chunks) || "", picture: scSchoolPic(r) || (mine && mine.picture) || "", zh: String(r.meaning_zh || (mine && mine.meaning_zh) || (bank && bank.meaning_zh) || "").trim() };
  }
  const scZh = r => scGameWord(r).zh;
  // Beats only when the game has them for this word and they spell it (beatsOf gives none for a word outside the bank).
  function scBeats(r) {
    const g = scGameWord(r), bs = beatsOf(g);
    return bs.length > 1 && W.key(bs.join("")) === W.key(r.word) ? bs : [];
  }

  // ---- speech for school words: slower than anywhere else, twice when a word first shows, and "Slowly" ----
  // The device voice: 0.5 (the game's "slow" is 0.62); "Slowly" 0.42. On claude.ai, where the page reader speaks instead,
  // 0.7, its slowest. The tutor's "slower" choice for his laptop still multiplies the device voice (W.utter).
  const SC_RATE = 0.5, SC_RATE_SLOWEST = 0.42, SC_READER_RATE = 0.7, SC_GAP = 1000, SC_BEAT_GAP = 450;
  let scReader = null, scReading = false, scTok = 0, scSpoken = 0, scLastEnd = Promise.resolve();
  try { if (window.claude && window.claude.use) window.claude.use("tts").then(t => { scReader = t || null; }).catch(() => {}); } catch (e) {}
  const scNoVoice = () => { try { return !("speechSynthesis" in window) || speechSynthesis.getVoices().length === 0; } catch (e) { return true; } };
  const scPause = ms => new Promise(res => setTimeout(res, ms));
  const SC_SAID = window.WW_SC_SAID = [];   // what was said and at what speed, for checks: "word@0.5"
  // Say one text at a rate. Resolves when it has been said (or after a fair estimate when the voice does not tell).
  function scSay(text, rate) {
    const said = String(text);
    SC_SAID.push(said + "@" + rate); if (SC_SAID.length > 300) SC_SAID.shift();
    return new Promise(res => {
      let done = false, min = false, spoke = false;
      const est = Math.min(8000, (300 + 90 * said.length) / rate), byReader = !!(scReader && scNoVoice());
      const cap = byReader ? Math.max(est + 400, 4500) : est + 400;      // the reader starts late at times: give it room
      const wid = W.wordBegin ? W.wordBegin(cap + 200) : 0;               // a school word is a word: Orbit waits for it
      const fin = () => { if (!done && min && spoke) { done = true; if (W.wordEnd) W.wordEnd(wid); res(); } };
      setTimeout(() => { min = true; spoke = true; fin(); }, cap);        // whatever the voice says, never wait longer
      try {
        if (byReader) {
          scReading = true;
          setTimeout(() => { min = true; fin(); }, est * 0.6);
          const p = W.read ? W.read(W.key(said) || said, { rate: SC_READER_RATE }) : scReader.speak(W.key(said) || said, { rate: SC_READER_RATE });
          if (p && p.then) p.then(() => { scReading = false; spoke = true; fin(); }, () => { scReading = false; spoke = true; fin(); });
          return;
        }
        if (!("speechSynthesis" in window)) return;
        const u = W.utter(said, rate);
        u.onend = u.onerror = () => { min = true; spoke = true; fin(); };
        speechSynthesis.speak(u);
      } catch (e) {}
    });
  }
  // Is this word the school word on the page now? Then W.speak (ours, and the Hint button's) says it at the school speed.
  function scCurRow() { const R = scRun; if (!R) return null; const it = R.queue ? R.queue[R.i] : null; return it ? it.r : R.rows ? R.rows[R.i] : null; }
  const scLive = () => { const p = $("panel"), b = $("panelBody"); return !!(p && !p.hidden && b && b.querySelector(".sc-page")); };
  const scSpeakOrig = W.speak;
  W.speak = function (word, o) {
    const r = scCurRow();
    if (r && scLive() && W.key(word) && W.key(word) === W.key(r.word)) {
      scSpoken++;
      try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
      scLastEnd = scSay(r.word, SC_RATE);
      return true;
    }
    return scSpeakOrig.apply(this, arguments);
  };
  // Say the word once or twice, with a short gap; a page change (or any other speaking) stops the second time.
  function scHear(r, times, gapFrom) {
    const tok = ++scTok;
    W.speak(r.word, { slow: true });
    if (times < 2) return;
    const n = scSpoken;
    Promise.all([scLastEnd.then(() => scPause(SC_GAP)), scPause(gapFrom || 0)]).then(() => {
      if (tok === scTok && n === scSpoken && scCurRow() === r && scLive()) W.speak(r.word, { slow: true });
    });
  }
  // "Slowly": beat by beat when the game has the beats, else the whole word once more at the slowest speed.
  async function scSlowly(r) {
    const tok = ++scTok, bs = scBeats(r);
    try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
    logEvent("school_slowly", { word: r.word, beats: bs.length });
    if (!bs.length) { await scSay(r.word, SC_RATE_SLOWEST); return; }
    for (let i = 0; i < bs.length; i++) {
      if (tok !== scTok || !scLive()) return;
      await scSay(bs[i].toLowerCase(), SC_RATE_SLOWEST);
      if (i < bs.length - 1) await scPause(SC_BEAT_GAP);
    }
  }
  // Leaving a page: the school word stops. (Orbit no longer stops a word that is being said, so the page does it itself.)
  function scQuiet() {
    scTok++;
    try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
    try { if (scReading && W.readStop) { scReading = false; W.readStop(); } } catch (e) {}
  }

  // ---- small pieces of the page ----
  const scWeekday = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { weekday: "long" });
  function scWhen(date) {
    const n = W.daysBetween(today(), date);
    return n <= 0 ? "The school dictation is today." : n === 1 ? "The school dictation is tomorrow." : "The school dictation is on " + scWeekday(date) + ".";
  }
  function scHead(brow, at, n, count) {
    const trail = count ? '<span class="sc-count zhk">Word ' + (at + 1) + " of " + n + "</span>"
      : n ? '<ol class="trail" aria-label="' + (at + 1) + " of " + n + '">' + Array.from({ length: n }, (_, i) => '<li class="' + (i < at ? "done" : i === at ? "now" : "") + '"></li>').join("") + "</ol>" : "";
    return '<header class="pg-head"><span class="eyebrow">' + brow + "</span>" + trail +
      (n ? '<button type="button" class="btn quiet" id="sc-stop">Stop here</button>' : "") + "</header>";
  }
  const scTitle = (t, doHtml) => '<h3 class="pg-title">' + t + "</h3>" + (doHtml ? '<p class="do">' + doHtml + "</p>" : "");
  // The three moves of a new word, the one he is on marked.
  const SC_MOVES = [["look", "Look"], ["copy", "Copy"], ["cover", "From memory"]];
  const scMoves = at => '<ol class="sc-moves" aria-label="' + W.esc(SC_MOVES.find(m => m[0] === at)[1]) + '">' + SC_MOVES.map(([k, t], i) =>
    '<li class="' + (k === at ? "now" : SC_MOVES.findIndex(m => m[0] === at) > i ? "done" : "") + '"><i>' + (i + 1) + '</i><span class="zhk">' + t + "</span></li>").join("") + "</ol>";
  function scOpen(html, steps) {
    openPanel('<div class="sc-page' + (steps ? " sc-steps" : "") + '">' + html + "</div>", !!steps);
    const s = $("sc-stop"); if (s) s.onclick = scStop;
  }
  function scStop() { if (scRun) logEvent("school_pause", { kind: scRun.kind, at: scRun.i + 1 }); scRun = null; scQuiet(); Guide.quiet(); closePanel(); }
  const scHome = () => { scRun = null; scQuiet(); closePanel(); };
  const scWordList = (rows, marks) => '<ul class="sc-list nozh">' + rows.map(r => '<li class="' + (marks[r.id] ? "sc-yes" : "sc-no") + '">' + (marks[r.id] ? ICON("check") : '<i class="sc-dot"></i>') + "<span>" + W.esc(r.word) + "</span></li>").join("") + "</ul>";
  // The end line: never a number that can be 0.
  const scReadyLine = n => n > 0 ? n + (n === 1 ? " word" : " words") + " ready for school." : "Good practice. More tomorrow.";
  const scZhLine = (r, cls) => { const z = scZh(r); return z ? '<p class="' + cls + ' nozh" lang="zh">' + W.esc(z) + "</p>" : ""; };
  // "Slowly": a speaker with three dots, one for each beat (drawn here in the sprite's style).
  const SC_SLOW_IC = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9.5h3L9.8 6v12l-4.3-3.5h-3z"/><path d="M13.6 12h.01M17.3 12h.01M21 12h.01" stroke-width="3.2"/></svg>';
  const scSlowBtn = () => '<button type="button" class="btn sc-slow" id="sc-slow">' + SC_SLOW_IC + "Slowly</button>";

  // ============ the page at the watchtower ============
  function openSchool() {
    scRun = null; W.sfx("pop");
    if (scRows === null) { scOpen('<header class="pg-head"><span class="eyebrow">School words</span></header><p class="do sc-wait">Loading…</p>'); scLoad().then(() => { if (!$("panel").hidden && $("panelBody").querySelector(".sc-wait")) openSchool(); }); return; }
    const s = scToday();
    if (!s) {
      scOpen(scHead("School words") + scTitle("School words", "There is no school list this week.") +
        '<p class="hint sc-gap">Your teacher adds the words here.</p>' +
        '<footer class="pg-foot"><span class="grow"></span><button type="button" class="btn primary" id="sc-home">' + ICON("home") + "Back to the outpost</button></footer>");
      $("sc-home").onclick = scHome; Guide.text("There is no school list this week.", "这周没有学校的单词表。"); logEvent("school_open", { list: false }); return;
    }
    logEvent("school_open", { list: true, mode: s.mode, done: s.done, dictation_date: s.list.date });
    if (s.mode === "dictation") return scDictIntro(s.list);
    if (s.done) return scDoneToday(s.list);
    scDrillIntro(s.list);
  }
  function scDoneToday(list) {
    const t = scTestToday(), last = scDrillRow() && scLast;
    const line = t ? (t.score > 0 ? "Practice dictation: " + t.score + " of " + t.total + "." : "You did the practice dictation.") : last ? last : "You did your school words today.";
    scOpen(scHead("School words") + '<div class="sc-mid"><div class="stamp sc-ok"><span>school</span><b>' + ICON("check") + "</b><span>today</span></div>" +
      scTitle("Done for today", W.esc(line)) + '<p class="hint">' + W.esc(scWhen(list.date)) + "</p>" +
      '<p class="hint">Come back tomorrow for more.</p></div>' +
      '<footer class="pg-foot sc-center"><button type="button" class="btn primary" id="sc-home">' + ICON("home") + "Back to the outpost</button></footer>");
    $("sc-home").onclick = scHome; Guide.text("Done for today. Come back tomorrow for more.", "今天完成了。明天再来。");
  }

  // ---- the daily go: five words, each learned in three moves (or only the last when he knows it) ----
  function scDrillIntro(list) {
    const n = Math.min(SC_DRILL, list.rows.length);
    scOpen(scHead("School words") + scTitle("School words", "<b>Look.</b> <b>Copy.</b> Then <b>type</b> from memory.") +
      '<div class="note sc-note">' + ICON("book") + '<span class="cap zhk">From your school list</span><p>' + n + " words today</p>" +
      "<p>" + W.esc(scWhen(list.date)) + "</p></div>" +
      '<footer class="pg-foot"><span class="grow"></span><button type="button" class="btn primary" id="sc-go">Start' + ICON("arrow") + "</button></footer>");
    $("sc-go").onclick = () => scStartDrill(list); $("sc-go").focus();
    Guide.text("Look. Copy. Then type from memory.", "看一看。抄一遍。然后凭记忆打出来。");
  }
  function scStartDrill(list) {
    const rows = scWeakest(list.rows).slice(0, SC_DRILL);
    scRun = { kind: "drill", list, rows, queue: rows.map(r => ({ r, move: scKnown(r) ? "cover" : "look", learn: !scKnown(r) })), i: 0, first: {}, ready: {}, backAdded: false, hints: {}, startedAt: Date.now() };
    logEvent("school_drill_start", { dictation_date: list.date, words: rows.map(r => r.word), learn: rows.filter(r => !scKnown(r)).map(r => r.word) });
    scStep();
  }
  function scStep() {
    const it = scRun.queue[scRun.i];
    if (it.move === "look") return scLook(it);
    if (it.move === "copy") return scCopy(it);
    return scCover(it);
  }
  // Next move of this word, or the next word; after the five, the words missed in Cover come back once; then the end.
  function scNext() {
    const R = scRun, it = R.queue[R.i];
    if (it.move === "look") { it.move = "copy"; return scStep(); }
    if (it.move === "copy") { it.move = "cover"; return scStep(); }
    R.i++;
    if (R.i >= R.queue.length && R.kind === "drill" && !R.backAdded) {
      R.backAdded = true;
      R.rows.filter(r => R.first[r.id] === false).forEach(r => R.queue.push({ r, move: "cover", back: true }));
      if (R.queue.length > R.i) logEvent("school_back", { words: R.queue.slice(R.i).map(x => x.r.word) });
    }
    if (R.i < R.queue.length) return scStep();
    R.kind === "drill" ? scDrillEnd() : scRetypeEnd();
  }
  const scBrow = R => R.kind === "drill" ? "School words" : "Practice dictation";

  // Look: the word large, its Chinese, the picture when the game has one; said slowly, twice.
  function scLook(it) {
    const R = scRun, r = it.r, g = scGameWord(r), pic = hasPic(g);
    const wordHtml = '<div class="sc-show"><p class="sc-word nozh" lang="en">' + W.esc(r.word) + "</p>" + scZhLine(r, "sc-zhm") + "</div>";
    scOpen(scHead(scBrow(R), R.i, R.queue.length) + scTitle("Look and listen", "<b>Look</b> at the word. <b>Listen.</b>") + scMoves("look") +
      (pic ? '<div class="sc-meet">' + picHtml(g, "sc-pic") + wordHtml + "</div>" : '<div class="sc-meet sc-solo">' + wordHtml + "</div>") +
      '<footer class="pg-foot"><button type="button" class="btn" id="sc-hear">' + ICON("speaker") + "Hear it again</button>" + scSlowBtn() +
      '<span class="grow"></span><button type="button" class="btn primary" id="sc-next">Next' + ICON("arrow") + "</button></footer>", true);
    $("sc-hear").onclick = () => scHear(r, 1);
    $("sc-slow").onclick = () => scSlowly(r);
    $("sc-next").onclick = () => { if (scRun === R && R.queue[R.i] === it && it.move === "look") scNext(); };
    $("sc-next").focus();
    Guide.text("Look at the word. Listen.", "看这个词。听一听。");
    scHear(r, 2);
  }

  // Copy: the word stays; he types it; a miss marks the first letter that differs and he fixes it.
  function scLetters(word, mark) {
    return Array.from(String(word)).map((c, i) => '<span class="sc-l' + (i === mark ? " sc-here" : "") + '">' + W.esc(c) + "</span>").join("");
  }
  // Where his typing first differs from the word, as a position in the word as shown (-1: he typed more than the word).
  function scDiffAt(typed, word) {
    const chars = Array.from(String(word)), at = [];
    chars.forEach((c, i) => { if (W.key(c)) at.push(i); });
    const kw = W.key(word), ka = W.key(typed);
    let i = 0; while (i < kw.length && ka[i] === kw[i]) i++;
    return i >= kw.length ? -1 : at[i];
  }
  function scCopy(it) {
    const R = scRun, r = it.r;
    it.copyMiss = 0;
    scOpen(scHead(scBrow(R), R.i, R.queue.length) + scTitle("Copy the word", "<b>Type</b> the word you see.") + scMoves("copy") +
      '<div class="sc-show sc-copy"><p class="sc-word nozh" lang="en" id="sc-model">' + scLetters(r.word, null) + "</p>" + scZhLine(r, "sc-zhm sc-zhs") + "</div>" +
      '<form class="answer" id="sc-form" autocomplete="off"><label class="line" id="sc-line">' + ICON("pencil") +
      '<input id="sc-ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24" placeholder="type the word here" aria-label="Type the word"></label>' +
      '<button type="submit" class="btn primary" id="sc-check">Check</button></form>' +
      '<p class="fb" id="sc-fb" aria-live="polite"></p>' +
      '<footer class="pg-foot sc-foot"><button type="button" class="btn" id="sc-hear">' + ICON("speaker") + "Hear it again</button>" + scSlowBtn() + "</footer>", true);
    const inp = $("sc-ans");
    $("sc-hear").onclick = () => { scHear(r, 1); inp.focus(); };
    $("sc-slow").onclick = () => { scSlowly(r); inp.focus(); };
    inp.addEventListener("input", () => { const f = $("sc-fb"); if (/bad/.test(f.className)) { f.className = "fb"; } });
    $("sc-form").onsubmit = e => {
      e.preventDefault(); if (inp.readOnly) return;
      const a = String(inp.value || "").trim(); if (!W.key(a)) return;
      const f = $("sc-fb");
      if (W.same(a, r.word)) {
        inp.readOnly = true; $("sc-line").classList.add("good"); $("sc-model").innerHTML = scLetters(r.word, null);
        W.sfx("right"); f.className = "fb good"; f.innerHTML = ICON("check") + "Yes! Now from memory.";
        logEvent("school_copy", { word: r.word, misses: it.copyMiss });
        setTimeout(() => { if (scRun === R && R.queue[R.i] === it && it.move === "copy") scNext(); }, 1100);
      } else {
        it.copyMiss++; W.sfx("notyet");
        const at = scDiffAt(a, r.word);
        $("sc-model").innerHTML = scLetters(r.word, at);
        f.className = "fb bad"; f.textContent = at < 0 ? "Not yet. Too many letters." : "Not yet. Look here.";
        inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    };
    inp.focus();
    Guide.text("Type the word you see.", "把你看到的词打出来。");
    scHear(r, 1);
  }

  // Cover (and every typing page: a known word, a word that comes back, the missed words after the dictation):
  // he hears the word and types it from memory; the Hint button as in a level; he types until right.
  function scCover(it) {
    const R = scRun, r = it.r, g = scGameWord(r), pic = hasPic(g) ? picHtml(g, "sc-mini") : "";
    R.peek = false; R.busy = false;
    const title = it.back ? scTitle("One more time", "<b>Listen.</b> <b>Type</b> the word you hear.") : it.learn ? scTitle("Now from memory", "<b>Listen.</b> <b>Type</b> the word you hear.") : scTitle("Listen and type", "<b>Listen.</b> <b>Type</b> the word you hear.");
    scOpen(scHead(scBrow(R), R.i, R.queue.length) + title + (it.learn ? scMoves("cover") : "") +
      '<div class="sc-cue"><button type="button" class="sound sc-big" id="sc-hear" aria-label="Hear the word">' + ICON("speaker") + "</button>" + scSlowBtn() + "</div>" +
      '<form class="answer' + (pic ? " sc-withpic" : "") + '" id="sc-form" autocomplete="off">' + pic + '<label class="line" id="sc-line">' + ICON("pencil") +

  async function scCheck(val) {
    const R = scRun; if (!R || R.busy) return;
    const it = R.queue[R.i], r = it.r, a = String(val || "").trim(); if (!W.key(a)) return;
    const right = W.same(a, r.word), first = !it.tried, hk = r.id + (it.back ? ":back" : ""), hn = R.hints[hk] ? R.hints[hk].n : 0;
    const counts = first && !it.back && R.kind === "drill";   // the try that counts, exactly as the drill's first try counted before
    it.tried = true; R.busy = true;
    if (counts) {
      R.first[r.id] = right;
      const patch = { tries: (r.tries || 0) + 1, right: (r.right || 0) + (right ? 1 : 0), last_seen: today(), last_right: right };
      Object.assign(r, patch);
      try { const { error } = await sb.from("school_words").update(patch).eq("id", r.id); if (error) banner("No internet? That answer was not saved."); } catch (e) {}
    }
    if (first && right && R.kind === "drill") R.ready[r.id] = true;
    scAttempt(r, R.kind === "drill" ? (counts ? "school" : "school_retry") : "school_test", a, right, hn);
    if (scRun !== R || R.queue[R.i] !== it) return;
    R.busy = false;
    const f = $("sc-fb");
    if (right) {
      W.sfx("right"); $("sc-line").classList.add("good"); $("sc-ans").readOnly = true; f.className = "fb good"; R.hk.right();
      f.innerHTML = ICON("check") + (first ? "Yes! You spelled " + W.esc(r.word) + " without looking." : "Yes! Now you have it.");
      Guide.right(r.word, first ? "test" : "retry");
      if (counts) { const s = $("sc-stamp"); s.innerHTML = "<span>first try</span><b>" + ICON("check") + "</b><span>school</span>"; s.hidden = false; }
      setTimeout(() => { if (scRun === R && R.queue[R.i] === it) scNext(); }, first ? 1300 : 1000);
    } else {
      W.sfx("notyet"); R.miss = R.miss || {}; R.miss[hk] = (R.miss[hk] || 0) + 1;
      R.hk.miss(a);
      if (R.miss[hk] === 2 && R.hk.left()) Guide.wrong(r.word, 2);   // Orbit points to the Hint button; he never says the word
      $("sc-line").classList.add("bad"); f.className = "fb bad";
      f.textContent = "Not yet. Try again.";
      R.peek = true; const inp = $("sc-ans"); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  }

  // ============ Orbit's training (owner: patterns team) ============
  // When the first tries of the last 7 days show the same pattern at least twice (site/patterns.js), the next level holds one
  // more part between the old words and the new words: Orbit's tip (spoken), then three words he has met that train that
  // pattern: hear and type, the old-word page. Nothing moves on the ladder; tries are saved with kind "training" (later tries
  // as "retry"). One diamond for finishing, paid at once as the level pays. At most one training a day (event "training_done").
  // 80-level.js calls trainingTurns() in startQuest and renderTraining() in renderStep (lines marked "training hook").
  const TR_KINDS = ["new", "review", "test", "mixed"];   // first tries in the level's own parts; training tries do not start a training
  const TR_WORDS = 3;
  let trDay = null;   // the day a training was finished on this page
  // One example per pattern, the letters to look at in [brackets], "-" between beats; a word that is one of the three is never shown.
  const TR_EXAMPLE = {
    double: ["ra[b]-[b]it", "pa[r]-[r]ot", "ha[p]-[p]y"], vowel: ["b[a]n[a]n[a]", "b[a]sk[e]t"], silent_e: ["invit[e]", "pancak[e]"],
    ending: ["jump-[ing]", "camp-[ing]"], beat_missing: ["re-[mem]-ber", "to-[geth]-er"], m_before_pb: ["nu[m]ber", "pu[m]pkin"],
    cluster: ["san[d]wich", "pum[p]kin"], apostrophe: ["don[']t"], order: [], other: []
  };
  const trApi = () => window.WW_PATTERNS || null;

  // The training turns for this level, or [] (no pattern, done today, no words to train it, or patterns.js missing).
  async function trainingTurns(day, due, fresh, skip) {
    const P = trApi(); if (!P || !student || trDay === today()) return [];
    try {
      const since = new Date(Date.now() - 7 * 864e5).toISOString();
      const [a, ev] = await Promise.all([
        sb.from("attempts").select("*").eq("student_id", student.id).gte("created_at", since),
        sb.from("events").select("*").eq("student_id", student.id).eq("type", "training_done")
      ]);
      if ((ev.data || []).some(e => e.created_at && W.dkey(new Date(e.created_at)) === today())) { trDay = today(); return []; }
      const beats = x => { const w = words.find(v => W.key(v.word) === W.key(x)); return w ? w.chunks : null; };
      const pats = P.summary(a.data || [], { kinds: TR_KINDS, beats }).filter(p => p.code !== "other" && p.count >= 2);
      for (const p of pats) {
        const pick = trPick(p, due, fresh);
        if (!pick.length) continue;
        pick.forEach(w => skip.add(w.id));
        return [{ w: pick[0], type: "training", step: "trtip", part: "training", code: p.code, count: p.count }]
          .concat(pick.map(w => ({ w, type: "training", step: "train", part: "training", code: p.code })));
      }
    } catch (e) {}
    return [];
  }
  // Words he has met that hold the pattern: the ones he slipped on first, then the ones not asked today, weakest first.
  function trPick(p, due, fresh) {
    const P = trApi(), newIds = new Set(fresh.map(w => w.id)), dueIds = new Set(due.map(w => w.id));
    const slipped = new Set(p.examples.map(x => W.key(x.word)));
    const score = w => (slipped.has(W.key(w.word)) ? 0 : 4) + (dueIds.has(w.id) ? 2 : 0);
    return words.filter(w => w.level > 0 && !newIds.has(w.id) && P.has(p.code, w.word, w.chunks))
      .sort((x, y) => score(x) - score(y) || x.level - y.level || (String(x.last_seen || "") < String(y.last_seen || "") ? -1 : 1))
      .slice(0, TR_WORDS);
  }
  function trExample(code, trained) {
    const used = new Set(trained.map(w => W.plain(w.word)));
    const ex = (TR_EXAMPLE[code] || []).find(s => !used.has(W.plain(s)));

        if (r && r.completed) { if (r.finished_at && W.dkey(new Date(r.finished_at)) === dayKey(0)) r.finished_at = iso(1); continue; }   // not today: at most two levels a day
        const n = back++, k = dayKey(n);
        if (!r) { r = { id: "ts-q" + d, student_id: s.id, quest_day: d, started_at: iso(n), diamonds_earned: 4, new_right: 2, new_wrong: 0, reviews_right: 0, reviews_wrong: 0, test_right: 0, test_total: 0 }; T().quests.push(r); }
        r.completed = true; r.finished_at = iso(n); r.started_at = r.started_at || iso(n);
        if (!T().sessions.some(x => x.student_id === s.id && x.day === k)) T().sessions.push({ id: "ts-s" + d, student_id: s.id, day: k, mail_opened_at: iso(n), created_at: iso(n) });
        T().words.filter(w => w.quest_day === d).forEach(w => { if (!(w.level > 0)) { w.level = 2; w.introduced_on = k; } w.last_seen = w.last_seen || k; });
      }
      T().words.forEach(w => { if (w.level > 0 && w.quest_day && w.quest_day < target) w.due = W.addDays(dayKey(0), 5); });
      if (!s.start_date || s.start_date > dayKey(back)) s.start_date = dayKey(back);
    }
    function islandTest() {
      let cur = 1; while (done(cur)) cur++;
      const target = Math.ceil(cur / PER_ZONE) * PER_ZONE;
      if (!T().words.some(w => w.quest_day === target)) { banner("There is no island test after this level."); return; }
      finishBefore(target);
      // The test level's own two new words are already met, so the level is the island test and nothing else.
      T().words.filter(w => w.quest_day === target).forEach(w => { if (!(w.level > 0)) { w.level = 1; w.introduced_on = dayKey(0); w.last_seen = dayKey(0); w.due = W.addDays(dayKey(0), 1); } });
      mailRead(); go("test");
    }
    // Today's task (the tutor, 21 November): the mail, today's level and one go of school words when there is a school list,
    // so that free play really opens after the reload.
    function finishTask() {
      let cur = 1; while (done(cur)) cur++;
      const s = me();
      if (T().words.some(w => w.quest_day === cur)) {
        finishBefore(cur);
        let r = T().quests.find(x => x.quest_day === cur);
        if (!r) { r = { id: "ts-q" + cur, student_id: s.id, quest_day: cur, started_at: iso(0), diamonds_earned: 4, new_right: 2, new_wrong: 0, reviews_right: 0, reviews_wrong: 0, test_right: 0, test_total: 0 }; T().quests.push(r); }
        r.completed = true; r.finished_at = iso(0);
        T().words.filter(w => w.quest_day === cur).forEach(w => { if (!(w.level > 0)) { w.level = 1; w.introduced_on = dayKey(0); w.last_seen = dayKey(0); w.due = W.addDays(dayKey(0), 1); } });
      }
      // School words: the current list is the one with the nearest dictation date from today on (82-school scList).
      // No rows yet and never seeded: the sample list (dictation in three days) comes on the next load, so today's go is a drill.
      const t = dayKey(0), mine = (T().school_words || []).filter(x => x.student_id === s.id);
      const sw = mine.filter(x => x.dictation_date && x.dictation_date >= t);
      const seeds = !mine.length && !(T().school_seed || []).some(x => x.student_id === s.id);
      if (sw.length || seeds) {
        const date = sw.length ? sw.map(x => x.dictation_date).sort()[0] : W.addDays(t, 3);
        if (t >= W.addDays(date, -1)) {   // the practice dictation is today's go
          T().school_tests = T().school_tests || [];
          const n = sw.filter(x => x.dictation_date === date).length;
          if (!T().school_tests.some(x => x.student_id === s.id && x.dictation_date === date))
            T().school_tests.push({ id: "ts-st-" + Date.now(), student_id: s.id, dictation_date: date, taken_on: t, score: n, total: n, missed: [], self_marked: true });
        } else if (!T().quests.some(x => x.kind === "school" && x.started_at && W.dkey(new Date(x.started_at)) === t)) {
          T().quests.push({ id: "ts-sc-" + Date.now(), student_id: s.id, quest_day: null, kind: "school", started_at: iso(0), diamonds_earned: 2 });
        }
      }
      mailRead(); go("");
    }
    function diamonds50() {
      T().quests.push({ id: "ts-gift-" + Date.now(), student_id: me().id, quest_day: null, kind: "tester", completed: false, started_at: iso(0), diamonds_earned: 50 });
      go("");
    }
    const list = $("menuList"), head = document.createElement("p");
    head.className = "ts-head"; head.textContent = "Tester (test version only)"; list.appendChild(head);
    [["Go to the island test", islandTest], ["Finish today's task", finishTask], ["Give 50 diamonds", diamonds50]].forEach(([label, fn]) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "ts-item"; b.textContent = label;
      b.onclick = () => { try { fn(); } catch (e) { console.warn(e); banner("That shortcut did not work."); } };
      list.appendChild(b);
    });
    // After the reload: once he is in (the door is gone and today's session exists), start what was asked for.
    let flag = ""; try { flag = sessionStorage.getItem("ww.tester.go") || ""; sessionStorage.removeItem("ww.tester.go"); } catch (e) {}
    if (flag === "test") {
      let tries = 0; const t = setInterval(async () => {
        if (++tries > 100) { clearInterval(t); return; }
        if (!student || !todaySession || !$("gate").hidden) return;
        clearInterval(t);
        const d = openDay(); if (!d || !isTest(d)) return;
        if (!$("modal").hidden) closeModal();
        showPage("quest"); await startQuest(d);
        const k = q && q.items ? q.items.findIndex(x => x.part === "test") : -1;
        if (k > 0) { q.i = k; renderQ(); }
      }, 300);
    }
  })();
  // ============ the counters, today's parts, the door, start-up ============
  // Labels on glass get their Chinese line inline (see 30-hud.css).
  $("dayLine").classList.add("zhk");
  { const l = $("streakBox").querySelector("small"); if (l) l.classList.add("zhk"); }
  $("title").classList.add("nozh");
  let hdDiaSeen = null;   // the last diamond count drawn, so a rise can be heard
  function renderStats() {
    const n = weekDays(); $("sStreak").textContent = n; $("streakBox").classList.toggle("alive", n >= 5);
    { const lbl = $("streakBox").querySelector(".lbl"), t = n > 5 ? "days this week" : "of 5 days this week"; if (lbl && lbl.dataset.t !== t) { lbl.dataset.t = t; lbl.textContent = t; } }
    $("weekPips").querySelectorAll("i").forEach((p, i) => p.classList.toggle("on", i < Math.min(5, n)));
    if (student) $("dayLine").textContent = "Day " + totalDays() + " at the outpost";
    renderToday();
    const hdDia = diamonds(); if (hdDiaSeen !== null && hdDia > hdDiaSeen) setTimeout(() => W.sfx("diamond"), 380); hdDiaSeen = student ? hdDia : null;
    const stars = words.filter(w => w.level >= W.DIAMOND).length;   // star words: right on the first try at the 14-day meeting
    $("sBlocks").textContent = hdDia; $("sDia").textContent = stars;
    { const c = $("sDia").closest(".count"); if (c) c.hidden = !stars; }   // the star shows from his first star word on
  }
  // A tap on a counter: one small line under it for three seconds, then it goes.
  const HD_TIPS = [["#streakBox", "Days you played this week."], [".count.gem", "Diamonds: for building."], [".count.star", "Star words: you kept them."]];   // Chinese: ZH.add below
  let hdTipT = 0;
  function hdTip(box, text) {
    const old = $("hdTip"); if (old) { old.parentNode.classList.remove("hd-tipon"); old.remove(); } clearTimeout(hdTipT);
    box.insertAdjacentHTML("beforeend", '<span class="hd-tip glass zhk" id="hdTip" role="status" data-for="' + text + '">' + text + "</span>");
    box.classList.add("hd-tipon");
    hdTipT = setTimeout(() => { const t = $("hdTip"); if (t) { t.parentNode.classList.remove("hd-tipon"); t.remove(); } }, 3000);
  }
  HD_TIPS.forEach(([sel, text]) => {
    const box = document.querySelector("#stats " + sel); if (!box) return;
    box.classList.add("hd-tap"); box.setAttribute("role", "button"); box.tabIndex = 0;
    box.onclick = () => { const t = $("hdTip"); if (t && t.parentNode === box) { clearTimeout(hdTipT); box.classList.remove("hd-tipon"); t.remove(); return; } hdTip(box, text); };
    box.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); box.onclick(); } };
  });
  // Today's parts (Mail, Old words, New words, School words) and the one to do next. One rule for the plate, the dock and Orbit.
  //  - Mail: done once today's mail is opened. A letter that arrives later (unread) makes Mail the next place again.
  //  - Old words: only on a day they can be done (a level is open, or some were checked today); the daily limit is never shown.
  //  - New words: done once a level was finished today (a second level is his choice), or when no level is open today.
  //    A level stopped half-way stays "not done" until it is finished, so the plate keeps leading to the map table.
  //  - School words: a fourth part while there is a school list this week (82-school supplies { done, n, label }).
  // next: the first part not done; null when everything is done. wait: the school rows are still loading, so "Done for today"
  // must not be shown yet.
  function hdPlan() {
    if (!student || !todaySession) return { parts: [], next: null, wait: true };
    const d = openDay(), due = dueReviews().length, any = doneToday() > 0, fresh = d ? dayWords(d).filter(w => w.level === 0).length : 0;
    const parts = [
      { key: "mail", go: "mail", done: ritualDone(), n: "", label: "Mail" },
      { key: "old", go: "chest", done: !due || !d, n: due, label: "Old words", skip: !(due && d) && !checksToday() },
      { key: "new", go: "chest", done: any || !d, n: fresh || (d ? dayWords(d).length : 0), label: "New words" }
    ].filter(p => !p.skip);
    const school = typeof schoolPart === "function" ? schoolPart() : null;
    if (school) parts.push(Object.assign({ key: "school", go: "tower" }, school));
    let wait = false; try { wait = typeof scToday === "function" && scRows === null; } catch (e) { wait = false; }
    const next = ritualDone() && unreadCount() > 0 ? parts[0] : parts.find(p => !p.done) || null;
    return { parts, next, wait: wait && !next };
  }
  // Today's task (the tutor, 21 November): today's mail, today's level (old words and new words), and one go of school words
  // when there is a school list this week. Until it is done there is no free play: no free walking, no building (hdLock).
  // Nothing on today's list (no level, no school list): the task is the mail only. While the school rows load it is not done yet.
  function hdTaskDone() {
    if (!student || !todaySession) return false;
    const pl = hdPlan();
    if (!ritualDone() || pl.wait) return false;
    if (doneToday() === 0 && openDay()) return false;
    return pl.parts.every(p => p.key !== "school" || p.done);
  }
  // The lock follows the task: the 3D world stops taps on the ground and the arrow keys (WW3D.walkLock); the plate, the dock,
  // the place tags and Enter by a place still walk him to each part. Building is shut by sleepGate (36-sleep slOpen).
  let hdLocked = false;
  function hdLock() {
    const on = !!student && !!todaySession && !hdTaskDone();
    if (on !== hdLocked) { hdLocked = on; document.body.classList.toggle("hd-locked", on); }
    const w = window.WW3D; if (w && w.walkLock) w.walkLock(on);
  }
  const HD_NEXT = { mail: ["mail", "Next: Mail"], old: ["map", "Next: Old words"], new: ["map", "Next: New words"], school: ["book", "Next: School words"] };
  // Where today's parts were (sample A), one plate: what is next, with the place's icon and an arrow; a tap does what the dock
  // button of that place does. Under the words, one small dot per part of today, filled when done. All done: "Done for today".
  // The old row of parts stays in the page, hidden (the rule tests read it).
  function renderToday() {
    const el = $("todayline"); if (!el || !student) return;
    const pl = hdPlan(), n = pl.next, done = pl.parts.filter(p => p.done).length;
    const row = pl.parts.map(p => '<span class="part nozh' + (p.done ? " done" : p === n ? " now" : "") + '"><b>' + (p.done ? ICON("check") : p.n) + '</b><span class="zhk">' + p.label + "</span></span>").join('<i class="sep" aria-hidden="true"></i>');
    const dots = '<span class="hd-dots" role="img" aria-label="' + done + " of " + pl.parts.length + ' done">' + pl.parts.map(p => "<i" + (p.done ? ' class="on"' : "") + "></i>").join("") + "</span>";
    const [icon, label] = n ? HD_NEXT[n.key] : ["check", "Done for today"];
    const inner = '<span class="hd-ic">' + ICON(icon) + '</span><span class="hd-txt"><span class="hd-label zhk">' + label + "</span>" + dots + "</span>" + (n ? '<span class="hd-arrow">' + ICON("arrow") + "</span>" : "");
    const key = (n ? n.key : "done") + "|" + pl.parts.map(p => +p.done).join("") + "|" + pl.wait + "|" + row;
    if (el.dataset.k !== key) {
      el.dataset.k = key;
      el.innerHTML = (n ? '<button type="button" class="hd-next nozh" id="hdNext" data-go="' + n.go + '">' + inner + "</button>" : '<div class="hd-next hd-done nozh" id="hdNext">' + inner + "</div>") +
        '<span class="hd-parts" hidden>' + row + "</span>";
      el.classList.toggle("hd-go", !!n); el.classList.toggle("hd-fin", !n); el.classList.toggle("hd-wait", pl.wait);
      el.setAttribute("aria-label", "Today");
      const btn = $("hdNext"); if (n && btn) btn.onclick = () => { const b = document.querySelector('#dpad [data-go="' + n.go + '"]'); if (b) b.click(); };
    }
    if (hdHintLate && !pl.wait && !$("worldwrap").hidden) { hdHintLate = false; const h = hdStartHint(); if (h) hdHint(h); }
    hdDock(); hdLock();
    hdFitToday();
  }
  // The plate sits bottom centre (sample A). When Orbit's line, the dock or the place's "Open" button leaves it no room
  // (中文 on, a small window), it moves one row up instead of lying on top of them.
  function hdFitToday() {
    const t = $("todayline"); if (!t || t.hidden) return;
    t.classList.remove("hd-up");
    const a = t.getBoundingClientRect(); if (!a.width) return;
    const hit = el => { if (!el || el.hidden) return false; const b = el.getBoundingClientRect(); return b.width > 0 && a.left < b.right + 10 && b.left < a.right + 10 && a.top < b.bottom && b.top < a.bottom; };
    if (hit($("dpad")) || hit($("w3open")) || hit(document.querySelector("#guide .say")) || hit(document.querySelector("#guide .face"))) t.classList.add("hd-up");
  }
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => hdFitToday()); ["todayline", "dpad", "guide"].forEach(id => { const e = $(id); if (e) ro.observe(e); }); }
  if (window.MutationObserver) { const g = $("guide"); if (g) new MutationObserver(() => hdFitToday()).observe(g, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden", "class"] }); }
  window.addEventListener("resize", () => hdFitToday());

  // The door: one small paper page for the PIN, the pairing code and the start-up troubles.
  function hdDoor(title, line, body) {
    $("gate").hidden = false;
    $("gate").innerHTML = '<header class="hd-door-h"><div class="face"><img src="img/guide.jpg" alt=""></div><div><span class="eyebrow">Word World</span>' +
      '<h2 class="pg-title">' + W.esc(title) + '</h2></div><span style="flex:1"></span><button type="button" class="chip" id="doorZh">中文</button></header>' + (line ? '<p class="do">' + W.esc(line) + "</p>" : "") + (body || "");
    if ($("doorZh")) $("doorZh").onclick = () => $("zhToggle").click();
  }
  const hdRetry = '<div class="pg-foot"><button type="button" class="btn primary" id="hdRetry">Try again</button></div>';
  function hdTrouble(title, line, forTeacher) {
    hdDoor(title, line, '<p class="hint hd-teach">' + W.esc(forTeacher) + "</p>" + hdRetry);
    $("hdRetry").onclick = () => location.reload();
  }
  function renderPair(msg) {
    hdDoor("Connect this device", "Type the 6-letter code from your teacher.",
      '<form id="pf" class="answer hd-entry" autocomplete="off"><label class="line hd-code">' + ICON("lock") +
      '<input type="text" id="code" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Pairing code"></label>' +
      '<button type="submit" class="btn primary">Connect</button></form><p class="fb bad" id="perr" aria-live="polite">' + W.esc(msg || "") + "</p>");
    $("code").focus();
    $("pf").onsubmit = async e => { e.preventDefault(); const { data, error } = await sb.rpc("pair_device", { code: $("code").value }); if (error || !data) { $("perr").textContent = "Not yet. Check the code with your teacher."; return; } boot(); };
  }
  // One door for both: the child's 4-digit PIN opens his world; the teacher's PIN (config.js) opens the dashboard page.
  function renderPin() {
    const TP = String((window.WORD_TOWER_CONFIG || {}).TEACHER_PIN || "");
    hdDoor(String(student.name || "").trim() ? "Hi " + String(student.name).trim() + "!" : "Hi!", "Type your PIN.",   // no name saved yet: not "Hi !"
      '<form id="pinf" class="answer hd-entry" autocomplete="off"><label class="line hd-pin">' + ICON("lock") +
      '<input type="password" inputmode="numeric" id="pin" maxlength="' + Math.max(4, TP.length) + '" autocomplete="off" aria-label="PIN"></label>' +
      '<button type="submit" class="btn primary">Enter</button></form><p class="fb bad" id="pinerr" aria-live="polite"></p>' +
      (TP ? '<p class="hint hd-teach">Teacher? Type your teacher PIN here.</p>' : ""));
    $("pin").focus();
    $("pinf").onsubmit = e => {
      e.preventDefault(); const v = $("pin").value.trim();
      if (v === student.pin) { try { sessionStorage.setItem("wt.pin.ok", student.id); } catch (x) {} unlock(); }
      else if (TP && v === TP) { location.href = "teacher.html"; }
      else { $("pinerr").textContent = "Not yet. Type your PIN again."; logEvent("pin_wrong", {}); $("pin").value = ""; $("pin").focus(); }
    };
  }
  let hdGreeted = false;
  async function unlock() {
    if (!(await loadAll())) return;
    await enterToday();
    // The school rows decide whether today's task is done (hdTaskDone): load them now, not on 82-school's poll a moment later,
    // so the plate, the lock and free play are right from the first frame. A slow answer does not hold the world for long.
    if (typeof scLoad === "function" && scLoadedFor !== student.id) await Promise.race([scLoad(), new Promise(r => setTimeout(r, 1500))]);
    $("title").textContent = student.name;
    $("gate").hidden = true; $("menu").hidden = false; $("stats").hidden = false; $("worldwrap").hidden = false; $("guide").hidden = false;
    sizeCanvas(); drawWorld(); renderStats();
    if (!hdGreeted) { hdGreeted = true; Guide.day(); }
    hdHint(hdStartHint());
    listenForMail(); animate();
    if (!ritualDone()) showMailPopup();
  }
  async function boot() {
    if (!sb) return hdTrouble("Not set up yet", "Ask your teacher to set up the game.", "For the teacher: config.js is missing or still has the example values. See deploy/README.md.");
    let { data: { session } } = await sb.auth.getSession();
    if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error) return hdTrouble("Can't connect", "Check the internet, then tap Try again.", "For the teacher: anonymous sign-in is off in Supabase, or there is no internet. See deploy/README.md step M2."); session = r.data.session; }
    const { data, error } = await sb.from("students").select("*").eq("paired_uid", session.user.id).maybeSingle();
    if (error) { hdTrouble("Can't load", "Tap Try again. If it still does not work, ask your teacher.", "For the teacher: " + error.message); $("gate").querySelector(".hd-teach").classList.add("nozh"); return; }
    if (!data) return renderPair();
    student = data;
    let ok = false; try { ok = sessionStorage.getItem("wt.pin.ok") === student.id; } catch (x) {}
    ok ? unlock() : renderPin();
  }
  // Close the menu when he taps somewhere else.
  document.addEventListener("click", e => { const m = $("menu"); if (m && m.open && !m.contains(e.target)) m.open = false; });
  if (ZH) ZH.add({
    "Hi!": "你好！", "Type your PIN.": "输入你的密码。", "Enter": "进入", "Not yet. Type your PIN again.": "还没对。再输入一次密码。",
    "Teacher? Type your teacher PIN here.": "老师？在这里输入老师密码。",
    "Connect this device": "连接这台设备", "Type the 6-letter code from your teacher.": "输入老师给你的 6 个字母的代码。", "Connect": "连接",
    "Not yet. Check the code with your teacher.": "还没对。和老师核对一下代码。",
    "Not set up yet": "还没有设置好", "Ask your teacher to set up the game.": "请老师来设置游戏。",
    "Can't connect": "连不上", "Check the internet, then tap Try again.": "检查一下网络，然后点“再试一次”。",
    "Can't load": "加载不了", "Tap Try again. If it still does not work, ask your teacher.": "点“再试一次”。如果还是不行，问老师。",
    "Try again": "再试一次", "Word World": "单词世界", "Loading…": "正在加载…",
    "Next: Mail": "下一步：信箱", "Next: Old words": "下一步：旧单词", "Next: New words": "下一步：新单词", "Next: School words": "下一步：学校单词",
    "Done for today": "今天完成了", "Days you played this week.": "你这周玩了几天。", "Diamonds: for building.": "钻石：用来建造。", "Star words: you kept them.": "星星单词：你记住了。",
    "For the teacher: config.js is missing or still has the example values. See deploy/README.md.": "给老师：config.js 缺失或还是示例值。请看 deploy/README.md。",
    "For the teacher: anonymous sign-in is off in Supabase, or there is no internet. See deploy/README.md step M2.": "给老师：Supabase 没有打开匿名登录，或者没有网络。请看 deploy/README.md 的 M2 步。"
  }, [[/^Hi (.+)!$/, "你好，$1！"]]);
  boot();
})();
