<script>
(function () {
  const W = window.WT, $ = id => document.getElementById(id);
  const sb = W.client();
  let student = null, words = [], sessions = [], quests = [], messages = [], todaySession = null, q = null;
  const PRAISE = ["Nice! You got it!", "Perfect spelling!", "Long word, no problem!", "Level up! Keep going!", "Wow, from memory!", "Your brain remembered!"];
  const today = () => W.today();
  const byId = id => words.find(w => w.id === id);
  const TN = () => (student && student.teacher_name) || "WordWizard"; // the teacher's gamer name inside the game
  function banner(msg) { const b = $("banner"); b.hidden = !msg; b.textContent = msg || ""; }
  // 中文: Chinese under every English instruction (zh.js). Remembered on the device; each flip is logged for the teacher.
  const ZH = window.WT_ZH;
  if (ZH) { ZH.init($("app")); $("zhToggle").setAttribute("aria-pressed", String(ZH.isOn())); }
  $("zhToggle").onclick = () => { if (!ZH) return; ZH.set(!ZH.isOn(), $("app")); $("zhToggle").setAttribute("aria-pressed", String(ZH.isOn())); logEvent("zh_toggle", { on: ZH.isOn() }); drawWorld(); };
  const zhOn = () => !!(ZH && ZH.isOn());

  // ============ data ============
  async function logEvent(type, detail) {
    if (!student) return;
    const { error } = await sb.from("events").insert({ student_id: student.id, session_id: todaySession ? todaySession.id : null, type, detail: detail || {} });
    if (error) banner("No internet? That last step was not saved.");
  }
  const practising = () => !!(q && q.practice);
  async function saveAttempt(w, kind, step, answer, correct, before, after) {
    if (practising()) return;
    const { error } = await sb.from("attempts").insert({ student_id: student.id, session_id: todaySession ? todaySession.id : null, quest_id: q && q.row ? q.row.id : null, word_id: w.id, word: w.word, kind, step, answer, correct, level_before: before, level_after: after });
    if (error) banner("No internet? That answer was not saved.");
  }
  async function saveWord(w, patch) { if (practising()) return; Object.assign(w, patch); const { error } = await sb.from("words").update(patch).eq("id", w.id); if (error) banner("No internet? Progress was not saved."); }
  async function saveSession(patch) { Object.assign(todaySession, patch); const { error } = await sb.from("sessions").update(patch).eq("id", todaySession.id); if (error) banner("No internet? Progress was not saved."); }
  async function saveQuest(row, patch) { if (practising()) return; Object.assign(row, patch); const { error } = await sb.from("quests").update(patch).eq("id", row.id); if (error) banner("No internet? Progress was not saved."); }
  // Her story pages belong to the real student. The test account (the tutor playing) shows them too, so she can try her
  // own page before he does; it only reads them, and its events stay with the test student.
  async function storyRows() {
    let id = student.id;
    if (student.is_test === true) {
      try { const r = await sb.from("students").select("id").eq("is_test", false).order("created_at").limit(1); if (r && r.data && r.data[0] && r.data[0].id) id = r.data[0].id; } catch (e) {}
    }
    return sb.from("stories").select("*").eq("student_id", id).order("level");
  }
  async function loadAll() {
    const t = today();
    const [w, s, qs, m, sto] = await Promise.all([
      sb.from("words").select("*").eq("student_id", student.id).eq("approved", true).order("sort_order").order("created_at"),
      sb.from("sessions").select("*").eq("student_id", student.id).gte("day", W.addDays(t, -400)).order("day"),
      sb.from("quests").select("*").eq("student_id", student.id).order("quest_day"),
      sb.from("messages").select("*").eq("student_id", student.id).order("created_at"),
      storyRows().catch(e => ({ data: null, error: e }))   // the tutor's own story pages (deploy/stories.sql; not there yet: none)
    ]);
    if (w.error || s.error || qs.error) { banner("Could not load your words. Check the internet and reload."); return false; }
    words = w.data || []; sessions = s.data || []; quests = qs.data || []; messages = m.data || [];
    if (typeof storyOwnSet === "function") storyOwnSet(sto && !sto.error ? sto.data : null);   // 55-story.js: her page replaces the game's for its level
    todaySession = sessions.find(x => x.day === t) || null;
    freshStart();
    await fromOldLadder();
    return true;
  }
  // A record that starts from nothing (the tutor wiped a test play, or a new child on a used laptop): what an earlier
  // player left on this device about levels, cards and games must not carry over. Settings of the device itself stay
  // (sound, the 中文 switch, the microphone that worked, Orbit's memory of which lines he has said).
  const FRESH_KEYS = ["ww.rounds.", "ww.mix.", "ww.probes.", "ww.watch.", "ww.game.", "wt.card.", "ww.sleep.warned.", "ww.pairs.", "ww.quick.", "ww.sent."];
  function freshStart() {
    if (sessions.length || quests.length || words.some(w => w.level > 0 || w.last_seen || w.introduced_on)) return false;
    try {
      const gone = [];
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && FRESH_KEYS.some(p => k.indexOf(p) === 0)) gone.push(k); }
      gone.forEach(k => localStorage.removeItem(k));
      return gone.length > 0;
    } catch (e) { return false; }
  }
  // An old save from the five-step ladder (1, 3, 7, 14, 30 days): words on step 4 or 5 move once to the new ladder
  // (W.fromOldLadder in common.js says how). A saved due date is kept or cleared, never moved earlier.
  async function fromOldLadder() {
    const moved = [];
    for (const w of words) {
      const p = W.fromOldLadder(w); if (!p) continue;
      const from = w.level; Object.assign(w, p); moved.push({ word: w.word, from, to: p.level });
      const { error } = await ("due" in p ? sb.from("words").update({ level: p.level, due: p.due }) : sb.from("words").update({ level: p.level })).eq("id", w.id);
      if (error) banner("No internet? Progress was not saved.");
    }
    if (moved.length) logEvent("ladder_moved", { words: moved });
  }
  // Entering the game is the daily check-in: that is what the streak counts.
  async function enterToday() {
    if (todaySession) { logEvent("login", {}); return; }
    const { data, error } = await sb.from("sessions").insert({ student_id: student.id, day: today() }).select().single();
    if (error) { banner("Could not check in. Check the internet and reload."); return; }
    todaySession = data; sessions.push(data);
    logEvent("login", { first: true });
  }

  // ============ the plan: 50 levels in 5 zones ============
  // Level 1 opens on the start date the teacher set. Level N opens the day after level N-1 is finished:
  // one level a day, in order, so two new words a day and never a binge. Every 10th level is the zone test.
  const INTRO = w => w.level > 0;
  const LEVELS = 50, PER_ZONE = 10;
  const ZONES = [
    { name: "Sunny Island", emoji: "🏝️", deco: "🌴 🐚 ⛵ 🦀 🌞" },
    { name: "Jungle", emoji: "🌴", deco: "🐒 🦜 🌺 🐸 🍌" },
    { name: "Under the Sea", emoji: "🐠", deco: "🐙 🐚 🪸 🐬 🫧" },
    { name: "Ice Cave", emoji: "🧊", deco: "🐧 ❄️ 💎 🐻‍❄️ ⛄" },
    { name: "Sky Castle", emoji: "☁️", deco: "🏰 🦅 🌈 ⭐ 🪁" }
  ];
  const zoneOf = d => Math.min(ZONES.length - 1, Math.floor((d - 1) / PER_ZONE));
  const isTest = d => d % PER_ZONE === 0;
  const startDate = () => student.start_date || today();
  const maxDay = () => Math.max(LEVELS, words.reduce((m, w) => Math.max(m, w.quest_day || 0), 0));
  const questRow = d => quests.find(x => x.quest_day === d) || null;
  const dayDone = d => { const r = questRow(d); return !!(r && r.completed); };
  const doneOn = d => { const r = questRow(d); return r && r.finished_at ? W.dkey(new Date(r.finished_at)) : null; }; // local date it was finished
  const dayWords = d => words.filter(w => w.quest_day === d);
  const LEVELS_A_DAY = 2; // decided in the interview: a second level may be played the same day, never a third
  const doneToday = () => { const t = today(); return quests.filter(x => x.completed && x.finished_at && W.dkey(new Date(x.finished_at)) === t).length; };
  function dayState(d) {
    if (dayDone(d)) return "done";
    if (d === 1 ? startDate() > today() : !(dayDone(d - 1) && (doneOn(d - 1) < today() || doneToday() < LEVELS_A_DAY))) return "locked";
    // "No new words for now" (students.pause_new, the tutor's switch): a level he has not started does not open; his old words

  const copyHtml = (model, at) => { const m = copyNorm(model); return at < 0 ? W.esc(m) : W.esc(m.slice(0, at)) + '<mark class="lv-cmark' + (m[at] === " " ? " lv-cspace" : "") + '">' + (m[at] === " " ? "&nbsp;" : W.esc(m[at])) + "</mark>" + W.esc(m.slice(at + 1)); };
  // The sentence's meaning in Chinese, under the English sentence on both pages (the tutor, 23 November: he must know what he copies).
  const szhHtml = w => (w && w.sentence_zh ? '<p class="zh lv-szh nozh" lang="zh-Hans">' + W.esc(w.sentence_zh) + "</p>" : "");
  function renderTiles(w) {
    const k = w.word, s = String(w.sentence_en || "").trim();
    if (!s || !W.hasWord(s, k)) { logEvent("sentence_none", { word: k }); return nextStep(); }   // no example sentence with the word: nothing to build or copy
    if (!q.tl && sentGet().tiles.indexOf(w.id) >= 0) q.tl = { copy: { misses: 0 } };   // his tiles for this sentence are done (a new start): straight to copying
    if (q.tl && q.tl.copy) return renderCopy(w, s);
    if (!q.tl) {
      // tiles are compared by their text: two tiles with the same text are interchangeable ("the ... the")
      const tiles = tilesOf(s, k), inOrder = o => o.every((x, j) => tiles[x] === tiles[j]); let order = W.shuffle(tiles.map((t, i) => i));
      for (let n = 0; n < 12 && tiles.length > 1 && inOrder(order); n++) order = W.shuffle(order);
      for (let n = 0; n < tiles.length && inOrder(order); n++) order.push(order.shift());   // never starts in the right order
      q.tl = { tiles, order, got: 0, wrong: 0, used: [] };
    }
    const tl = q.tl, n = tl.tiles.length;
    qp(head() + title("Copy the sentence", "<b>Tap</b> the words in order.") +
      '<p class="lv-sline nozh" id="tlBuilt">' + tl.tiles.map((t, i) => i < tl.got ? '<span class="lv-tgot">' + W.esc(t) + "</span>" : '<span class="lv-tslot"></span>').join("") + "</p>" + szhHtml(w) +
      '<div class="lv-tiles" id="tlTiles">' + tl.order.map((o, j) => '<button type="button" class="lv-tile nozh" data-j="' + j + '"' + (tl.used[j] ? " disabled" : "") + ">" + W.esc(tl.tiles[o]) + "</button>").join("") + "</div>" +
      '<p class="fb" id="fb" aria-live="polite"></p>');
    qb.querySelectorAll(".lv-tile").forEach(btn => btn.onclick = () => {
      const j = +btn.dataset.j; if (tl.got >= n || tl.used[j]) return;
      if (tl.tiles[tl.order[j]] === tl.tiles[tl.got]) {
        tl.used[j] = true; btn.disabled = true; tl.got++;
        const slots = qb.querySelectorAll("#tlBuilt > span"); slots[tl.got - 1].className = "lv-tgot"; slots[tl.got - 1].textContent = tl.tiles[tl.got - 1];
        $("fb").className = "fb"; $("fb").textContent = ""; W.sfx("pop");
        if (tl.got === n) built();
      } else {
        tl.wrong++; W.sfx("notyet"); btn.classList.add("lv-shake"); setTimeout(() => btn.classList.remove("lv-shake"), 400);
        $("fb").className = "fb bad"; $("fb").textContent = "Not yet. Which word comes next?";
      }
    });
    async function built() {
      const qq = q, ok = tl.wrong === 0;
      await saveAttempt(w, "sentence", "tiles", s, ok, w.level, w.level);
      logEvent("step_done", { word: k, step: "tiles", first_try: ok });
      if (q !== qq) return;
      W.sfx("right"); tl.copy = { misses: 0 }; sentMark(w, "tiles"); renderCopy(w, s);
    }
    if (!tl.got && !tl.said) { tl.said = true; sayLine(s); }   // he hears the whole sentence once, then puts its words in order
    Guide.step("sentence");
  }
  // After the tiles: the sentence stays on the page; he types it. Only "Skip" leaves without it (logged).
  function renderCopy(w, s) {
    const k = w.word, cp = q.tl.copy;
    qp(head() + title("Copy the sentence", "<b>Copy</b> the sentence.") +
      '<div class="lv-sdone"><p class="lv-sline lv-sfull lv-cmodel nozh" id="tlBuilt">' + copyHtml(s, -1) + '</p><button type="button" class="sound" id="lvSay" aria-label="Hear the sentence">' + ICON("speaker") + "</button></div>" + szhHtml(w) +
      '<form class="answer lv-copy" id="cf" autocomplete="off"><label class="line lv-long" id="ansLine">' + ICON("pencil") +
      '<input type="text" id="copy" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="200" placeholder="copy the sentence here" aria-label="Copy the sentence"></label>' +
      '<button type="submit" class="btn primary" id="check">Check</button></form><p class="fb" id="fb" aria-live="polite"></p>' +
      '<footer class="pg-foot"><span class="grow"></span><button type="button" class="btn quiet" id="skip">Skip</button></footer>');
    $("lvSay").onclick = () => { sayLine(s); $("copy").focus(); };
    // He has to type it (the tutor, 23 November): nothing can be pasted or dropped into the line, and the sentence above
    // cannot be selected or copied.
    ["paste", "drop"].forEach(ev => $("copy").addEventListener(ev, e => { e.preventDefault(); $("fb").className = "fb"; $("fb").textContent = "Type it, letter by letter."; }));
    ["copy", "cut", "contextmenu", "selectstart", "dragstart"].forEach(ev => $("tlBuilt").addEventListener(ev, e => e.preventDefault()));
    $("copy").oninput = () => { if (!$("ansLine").classList.contains("bad")) return; $("ansLine").classList.remove("bad"); $("fb").className = "fb"; $("fb").textContent = ""; $("tlBuilt").innerHTML = copyHtml(s, -1); };
    $("cf").onsubmit = e => {
      e.preventDefault(); const inp = $("copy"); if (cp.done || inp.readOnly || !copyNorm(inp.value)) return;
      const r = copyCheck(inp.value, s);
      if (!r.ok) {
        cp.misses++; W.sfx("notyet"); $("ansLine").classList.add("bad"); $("fb").className = "fb bad"; $("fb").textContent = "Not yet. Look here.";
        $("tlBuilt").innerHTML = copyHtml(s, r.at);
        inp.focus(); if (copyNorm(inp.value) === inp.value) { const at = Math.min(r.at, inp.value.length); inp.setSelectionRange(at, at); }
        return;
      }
      cp.done = true; inp.readOnly = true; $("check").disabled = true; $("skip").hidden = true;
      $("ansLine").classList.add("good"); $("fb").className = "fb good"; $("fb").innerHTML = ICON("check") + "Yes! You copied it.";
      W.sfx("right"); logEvent("sentence_copied", { word: k, misses: cp.misses }); sentMark(w, "done"); later(nextStep, 1000);
    };
    $("skip").onclick = () => { if (cp.done) return; logEvent("sentence_skipped", { word: k, at: "copy", misses: cp.misses }); sentMark(w, "done"); nextStep(); };
    // The sentence itself is read aloud when the page opens. Orbit's "Copy the sentence." is shown, not said: the tutor heard
    // only his line (23 November), because it took the voice before the sentence had started.
    sayLine(s); $("copy").focus();
    Guide.show("Copy the sentence.", "把这个句子抄一遍。");
  }

  // ---- one new-rule word at the end of a level: a word he was never taught that follows the island's rule ----
  // He hears it and types it, ONE try; then the spelling is shown in beats either way. +1 diamond when right; no ladder.
  const probeList = isl => ((window.WW_PROBES || {})[isl] || []).filter(p => p && p.word && !words.some(w => W.key(w.word) === W.key(p.word)));
  const probeKey = () => "ww.probes." + (student ? student.id : "");
  // Loop test, 25 November: (1) a word without a recording is not said at all on a laptop whose own voice is silent, and the
  // page opened with no word heard: a word that has a recording comes first; (2) the words used were known only to this
  // device, so another browser (or cleared storage) asked the same word again: his saved probe tries count too (q.probeAt).
  // When every word was used, the one used longest ago comes again (the owners, 25 November: the 60 words must not run out).
  // A use is known from his saved probe tries (q.probeAt: word -> time) and from this device (ww.probes: word -> time).
  function probeTimes(isl) {
    const at = {}; let used = {};
    try { used = JSON.parse(localStorage.getItem(probeKey()) || "{}") || {}; } catch (e) {}
    const mine = used[isl];
    if (Array.isArray(mine)) mine.forEach((w, i) => { at[W.key(w)] = i + 1; });   // an older copy kept a plain list, oldest first
    else if (mine && typeof mine === "object") Object.keys(mine).forEach(k => { at[W.key(k)] = +mine[k] || 1; });
    const db = (q && q.probeAt) || {}; Object.keys(db).forEach(k => { at[k] = Math.max(at[k] || 0, db[k]); });
    return at;
  }
  function pickProbe(isl) {
    const list = probeList(isl); if (!list.length) return null;
    const at = probeTimes(isl), t = p => at[W.key(p.word)] || 0;
    const heard = p => { try { return !W.clipsOn || !W.clipsOn() || !!(W.clipFor(p.word, 0) || W.clipFor(p.word, 1)); } catch (e) { return true; } };
    const pool = list.filter(heard).length ? list.filter(heard) : list;   // a word with a recording first
    return pool.map((p, i) => ({ p, i })).sort((a, b) => t(a.p) - t(b.p) || a.i - b.i)[0].p;   // never used first, then the oldest use
  }
  function probeUsed(isl, word) {
    try {
      const used = JSON.parse(localStorage.getItem(probeKey()) || "{}") || {};
      const prev = used[isl], m = {};
      if (Array.isArray(prev)) prev.forEach((w, i) => { m[W.key(w)] = i + 1; }); else if (prev && typeof prev === "object") Object.assign(m, prev);
      m[W.key(word)] = Date.now(); used[isl] = m; localStorage.setItem(probeKey(), JSON.stringify(used));
    } catch (e) {}
  }
  function renderProbe(it) {
    if (!it.p) it.p = pickProbe(it.island);
    if (!it.p) return nextStep();
    const p = it.p, pw = { word: p.word, chunks: (p.beats || [p.word]).join("-") };
    qp(head() + title("Can you work it out?", "<b>Listen.</b> <b>Type</b> the word.") +
      '<div class="lv-cluemid lv-probe"><div class="lv-pbsound">' + soundBtn() +
      '<button type="button" class="btn quiet lv-slow" id="pbSlow">' + ICON("speaker") + "Slowly</button></div>" +
      (p.zh ? '<p class="lv-pbzh nozh" lang="zh">' + W.esc(p.zh) + "</p>" : "") + "</div>" + answerForm() + '<div class="lv-wshow" id="pbShow" hidden></div>' +
      '<footer class="pg-foot" id="pbFoot" hidden><span class="grow"></span><button type="button" class="btn primary" id="go">Next' + ICON("arrow") + "</button></footer>");
    $("hear").onclick = () => { W.speak(p.word); if (!it.done) $("ans").focus(); };
    $("pbSlow").addEventListener("mousedown", e => e.preventDefault());
    $("pbSlow").onclick = () => { W.speak(p.word, { slow: true }); logEvent("probe_slow", { word: p.word }); if (!it.done) $("ans").focus(); };
    $("ans").focus();
    $("wf").onsubmit = async e => {
      e.preventDefault(); const a = norm($("ans").value); if (!a || it.done) return;
      it.done = true; $("ans").readOnly = true; $("check").disabled = true;
      const right = a === W.key(p.word), qq = q;
      $("ansLine").classList.add(right ? "good" : "bad"); W.sfx(right ? "right" : "notyet");
      const f = $("fb"); f.className = "fb " + (right ? "good" : "bad");
      f.innerHTML = right ? ICON("check") + "Yes! You worked it out." : "Good try. Look:";
      const sh = $("pbShow"); sh.innerHTML = beatsHtml(pw, { heard: true, cls: "lv-wword", id: "pbWord" }); sh.hidden = false;
      sh.querySelectorAll(".beat").forEach((b, i) => { b.style.animationDelay = (i * 0.55) + "s"; b.classList.add("lv-in"); });
      W.speakChunks(pw.chunks);
      probeUsed(it.island, p.word);
      if (!q.practice) {
        try { await sb.from("attempts").insert({ student_id: student.id, session_id: todaySession ? todaySession.id : null, quest_id: q.row ? q.row.id : null, word_id: null, word: p.word, kind: "probe", step: "probe", answer: a, correct: right, level_before: null, level_after: null, island: it.island }); } catch (x) {}
        if (right) { await saveQuest(q.row, { diamonds_earned: (q.row.diamonds_earned || 0) + 1 }); renderStats(); }
      }
      logEvent("probe", { word: p.word, island: it.island, correct: right });
      if (q !== qq || cur() !== it) return;
      if (right) stampOn(GEM_STAMP);
      $("pbFoot").hidden = false; $("go").onclick = nextStep; $("go").focus();
    };
    W.speak(p.word); Guide.text("A new word. Can you work it out?", "一个新词。你能自己拼出来吗？");
  }

  // ---- the quick check: four short words before the main words (the tutor, 23 November) ----
  // It finds the short words that still need a lesson, without giving a lesson on the others.
  // In every level with new words; never in an island test or in practice, never while student.pause_new is on.
  // Each word ONE try. The normal Hint button is there from the start (the tutor, 24 November): three presses, steps 1, 2, 3,
  // never "Look and copy" (no miss is ever sent to the kit here). Right with no Hint: the word becomes his at the last ladder
  // step (back in 14 days, then a star word). Not right, or any Hint pressed: the word becomes a waiting word (his, level 0,
  // no level of its own) for a later lesson; not right also shows the right spelling. Words come from WW_FIRST.quick (site/first.js) in its order, then the pool's short
  // words (fewer than 3 beats and fewer than 7 letters) easiest first, never one he has. He adds each word with ONE call,
  // sb.rpc("add_quick_words", { p_words: [word] }) (deploy/schema.sql); a right one is then moved up as any word is (saveWord).
  // A stop in the middle: the words he answered are his now, so a new start takes the next ones, never one twice.
  const QUICK_N = 4;
  // student.pause_new: a column another part adds; missing reads as off
  const quickOff = () => !student || !!student.pause_new;
  function quickHas() {   // the words he has, in any form (and their simple plural or singular)
    const have = new Set(); words.forEach(w => have.add(W.key(w.word)));
    return k => have.has(k) || have.has(k + "s") || have.has(k + "es") || (/s$/.test(k) && have.has(k.slice(0, -1))) || (/es$/.test(k) && have.has(k.slice(0, -2)));
  }
  function quickList(n, avoid) {
    const P = window.WW_POOL || []; if (!P.length || n <= 0) return [];
    const byKey = {}; P.forEach(r => { if (r && r[0]) byKey[W.key(r[0])] = r; });
    const F = window.WW_FIRST || {}, main = new Set((F.main || []).map(W.key)), has = quickHas();
    const first = (F.quick || []).map(x => byKey[W.key(x)]).filter(Boolean);
    const short = P.map((r, i) => ({ r, i })).filter(x => x.r && x.r[0] && (+x.r[17] || 0) < 3 && String(x.r[0]).replace(/[^A-Za-z]/g, "").length < 7 && !main.has(W.key(x.r[0])))
      .sort((a, b) => ((+a.r[14] || 99) - (+b.r[14] || 99)) || a.i - b.i).map(x => x.r);   // the tutor's main words keep their full lesson
    const out = [], seen = new Set();
    first.concat(short).forEach(r => { const k = W.key(r[0]); if (out.length >= n || seen.has(k) || has(k) || !r[3] || (avoid && avoid.has(k))) return; seen.add(k); out.push(r); });
    return out.map(r => ({ id: null, word: r[0], chunks: r[1] || r[0], meaning_en: r[2] || "", meaning_zh: r[3] || "", picture: "" }));
  }
  // This level's quick check (in EVERY level since 25 November, the owners): { items, prev: { n, right } } (prev: the words of
  // this level he already answered, a stop and a new start). Words asked earlier today in any level are not asked again today
  // (a word he did not know may not have become his: see quickWaitFull).
  async function quickTurns(day, fresh, questId) {
    const none = { items: [], prev: { n: 0, right: 0 } };
    if (isTest(day) || !fresh.length || quickOff()) return none;
    let prev = none.prev; const avoid = new Set();
    try {
      const since = new Date(today() + "T00:00:00").toISOString();
      const a = await sb.from("attempts").select("*").eq("student_id", student.id).eq("kind", "quick").gte("created_at", since);
      const by = {};
      (a.data || []).forEach(x => { avoid.add(W.key(x.word)); if (questId && x.quest_id === questId) by[W.key(x.word)] = by[W.key(x.word)] || !!x.correct; });
      prev = { n: Object.keys(by).length, right: Object.values(by).filter(Boolean).length };
    } catch (e) { return none; }
    if (prev.n >= QUICK_N) return none;
    return { items: quickList(QUICK_N - prev.n, avoid).map(w => ({ w, type: "quick", step: "quick", part: "quick" })), prev };
  }
  // The waiting list must not grow without end (the lead, 25 November): while 4 or more of his words wait for a lesson
  // (level 0, no level of their own: the quick check's words), a quick-check word he does not know is NOT made his; it stays
  // in the pool and may come in a later quick check. He sees nothing different.
  const QUICK_WAIT_MAX = 4;
  const quickWaiting = () => words.filter(w => w.level === 0 && !w.quest_day && w.approved !== false).length;
  const quickWaitFull = () => quickWaiting() >= QUICK_WAIT_MAX;
  function renderQuick(it) {
    const w = it.w, k = w.word, list = q.items.filter(x => x.part === "quick"), pv = q.quickPrev || { n: 0 };
    const no = pv.n + list.indexOf(it) + 1, of = pv.n + list.length;
    qp(head() + title("Quick check", "<b>Listen.</b> <b>Type</b> the word.") +
      '<div class="clue lv-qk"><p class="kind">' + ICON("speaker") + "Word " + no + " of " + of + "</p>" +
      '<div class="lv-cue lv-qkcue">' + (hasPic(w) ? picHtml(w, "lv-pic") : "") + '<p class="lv-zbig nozh" lang="zh-Hans">' + W.esc(w.meaning_zh) + "</p>" + soundBtn() + "</div></div>" +
      '<form class="answer" id="wf" autocomplete="off"><label class="line" id="ansLine">' + ICON("pencil") +
      '<input id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24" placeholder="type the word here" aria-label="Type the word"></label>' +
      '<button type="submit" class="btn primary" id="check">Check</button></form>' +
      hintRow("lv", "fb") + '<div class="lv-qkshow" id="qkShow" hidden></div>' +
      '<footer class="pg-foot"><span class="grow"></span>' +
      '<button type="button" class="btn primary" id="go" hidden>Next' + ICON("arrow") + "</button></footer>");
    $("hear").onclick = () => W.speak(k);
    // the Hint kit with no miss: the button shows from the start; step 2 marks the first beat that does not match the line
    if (!it.hint) it.hint = { n: 0, last: "", miss: true };
    $("ans").addEventListener("input", () => { if (it.hint) it.hint.last = $("ans").value; });
    $("lv-hintBtn").hidden = !!it.done || it.hint.n >= HINT_MAX;
    wireAnswer(v => checkQuick(v));
    W.speak(k);
    if (!q.quickSaid) { q.quickSaid = true; Guide.text("Quick check. Type the words you know.", "快速检查。把你会的词打出来。"); }
  }
  async function checkQuick(val) {
    const it = cur(); if (!q || !it || it.part !== "quick" || it.done || q.busy) return;
    const w = it.w, a = norm(val); if (!a) return;
    const hints = it.hint ? it.hint.n : 0, right = a === W.key(w.word), known = right && !hints, qq = q;
    it.done = true; q.busy = true;
    $("ans").readOnly = true; $("ans").placeholder = ""; $("check").disabled = true;
    const h = lvHint(); if (h) h.right();   // the Hint button and the hint lines go
    // his: added by the database (waiting, level 0); one right with no Hint then moves to the last ladder step, back in 14 days
    let row = null;
    if (known || !quickWaitFull()) {   // a word he does not know is left in the pool while the waiting list is full
      try { const r = await sb.rpc("add_quick_words", { p_words: [w.word] }); if (r && !r.error && Array.isArray(r.data) && r.data.length) row = r.data[0]; } catch (e) {}
    }
    if (row) {
      if (!words.some(x => x.id === row.id)) words.push(row);
      // a known word by students.review_mode: "missed" finished at once (star word), "once" back once tomorrow, "all" back in 14 days
      let kp = { level: W.TOP, due: W.addDays(today(), 14), introduced_on: today(), last_seen: today(), wrong_streak: 0 };
      if (reviewMode() === "missed") kp = { level: W.DIAMOND, due: null, introduced_on: today(), last_seen: today(), wrong_streak: 0 };
      else if (reviewMode() === "once") kp = { level: 1, due: W.addDays(today(), 1), introduced_on: today(), last_seen: today(), wrong_streak: 0 };
      if (known) await saveWord(row, kp);
    }
    await lvAttempt(row || w, "quick", "quick", a, right, row ? 0 : null, row ? (known ? row.level : 0) : null, hints);
    await logEvent("quick", { word: w.word, right, answer: a, hints });
    q.quickGot = (q.quickGot || 0) + (known ? 1 : 0);   // "You know N of these.": only the words right with no Hint
    const list = qq.items.filter(x => x.part === "quick"), pv = qq.quickPrev || { n: 0, right: 0 };
    if (list.every(x => x.done) && !qq.quickLogged) { qq.quickLogged = true; await logEvent("quick_done", { right: pv.right + (qq.quickGot || 0), of: pv.n + list.length }); }
    if (q !== qq || cur() !== it) return;
    q.busy = false;
    const f = $("fb");
    if (right) {
      W.sfx("right"); $("ansLine").classList.add("good"); f.className = "fb good"; f.innerHTML = ICON("check") + (known ? "Yes. You know it." : "Yes. You will learn it soon.");
      // right after a Hint: a waiting word for a later lesson, not "back tomorrow" (Orbit's retry line said so; loop test 25 November)
      if (known) Guide.right(w.word, "memory"); else Guide.show("Yes. You will learn it soon.", "对。你很快就会学到它。");
      later(nextStep, 1400);
      return;
    }
    W.sfx("notyet"); $("ansLine").classList.add("bad");
    f.className = "fb"; f.textContent = "Not yet. You will learn it soon.";
    const sh = $("qkShow"); sh.innerHTML = rescueWordHtml(hintGroups(w.word, w.chunks), true, firstDiff(a, w.word)); sh.hidden = false;
    W.speak(w.word, { slow: true });
    // a double press of Enter (the second one lands on Next) must not skip the right spelling: Next waits a moment
    const shownAt = Date.now();
    $("go").hidden = false; $("go").onclick = () => { if (cur() === it && Date.now() - shownAt >= ansGuardMs()) nextStep(); }; $("go").focus();
  }
  // The line about what he knew, on the stop point after the quick check ("Quick check done."); never a count that reads 0.
  function quickSummary() {
    const pv = q.quickPrev || { right: 0 }, n = pv.right + (q.quickGot || 0);
    return n ? (n === 1 ? "You know 1 of these." : "You know " + n + " of these.") : "You will learn them soon.";
  }

  // ---- the pair game (83-pairs.js, another part): after the quick check, before the first main word ----
  // Its part defines pairsReady() and pairsStep(next); the step and its dot are there only when pairsReady() says so.
  function pairsWanted() { try { return typeof pairsStep === "function" && typeof pairsReady === "function" && !!pairsReady(); } catch (e) { return false; } }
  function renderPairs(it) {
    if (typeof pairsStep !== "function") return nextStep();
    const qq = q; let gone = false;
    const next = () => { if (gone || q !== qq || cur() !== it) return; gone = true; nextStep(); };
    try { pairsStep(next); } catch (e) { console.warn(e); next(); }
  }

  // ---- which words come back (students.review_mode, the owners, 25 November; missing = "missed") ----
  //  "missed": only words he got wrong come back. A new word right on its first try ("Type it", what the end page counts) is
  //            finished at the end of its level: a star word, no due date. A missed one: back tomorrow, then the ladder.
  //            A quick-check word he knows: a star word at once.
  //  "once":   a new word that was right comes back ONCE, the next day (step 1, due tomorrow, no slip yet, not met since):
  //            right there = star word; not right = the ladder from step 1. A missed one: the ladder.
  //  "all":    every new word goes 1, 4 and 14 days; a known quick-check word comes back after 14 days.
  // Words already on the ladder keep their step and date when the setting changes.
  const reviewMode = () => { const m = student && student.review_mode; return m === "once" || m === "all" ? m : "missed"; };
  const reviewOnce = w => reviewMode() === "once" && w.level === 1 && !(w.wrong_streak > 0) && !!w.introduced_on && w.last_seen === w.introduced_on;
  async function reviewFinish(day) {
    if (reviewMode() !== "missed" || !q || q.practice) return;
    const done = dayWords(day).filter(w => w.level === 1 && !(w.wrong_streak > 0) && w.introduced_on && w.last_seen === w.introduced_on && (w.id in q.results ? q.results[w.id] : true));
    for (const w of done) await saveWord(w, { level: W.DIAMOND, due: null });
  }

  // Scoring step (type for new words, listen for old words and the island test): the first try sets the level; he keeps trying until it is right.
  async function checkSpelling(val) {
    const it = cur(), w = it.w, k = w.word, a = norm(val);
    if (!a || q.busy) return;
    const right = a === W.key(k), first = !(w.id in q.results), qq = q, hn = lvHints();
    q.busy = true;
    if (first) {
      q.results[w.id] = right;
      const before = w.level; let patch;
      const extra = it.type === "review" && !right && !practising() ? stepsFor(w, "extra") : [];
      // a new word starts at step 1, back tomorrow; under "missed" a word right here becomes a star word at the end of the level
      // (reviewFinish), under "once" it comes back once tomorrow (reviewOnce)
      if (it.type === "new") patch = { level: 1, due: W.addDays(today(), 1), introduced_on: today(), last_seen: today(), wrong_streak: right ? 0 : 1 };
      else if (practising()) patch = { level: w.level };
      // the ladder (common.js): right -> one step up (after the 14-day meeting: star word); not right -> one step down, back tomorrow.
      // The island test is a fourth meeting on top of the three: right there leaves the step and the date as they are (so every
      // word still meets 1, 4 and 14 days, and the old words a day stay six); not right there drops the word as anywhere else.
      // A word that was due today and is in the island test (islandChoice) has its check here: right moves it up as anywhere.
      else if (it.type === "test" && right && !(w.due && w.due <= today())) patch = { level: w.level, last_seen: today(), wrong_streak: 0 };
      else if (right && it.type === "review" && reviewOnce(w)) patch = { level: W.DIAMOND, due: null, last_seen: today(), wrong_streak: 0 };   // "once": its one return
      else if (right) { const lv = W.up(w.level); patch = { level: lv, due: W.dueFor(lv, today()), last_seen: today(), wrong_streak: 0 }; }
      else patch = { level: W.down(w.level), due: W.addDays(today(), 1), last_seen: today(), wrong_streak: (w.wrong_streak || 0) + 1 };
      if (extra.length) addExtras(w, extra);
      await saveWord(w, patch);
      await lvAttempt(w, it.type, it.step, a, right, before, patch.level, hn);
      const s = {}, r = q.row;
      if (it.type === "new") { right ? s.new_right = (r.new_right || 0) + 1 : s.new_wrong = (r.new_wrong || 0) + 1; s.new_count = (r.new_count || 0) + 1; }
      else if (it.type === "test") { s.test_total = (r.test_total || 0) + 1; if (right) s.test_right = (r.test_right || 0) + 1; }
      else { right ? s.reviews_right = (r.reviews_right || 0) + 1 : s.reviews_wrong = (r.reviews_wrong || 0) + 1; }
      if (right && !practising()) s.diamonds_earned = (r.diamonds_earned || 0) + 1;
      await saveQuest(r, s); renderStats();
    } else await lvAttempt(w, "retry", it.step, a, right, w.level, w.level, hn);
    if (q !== qq || cur() !== it) return;
    q.busy = false;
    if (right) { showRight(w, first, it.type === "test" ? "test" : it.type === "review" ? "old" : "memory", practising() ? MEM_STAMP : GEM_STAMP); later(nextStep, first ? 1400 : 1000); }
    else showMiss(w, val);
  }
  // The extra games for an old word that was not right go to the end of the old-words part, so the same word does not come straight back.
  function addExtras(w, steps) {
    let at = q.i + 1; while (at < q.items.length && q.items[at].part === "review") at++;
    q.items.splice(at, 0, ...steps.map(st => ({ w, type: "review", step: st, part: "review", extra: true })));
  }
  // A mixed-round clue: logged; an older word not right on the first try comes back tomorrow; a first-try older word pays one diamond.
  async function checkMixed(val) {
    const it = cur(), w = it.w, k = w.word, a = norm(val);
    if (!a || q.busy) return;
    const right = a === W.key(k), first = !it.tried, qq = q, hn = lvHints(); let paid = false;
    it.tried = true; q.busy = true; mixSave(qq);
    await lvAttempt(w, "mixed", it.kind, a, right, w.level, w.level, hn);
    if (right) { it.done = true; mixSave(qq); }   // kept: after a reload this question is behind him
    if (first && it.older && !practising()) {
      if (!right) { const tm = W.addDays(today(), 1), patch = { wrong_streak: (w.wrong_streak || 0) + 1 }; if (!w.due || w.due > tm) patch.due = tm; await saveWord(w, patch); }
      else if (!q.mixPaid.has(w.id)) { q.mixPaid.add(w.id); paid = true; await saveQuest(q.row, { diamonds_earned: (q.row.diamonds_earned || 0) + 1 }); renderStats(); }
    }
    if (q !== qq || cur() !== it) return;
    q.busy = false;
    if (right) { showRight(w, first, it.older ? "old" : "memory", paid ? GEM_STAMP : MEM_STAMP); later(nextStep, first ? 1400 : 1000); }
    else showMiss(w, val);
  }
  // Extra games: he must get them right to move on; a first try that was not right is remembered and asked again next time.
  async function checkExtra(step, val, firstTryOk) {
    const w = cur().w, k = w.word, a = norm(val), qq = q;
    if (!a || q.busy) return;
    const right = a === W.key(k), hn = lvHints(); q.busy = true;
    await lvAttempt(w, "game", step, a, right, w.level, w.level, hn);
    if (q !== qq) return;
    q.busy = false;
    if (right) { showRight(w, false, "old"); finishExtra(step, q.tries === 0 && firstTryOk !== false, a, true, null); }
    else showMiss(w, val);
  }
  async function finishExtra(step, firstTryRight, a, logged, msg) {
    const w = cur().w, qq = q, it = cur();
    if (!logged) await saveAttempt(w, "game", step, a, firstTryRight, w.level, w.level);
    logEvent("step_done", { word: w.word, step, first_try: firstTryRight });
    const weak = (w.weak_types || []).filter(t => t !== step).concat(firstTryRight ? [] : [step]);
    if (JSON.stringify(weak) !== JSON.stringify(w.weak_types || [])) await saveWord(w, { weak_types: weak });
    if (q !== qq || cur() !== it) return;
    const fbx = $("fb"); if (fbx && msg) { fbx.className = "fb good"; fbx.innerHTML = ICON("check") + W.esc(msg); }
    W.sfx("pop"); later(nextStep, msg ? 900 : 1000);
  }
  function nextStep() {
    if (!q) return;
    q.tries = 0; q.tl = null; q.bub = null; q.talk = null; q.meet = null; q.busy = false; q.peek = false;
    const prev = cur(); q.i++;
    roundFinished(prev, q.items[q.i]);
    if (q.i >= q.items.length) { q.step = "end"; return renderQ(); }
    if (!q.practice && q.items[q.i].part !== prev.part) { q.step = "part"; q.partDone = prev.part; return renderQ(); }
    renderQ();
  }
  // Between parts he can stop: the level waits, what he earned is kept, and tapping the level goes on from here.
  const PART = { review: "Old words", "new": "New words", test: "Island test", quick: "Quick check" };
  function renderPart() {
    const done = q.partDone, next = cur().part, ids = [];
    q.items.slice(q.i).forEach(x => { const id = x.w && (x.w.id || x.w.word); if (x.part === next && id && ids.indexOf(id) < 0) ids.push(id); });   // a quick-check word has no id yet
    if (next === "new") cur().news && cur().news.forEach(w => { if (ids.indexOf(w.id) < 0) ids.push(w.id); });
    if (!q.partLogged) { q.partLogged = true; logEvent("part_done", { day: q.day, part: done, minutes: Math.round((Date.now() - q.startedAt) / 6000) / 10 }); }
    qp('<header class="pg-head"><span class="eyebrow">Level ' + q.day + '</span></header><div class="lv-center">' +
      '<div class="stamp lv-ok"><span class="nozh">' + PART[done].toLowerCase() + "</span><b>" + ICON("check") + "</b><span>done</span></div>" +
      '<h3 class="pg-title">' + PART[done] + " done.</h3>" + (done === "quick" ? '<p class="do lv-qksum">' + quickSummary() + "</p>" : "") +
      "<p class=\"do\"><b>Next:</b> " + (cur().step === "pairs" ? "Which word did you hear?" : PART[next] + " (" + ids.length + ")") + "</p>" +   // the pair game comes before the new words: the line names what he sees next
      '<footer class="pg-foot lv-mid"><button type="button" class="btn" id="stopHere">Stop here</button><button type="button" class="btn primary" id="goOn">Go on' + ICON("arrow") + "</button></footer>" +
      '<p class="hint">Stop now or later. Diamonds stay safe.</p></div>');

    $("goOn").onclick = () => { q.step = null; q.partLogged = false; renderQ(); };
    $("stopHere").onclick = () => { pauseQuest(); showPage("world"); };

  }
  async function renderEnd() {
    if (!q || q.ended) return;
    const ks = Object.keys(q.results), r = q.row, day = q.day;
    // first-try results of the scoring steps; for a real level they come from the quest row, so a stop and a new start keep them
    const ok = q.practice ? ks.filter(x => q.results[x]).length : (r.new_right || 0) + (r.reviews_right || 0) + (r.test_right || 0);
    const total = q.practice ? ks.length : ok + (r.new_wrong || 0) + (r.reviews_wrong || 0) + Math.max(0, (r.test_total || 0) - (r.test_right || 0));
    if (q.practice) {
      q = { ended: true };
      qp('<header class="pg-head"><span class="eyebrow">Practice · Level ' + day + '</span></header><div class="lv-center">' +
        '<div class="stamp lv-ok"><span>practice</span><b>' + ICON("check") + "</b><span>level " + day + "</span></div>" +
        '<h3 class="pg-title">Practice done</h3>' + (ok ? '<p class="do">First try right: <b>' + ok + " of " + total + "</b></p>" : "") +   // never a score that reads 0
        '<p class="hint">No diamonds. Tomorrow gets easier.</p>' +
        '<footer class="pg-foot lv-mid"><button type="button" class="btn primary" id="toPath">' + ICON("map") + "Back to the map</button></footer></div>");
      W.sfx("pop"); $("toPath").onclick = () => { q = null; renderPath(); }; return;
    }
    const first = !r.completed;
    // Diamonds: 5 for finishing (28 November, the tutor's choice: every finished level buys at least one visible piece, a door and
    // a window or 50 bricks, also on a day with no first-try right; it was 2), 1 per word right on the first try (counted across
    // a stop), 1 per older word right first time in the mixed round (paid at once), 5 more for an island test.
    const scored = (r.new_right || 0) + (r.reviews_right || 0) + (r.test_right || 0);

    if (first) await reviewFinish(day);

    if (typeof pkFill === "function") await Promise.race([pkFill(), new Promise(res => setTimeout(res, 4000))]);   // picker hook: a second level today gets its words

    const NEXT_BTN = { story: ["toStory", "book", "Read today's story"], school: ["toSchool", "book", "Go to your school words"], mail: ["toMail", "mail", "Open the mailbox"] };
    const foot = nx ? (([id, ic, label]) => '<footer class="pg-foot lv-mid"><button type="button" class="btn primary" id="' + id + '">' + ICON(ic) + label + "</button></footer>")(NEXT_BTN[nx.key] || ["toWorld", "home", "Back to the outpost"])
      : '<footer class="pg-foot lv-mid">' + (story ? '<button type="button" class="btn primary" id="toStory">' + ICON("book") + "Read today's story</button>" : '<button type="button" class="btn primary" id="toWorld">' + ICON("home") + "Back to the outpost</button>") +

      '<h3 class="pg-title">Level ' + day + " done</h3>" +
      '<p class="lv-gems">' + ICON("gem") + "<span>You earned " + earned + (earned === 1 ? " diamond." : " diamonds.") + "</span></p>" +
      (ok ? '<p class="do">First try right: <b>' + ok + " of " + total + "</b></p>" : "") +   // never a score that reads 0
      (isTest(day) && r.test_right ? '<p class="do">Island test: <b>' + (r.test_right || 0) + " / " + (r.test_total || 0) + "</b></p>" : "") +
      (zoneDone && day < maxDay() ? '<p class="do lv-isle">' + ICON("isle") + "<span>" + W.esc(ZONES[zi].name) + " is complete! Next: " + W.esc(nextZone.name) + ".</span></p>" : "") +
      '<div class="lv-hints"><p class="hint">' + (ok === total ? "All correct!" : "Some words come back tomorrow.") + "</p>" +

      foot + "</div>");

    [/^You earned (\d+) diamonds?\.$/, "你得到了 $1 颗钻石。"], [/^First try right: (\d+) of (\d+)$/, "第一次就拼对：$1 / $2"],
    [/^Island test: (\d+) \/ (\d+)$/, "小岛测验：$1 / $2"], [/^(.+) is complete! Next: (.+)\.$/, "$1 完成了！下一站：$2。"],
    [/^Level (\d+) is open today\.$/, "第 $1 关今天已经开了。"], [/^Level (\d+) opens tomorrow\.$/, "第 $1 关明天开放。"]
  ]);
  // ============ school words (owner: school team; prefix sc-) ============
  // The school gives a spelling list each week and a dictation on a set day. At the watchtower ("School" in the dock):
  //  - the daily go: up to 5 words of the current list, least-known first. A word he has not yet typed right from memory is
  //    first learned in three small moves, one calm page each: Look (the word, its Chinese, the picture when the game has one,
  //    said slowly twice; "Next"), Copy (he types it with the word in view; a miss marks the first letter that differs), Cover
  //    (the word hides; he hears it and types it from memory, with the Hint button of 80-level.js). A word he has typed right
  //    from memory on an earlier day goes straight to Cover. The first Cover try is the one that counts (school_words and
  //    attempts as before). A word missed in Cover comes back once after the five, then rests until tomorrow.
  //    The end says what he can do: "4 words ready for school." (none ready: "Good practice. More tomorrow."). 2 diamonds. One go after EVERY level of the day
  //    (the owners, 25 November): after a second level, 5 more words, not the five of the first go unless the list has no others.
  //  - the practice dictation (the day before the school's, or on the day itself if not done): on paper, as at school.
  //    Each word said twice; he marks his own paper; the score is saved in school_tests; the missed words come back for typing; 3 diamonds.
  //  - speech for school words is slower than anywhere else in the game (see scSay), and a "Slowly" button says it beat by beat.
  // Rows: school_words (written by the teacher page; meaning_zh: her short Chinese meaning), school_tests, quests
  // (kind "school" / "school_dictation"), attempts, events.
  let scRows = null, scTests = [], scRun = null, scLoadedFor = null, scLast = "";
  const SC_DRILL = 5;
  const SC_SAMPLE = [["because", "因为"], ["friend", "朋友"], ["people", "人们"], ["Wednesday", "星期三"], ["don't", "不要"], ["could", "能够"], ["should", "应该"], ["laugh", "笑"], ["through", "穿过"], ["before", "以前"], ["after", "以后"], ["school", "学校"]];

  // ---- the rows: loaded once the child is in (student and today's session known), then today's parts are drawn again ----
  async function scLoad() {
    if (!student) return;
    scLoadedFor = student.id;
    try {
      let r = await sb.from("school_words").select("*").eq("student_id", student.id);
      let rows = (r && r.data) || [];
      // The stand-in database only: one sample list, the dictation three days ahead, seeded once.
      const D = window.WW_DEMO;
      if (D && D.tables && !rows.length) {
        const seeds = D.tables.school_seed || (D.tables.school_seed = []);
        if (!seeds.some(x => x.student_id === student.id)) {
          seeds.push({ student_id: student.id, at: new Date().toISOString() });
          const now = new Date().toISOString(), date = W.addDays(today(), 3);
          r = await sb.from("school_words").insert(SC_SAMPLE.map(([word, zh]) => ({ student_id: student.id, word, meaning_zh: zh, dictation_date: date, added_at: now, tries: 0, right: 0, last_seen: null, last_right: null }))).select();
          rows = (r && r.data) || [];
        }
      }
      scRows = rows;
      const t = await sb.from("school_tests").select("*").eq("student_id", student.id);
      scTests = (t && t.data) || [];
    } catch (e) { scRows = scRows || []; }
    renderToday();
  }
  (function scWait() {   // no hook tells us when he is in: look until student and today's session are there
    const tick = () => { try { if (student && todaySession && scLoadedFor !== student.id) scLoad(); } catch (e) {} };
    const id = setInterval(() => { tick(); if (scLoadedFor) clearInterval(id); }, 300);
  })();

  // ---- the current list, the order, today's task ----
  function scList() {
    if (!scRows) return null;
    const t = today(), dates = scRows.map(r => r.dictation_date).filter(d => d && d >= t).sort();
    if (!dates.length) return null;
    const date = dates[0];
    return { date, rows: scRows.filter(r => r.dictation_date === date).sort((a, b) => (a.added_at || "") < (b.added_at || "") ? -1 : (a.added_at || "") > (b.added_at || "") ? 1 : 0) };
  }
  // Least-known first: never seen, then last time not right, then lowest share right, then longest not seen.
  function scLeastKnown(rows) {
    const rank = r => !r.tries ? 0 : r.last_right === false ? 1 : 2;
    const share = r => r.tries ? (r.right || 0) / r.tries : 0;
    return rows.slice().sort((a, b) => rank(a) - rank(b) || share(a) - share(b) || ((a.last_seen || "") < (b.last_seen || "") ? -1 : (a.last_seen || "") > (b.last_seen || "") ? 1 : 0));
  }
  // Has he typed it right from memory before (a first try that counted, on an earlier day)? Then Look and Copy are skipped.
  const scKnown = r => (r.right || 0) > 0;
  const scDayOf = iso => iso ? W.dkey(new Date(iso)) : "";
  const scDrills = () => quests.filter(x => x.kind === "school" && scDayOf(x.started_at) === today());
  const scDrillRow = () => scDrills()[0] || null;
  const scNeed = () => Math.max(1, typeof doneToday === "function" ? doneToday() : 1);   // one go for each level finished today (at least one)
  const scDrillsDone = () => scDrills().length >= scNeed();
  const scTestToday = () => scTests.find(x => x.taken_on === today()) || null;
  function scToday() {
    const list = scList(); if (!list) return null;
    const t = today(), dictDue = t >= W.addDays(list.date, -1) && !scTests.some(x => x.dictation_date === list.date);
    if (dictDue) return { list, mode: "dictation", done: false, n: list.rows.length };
    return { list, mode: "drill", done: !!(scDrillsDone() || scTestToday()), n: Math.min(SC_DRILL, list.rows.length) };
  }
  // Today's fourth part (drawn by renderToday in 90-boot).
  function schoolPart() {
    const s = scToday(); if (!s) return null;
    return { done: s.done, n: s.done ? "" : s.n, label: "School words" };
  }

  // ---- what the game knows about a school word: its Chinese, its picture, its beats ----
  // The tutor's Chinese (meaning_zh) first; else the game's own word of the same spelling (his words, then the bank).
  // The picture: the school word's own painting (window.WW_SCHOOL_PICS, site/img/school/pics.js) first; else, for one of
  // the game's own words, its painting (picSrc falls back to img/words/ by itself).
  const scSchoolPic = r => { const SP = window.WW_SCHOOL_PICS || {}, low = String(r.word || "").toLowerCase().replace(/[\u2018\u2019`\u00b4]/g, "'"); return SP[low] || SP[W.key(r.word)] || ""; };
  let scBankBy = null;
  function scGameWord(r) {
    const k = W.key(r.word);
    const mine = (typeof words !== "undefined" && Array.isArray(words) ? words : []).find(w => W.key(w.word) === k);
    if (!scBankBy) { scBankBy = {}; (window.WW_BANK || []).forEach(b => { scBankBy[W.key(b[0])] = { word: b[0], chunks: b[1], meaning_zh: b[3] }; }); }
    const bank = scBankBy[k] || null;
    return { word: r.word, chunks: (mine && mine.chunks) || (bank && bank.chunks) || "", picture: scSchoolPic(r) || (mine && mine.picture) || "", zh: String(r.meaning_zh || (mine && mine.meaning_zh) || (bank && bank.meaning_zh) || "").trim() };
  }
  const scZh = r => scGameWord(r).zh;
  // Beats only when the game has them for this word and they spell it (beatsOf gives none for a word outside the bank).
  function scBeats(r) {
    const g = scGameWord(r), bs = beatsOf(g);
    return bs.length > 1 && W.key(bs.join("")) === W.key(r.word) ? bs : [];
  }

  // ---- speech for school words: slower than anywhere else, twice when a word first shows, and "Slowly" ----
  // The device voice: 0.5 (the game's "slow" is 0.62); "Slowly" 0.42. On claude.ai, where the page reader speaks instead,
  // 0.7, its slowest. The tutor's "slower" choice for his laptop still multiplies the device voice (W.utter).
  const SC_RATE = 0.5, SC_RATE_SLOWEST = 0.42, SC_READER_RATE = 0.7, SC_GAP = 1000, SC_BEAT_GAP = 450;
  let scReader = null, scReading = false, scTok = 0, scSpoken = 0, scLastEnd = Promise.resolve();
  try { if (window.claude && window.claude.use) window.claude.use("tts").then(t => { scReader = t || null; }).catch(() => {}); } catch (e) {}
  const scNoVoice = () => { try { return !("speechSynthesis" in window) || speechSynthesis.getVoices().length === 0; } catch (e) { return true; } };
  const scPause = ms => new Promise(res => setTimeout(res, ms));
  const SC_SAID = window.WW_SC_SAID = [];   // what was said and at what speed, for checks: "word@0.5"
  // Say one text at a rate. Resolves when it has been said (or after a fair estimate when the voice does not tell).
  function scSay(text, rate, noClip) {
    const said = String(text);
    SC_SAID.push(said + "@" + rate); if (SC_SAID.length > 300) SC_SAID.shift();
    return new Promise(res => {
      let done = false, min = false, spoke = false;
      const est = Math.min(8000, (300 + 90 * said.length) / rate), byReader = !!(scReader && scNoVoice());
      const cap = byReader ? Math.max(est + 400, 4500) : est + 400;      // the reader starts late at times: give it room
      const wid = W.wordBegin ? W.wordBegin(cap + 200) : 0;               // a school word is a word: Orbit waits for it
      const fin = () => { if (!done && min && spoke) { done = true; if (W.wordEnd) W.wordEnd(wid); res(); } };
      setTimeout(() => { min = true; spoke = true; fin(); }, cap);        // whatever the voice says, never wait longer
      try {
        if (byReader) {
          scReading = true;
          setTimeout(() => { min = true; fin(); }, est * 0.6);
          const p = W.read ? W.read(W.key(said) || said, { rate: SC_READER_RATE }) : scReader.speak(W.key(said) || said, { rate: SC_READER_RATE });
          if (p && p.then) p.then(() => { scReading = false; spoke = true; fin(); }, () => { scReading = false; spoke = true; fin(); });
          return;
        }
        if (!("speechSynthesis" in window)) return;
        // noClip: a beat of a word without a recording goes to the device's voice only (a beat such as "plane" or "ten"
        // must never play another recorded WORD)
        W.devSay([{ text: said, rate }], Object.assign({ onend: () => { min = true; spoke = true; fin(); } }, noClip ? { noClip: true } : {}));
      } catch (e) {}
    });
  }
  // Is this word the school word on the page now? Then W.speak (ours, and the Hint button's) says it at the school speed.
  function scCurRow() { const R = scRun; if (!R) return null; const it = R.queue ? R.queue[R.i] : null; return it ? it.r : R.rows ? R.rows[R.i] : null; }
  const scLive = () => { const p = $("panel"), b = $("panelBody"); return !!(p && !p.hidden && b && b.querySelector(".sc-page")); };
  const scSpeakOrig = W.speak;
  W.speak = function (word, o) {
    const r = scCurRow();
    if (r && scLive() && W.key(word) && W.key(word) === W.key(r.word)) {
      scSpoken++;
      try { if (W.devStop) W.devStop(); } catch (e) {}
      scLastEnd = scSay(r.word, SC_RATE);
      return true;
    }
    return scSpeakOrig.apply(this, arguments);
  };
  // Say the word once or twice, with a short gap; a page change (or any other speaking) stops the second time.
  function scHear(r, times, gapFrom) {
    const tok = ++scTok;
    W.speak(r.word, { slow: true });
    if (times < 2) return;
    const n = scSpoken;
    // Between the two sayings the word still "has the voice": Orbit's line waits until the second saying is over
    // (the play test heard his line start in the gap and get cut by the second saying).
    let hold = 0;
    Promise.all([scLastEnd.then(() => { if (W.wordBegin && tok === scTok) hold = W.wordBegin(SC_GAP + (gapFrom || 0) + 1500); return scPause(SC_GAP); }), scPause(gapFrom || 0)]).then(() => {
      if (tok === scTok && n === scSpoken && scCurRow() === r && scLive()) W.speak(r.word, { slow: true });
      else if (hold && W.wordEnd) W.wordEnd(hold);
    });
  }
  // One recording of the page (a piece of the word, or the whole word slowly), holding the word's ticket while it plays so
  // Orbit waits; the promise ends when it ends, fails, or after its time at most.
  let scClipOn = false;
  function scPlayClip(clip) {
    return new Promise(res => {
      const wid = W.wordBegin ? W.wordBegin(900 + (clip.dur || 1) * 1000) : 0;
      let done = false;
      const fin = () => { if (done) return; done = true; scClipOn = false; if (W.wordEnd) W.wordEnd(wid); res(); };
      setTimeout(fin, 9500 + (clip.dur || 1) * 1000);
      scClipOn = true;
      try { W.clipSay(clip, { ticket: wid, onend: fin, onfail: fin }); } catch (e) { fin(); }
    });
  }
  // "Slowly" (the lead's audit, 25 November): a word with a recording plays from it: beat by beat as pieces of its slow
  // recording (W.clipBeat) when every beat has its time, else the whole word once, slowly. A word without a recording (one
  // the tutor typed) goes beat by beat to the device's voice, never to a recording (noClip): "plane" of aeroplane must not
  // play the recorded word "plane". No beats known: the whole word once more at the slowest speed.
  async function scSlowly(r) {
    const tok = ++scTok, bs = scBeats(r);
    try { if (W.devStop) W.devStop(); } catch (e) {}
    const whole = W.clipFor ? W.clipFor(r.word, 0, true) : null;
    const pieces = whole && bs.length > 1 && W.clipBeat ? bs.map((b, i) => W.clipBeat(r.word, b.toLowerCase(), i)) : [];
    const byPieces = pieces.length > 1 && pieces.every(Boolean);
    logEvent("school_slowly", { word: r.word, beats: bs.length, how: whole ? (byPieces ? "pieces" : "whole") : "device" });
    if (whole) {
      if (!byPieces) { await scPlayClip(whole); return; }
      for (let i = 0; i < pieces.length; i++) {
        if (tok !== scTok || !scLive()) return;
        await scPlayClip(pieces[i]);
        if (i < pieces.length - 1) await scPause(SC_BEAT_GAP);
      }
      return;
    }
    if (!bs.length) { await scSay(r.word, SC_RATE_SLOWEST); return; }
    for (let i = 0; i < bs.length; i++) {
      if (tok !== scTok || !scLive()) return;
      await scSay(bs[i].toLowerCase(), SC_RATE_SLOWEST, true);
      if (i < bs.length - 1) await scPause(SC_BEAT_GAP);
    }
  }
  // Leaving a page: the school word stops. (Orbit no longer stops a word that is being said, so the page does it itself.)
  function scQuiet() {
    scTok++;
    if (scClipOn) { scClipOn = false; try { if (W.clipStop) W.clipStop(); } catch (e) {} }   // only the page's own recording
    try { if (W.devStop) W.devStop(); } catch (e) {}
    try { if (scReading && W.readStop) { scReading = false; W.readStop(); } } catch (e) {}
  }

  // ---- small pieces of the page ----
  const scWeekday = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { weekday: "long" });
  function scWhen(date) {
    const n = W.daysBetween(today(), date);
    return n <= 0 ? "The school dictation is today." : n === 1 ? "The school dictation is tomorrow." : "The school dictation is on " + scWeekday(date) + ".";
  }
  function scHead(brow, at, n, count) {
    const trail = count ? '<span class="sc-count zhk">Word ' + (at + 1) + " of " + n + "</span>"
      : n ? '<ol class="trail" aria-label="' + (at + 1) + " of " + n + '">' + Array.from({ length: n }, (_, i) => '<li class="' + (i < at ? "done" : i === at ? "now" : "") + '"></li>').join("") + "</ol>" : "";
    return '<header class="pg-head"><span class="eyebrow">' + brow + "</span>" + trail +
      (n ? '<button type="button" class="btn quiet" id="sc-stop">Stop here</button>' : "") + "</header>";
  }
  const scTitle = (t, doHtml) => '<h3 class="pg-title">' + t + "</h3>" + (doHtml ? '<p class="do">' + doHtml + "</p>" : "");
  // The three moves of a new word, the one he is on marked.
  const SC_MOVES = [["look", "Look"], ["copy", "Copy"], ["cover", "From memory"]];
  const scMoves = at => '<ol class="sc-moves" aria-label="' + W.esc(SC_MOVES.find(m => m[0] === at)[1]) + '">' + SC_MOVES.map(([k, t], i) =>
    '<li class="' + (k === at ? "now" : SC_MOVES.findIndex(m => m[0] === at) > i ? "done" : "") + '"><i>' + (i + 1) + '</i><span class="zhk">' + t + "</span></li>").join("") + "</ol>";
  function scOpen(html, steps) {
    openPanel('<div class="sc-page' + (steps ? " sc-steps" : "") + '">' + html + "</div>", !!steps);
    const s = $("sc-stop"); if (s) s.onclick = scStop;
  }
  function scStop() { if (scRun) logEvent("school_pause", { kind: scRun.kind, at: scRun.i + 1 }); scRun = null; scQuiet(); Guide.quiet(); closePanel(); }
  const scHome = () => { scRun = null; scQuiet(); closePanel(); if (!$("worldwrap").hidden && typeof hdStartHint === "function") { const h = hdStartHint(); if (h) hdHint(h); } };   // Orbit says what is next (the story)
  const scWordList = (rows, marks) => '<ul class="sc-list nozh">' + rows.map(r => '<li class="' + (marks[r.id] ? "sc-yes" : "sc-no") + '">' + (marks[r.id] ? ICON("check") : '<i class="sc-dot"></i>') + "<span>" + W.esc(r.word) + "</span></li>").join("") + "</ul>";
  // The end line: never a number that can be 0.
  const scReadyLine = n => n > 0 ? n + (n === 1 ? " word" : " words") + " ready for school." : "Good practice. More tomorrow.";
  const scZhLine = (r, cls) => { const z = scZh(r); return z ? '<p class="' + cls + ' nozh" lang="zh">' + W.esc(z) + "</p>" : ""; };
  // "Slowly": a speaker with three dots, one for each beat (drawn here in the sprite's style).
  const SC_SLOW_IC = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9.5h3L9.8 6v12l-4.3-3.5h-3z"/><path d="M13.6 12h.01M17.3 12h.01M21 12h.01" stroke-width="3.2"/></svg>';
  const scSlowBtn = () => '<button type="button" class="btn sc-slow" id="sc-slow">' + SC_SLOW_IC + "Slowly</button>";

  // ============ the page at the watchtower ============
  // For checks from outside the script (tests that look at the drill itself, whatever the day's next part is).
  try { window.WW_SCHOOL = Object.freeze({ open: () => openSchool() }); } catch (e) {}
  function openSchool() {
    scRun = null; W.sfx("pop");
    if (scRows === null) { scOpen('<header class="pg-head"><span class="eyebrow">School words</span></header><p class="do sc-wait">Loading…</p>'); scLoad().then(() => { if (!$("panel").hidden && $("panelBody").querySelector(".sc-wait")) openSchool(); }); return; }
    const s = scToday();
    if (!s) {
      scOpen(scHead("School words") + scTitle("School words", "There is no school list this week.") +
        '<p class="hint sc-gap">Your teacher adds the words here.</p>' +
        '<footer class="pg-foot"><span class="grow"></span><button type="button" class="btn primary" id="sc-home">' + ICON("home") + "Back to the outpost</button></footer>");
      $("sc-home").onclick = scHome; Guide.text("There is no school list this week.", "这周没有学校的单词表。"); logEvent("school_open", { list: false }); return;
    }
    logEvent("school_open", { list: true, mode: s.mode, done: s.done, dictation_date: s.list.date });
    if (s.mode === "dictation") return scDictIntro(s.list);
    if (s.done) return scDoneToday(s.list);
    scDrillIntro(s.list);
  }
  function scDoneToday(list) {
    const t = scTestToday(), last = scDrillRow() && scLast;
    const line = t ? (t.score > 0 ? "Practice dictation: " + t.score + " of " + t.total + "." : "You did the practice dictation.") : last ? last : "You did your school words today.";
    scOpen(scHead("School words") + '<div class="sc-mid"><div class="stamp sc-ok"><span>school</span><b>' + ICON("check") + "</b><span>today</span></div>" +
      scTitle("Done for today", W.esc(line)) + '<p class="hint">' + W.esc(scWhen(list.date)) + "</p>" +
      '<p class="hint">Come back tomorrow for more.</p></div>' +
      '<footer class="pg-foot sc-center"><button type="button" class="btn primary" id="sc-home">' + ICON("home") + "Back to the outpost</button></footer>");
    $("sc-home").onclick = scHome; Guide.text("Done for today. Come back tomorrow for more.", "今天完成了。明天再来。");
  }

  // ---- the daily go: five words, each learned in three moves (or only the last when he knows it) ----
  function scDrillIntro(list) {
    const n = Math.min(SC_DRILL, list.rows.length);
    scOpen(scHead("School words") + scTitle("School words", "<b>Look.</b> <b>Copy.</b> Then <b>type</b> from memory.") +
      '<div class="note sc-note">' + ICON("book") + '<span class="cap zhk">From your school list</span><p>' + n + " words today</p>" +
      "<p>" + W.esc(scWhen(list.date)) + "</p></div>" +
      '<footer class="pg-foot"><span class="grow"></span><button type="button" class="btn primary" id="sc-go">Start' + ICON("arrow") + "</button></footer>");
    $("sc-go").onclick = () => scStartDrill(list); $("sc-go").focus();
    Guide.text("Look. Copy. Then type from memory.", "看一看。抄一遍。然后凭记忆打出来。");
  }
  function scStartDrill(list) {
    // the words of an earlier go today wait (last_seen is today), unless the list has no others
    const t = today(), notToday = list.rows.filter(r => r.last_seen !== t), rest = list.rows.filter(r => r.last_seen === t);
    const rows = scLeastKnown(notToday).concat(scLeastKnown(rest)).slice(0, SC_DRILL);
    scRun = { kind: "drill", list, rows, queue: rows.map(r => ({ r, move: scKnown(r) ? "cover" : "look", learn: !scKnown(r) })), i: 0, first: {}, ready: {}, backAdded: false, hints: {}, startedAt: Date.now() };
    logEvent("school_drill_start", { dictation_date: list.date, words: rows.map(r => r.word), learn: rows.filter(r => !scKnown(r)).map(r => r.word) });
    scStep();
  }
  function scStep() {
    const it = scRun.queue[scRun.i];
    if (it.move === "look") return scLook(it);
    if (it.move === "copy") return scCopy(it);
    return scCover(it);
  }
  // Next move of this word, or the next word; after the five, the words missed in Cover come back once; then the end.
  function scNext() {
    const R = scRun, it = R.queue[R.i];
    if (it.move === "look") { it.move = "copy"; return scStep(); }
    if (it.move === "copy") { it.move = "cover"; return scStep(); }
    R.i++;
    if (R.i >= R.queue.length && R.kind === "drill" && !R.backAdded) {
      R.backAdded = true;
      R.rows.filter(r => R.first[r.id] === false).forEach(r => R.queue.push({ r, move: "cover", back: true }));
      if (R.queue.length > R.i) logEvent("school_back", { words: R.queue.slice(R.i).map(x => x.r.word) });
    }
    if (R.i < R.queue.length) return scStep();
    R.kind === "drill" ? scDrillEnd() : scRetypeEnd();
  }
  const scBrow = R => R.kind === "drill" ? "School words" : "Practice dictation";

  // Look: the word large, its Chinese, the picture when the game has one; said slowly, twice.
  function scLook(it) {
    const R = scRun, r = it.r, g = scGameWord(r), pic = hasPic(g);
    const wordHtml = '<div class="sc-show"><p class="sc-word nozh" lang="en">' + W.esc(r.word) + "</p>" + scZhLine(r, "sc-zhm") + "</div>";
    scOpen(scHead(scBrow(R), R.i, R.queue.length) + scTitle("Look and listen", "<b>Look</b> at the word. <b>Listen.</b>") + scMoves("look") +
      (pic ? '<div class="sc-meet">' + picHtml(g, "sc-pic") + wordHtml + "</div>" : '<div class="sc-meet sc-solo">' + wordHtml + "</div>") +
      '<footer class="pg-foot"><button type="button" class="btn" id="sc-hear">' + ICON("speaker") + "Hear it again</button>" + scSlowBtn() +
      '<span class="grow"></span><button type="button" class="btn primary" id="sc-next">Next' + ICON("arrow") + "</button></footer>", true);
    $("sc-hear").onclick = () => scHear(r, 1);
    $("sc-slow").onclick = () => scSlowly(r);
    $("sc-next").onclick = () => { if (scRun === R && R.queue[R.i] === it && it.move === "look") scNext(); };
    $("sc-next").focus();
    Guide.text("Look at the word. Listen.", "看这个词。听一听。");
    scHear(r, 2);
  }

  // Copy: the word stays; he types it; a miss marks the first letter that differs and he fixes it.
  function scLetters(word, mark) {
    return Array.from(String(word)).map((c, i) => '<span class="sc-l' + (i === mark ? " sc-here" : "") + '">' + W.esc(c) + "</span>").join("");
  }
  // Where his typing first differs from the word, as a position in the word as shown (-1: he typed more than the word).
  function scDiffAt(typed, word) {
    const chars = Array.from(String(word)), at = [];
    chars.forEach((c, i) => { if (W.key(c)) at.push(i); });
    const kw = W.key(word), ka = W.key(typed);
    let i = 0; while (i < kw.length && ka[i] === kw[i]) i++;
    return i >= kw.length ? -1 : at[i];
  }
  function scCopy(it) {
    const R = scRun, r = it.r;
    it.copyMiss = 0;
    scOpen(scHead(scBrow(R), R.i, R.queue.length) + scTitle("Copy the word", "<b>Type</b> the word you see.") + scMoves("copy") +
      '<div class="sc-show sc-copy"><p class="sc-word nozh" lang="en" id="sc-model">' + scLetters(r.word, null) + "</p>" + scZhLine(r, "sc-zhm sc-zhs") + "</div>" +
      '<form class="answer" id="sc-form" autocomplete="off"><label class="line" id="sc-line">' + ICON("pencil") +
      '<input id="sc-ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24" placeholder="type the word here" aria-label="Type the word"></label>' +
      '<button type="submit" class="btn primary" id="sc-check">Check</button></form>' +
      '<p class="fb" id="sc-fb" aria-live="polite"></p>' +
      '<footer class="pg-foot sc-foot"><button type="button" class="btn" id="sc-hear">' + ICON("speaker") + "Hear it again</button>" + scSlowBtn() + "</footer>", true);
    const inp = $("sc-ans");
    $("sc-hear").onclick = () => { scHear(r, 1); inp.focus(); };
    $("sc-slow").onclick = () => { scSlowly(r); inp.focus(); };
    inp.addEventListener("input", () => { const f = $("sc-fb"); if (/bad/.test(f.className)) { f.className = "fb"; } });
    $("sc-form").onsubmit = e => {
      e.preventDefault(); if (inp.readOnly) return;
      const a = String(inp.value || "").trim(); if (!W.key(a)) return;
      const f = $("sc-fb");
      if (W.same(a, r.word)) {
        inp.readOnly = true; $("sc-line").classList.add("good"); $("sc-model").innerHTML = scLetters(r.word, null);
        W.sfx("right"); f.className = "fb good"; f.innerHTML = ICON("check") + "Yes! Now from memory.";
        logEvent("school_copy", { word: r.word, misses: it.copyMiss });
        setTimeout(() => { if (scRun === R && R.queue[R.i] === it && it.move === "copy") scNext(); }, 1100);
      } else {
        it.copyMiss++; W.sfx("notyet");
        const at = scDiffAt(a, r.word);
        $("sc-model").innerHTML = scLetters(r.word, at);
        f.className = "fb bad"; f.textContent = at < 0 ? "Not yet. Too many letters." : "Not yet. Look here.";
        inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    };
    inp.focus();
    Guide.text("Type the word you see.", "把你看到的词打出来。");
    scHear(r, 1);
  }

  // Cover (and every typing page: a known word, a word that comes back, the missed words after the dictation):
  // he hears the word and types it from memory; the Hint button as in a level; he types until right.
  function scCover(it) {
    const R = scRun, r = it.r, g = scGameWord(r), pic = hasPic(g) ? picHtml(g, "sc-mini") : "";
    R.peek = false; R.busy = false;
    const title = it.back ? scTitle("Try it again", "<b>Listen.</b> <b>Type</b> the word you hear.") : it.learn ? scTitle("Now from memory", "<b>Listen.</b> <b>Type</b> the word you hear.") : scTitle("Listen and type", "<b>Listen.</b> <b>Type</b> the word you hear.");
    scOpen(scHead(scBrow(R), R.i, R.queue.length) + title + (it.learn ? scMoves("cover") : "") +
      '<div class="sc-cue"><button type="button" class="sound sc-big" id="sc-hear" aria-label="Hear the word">' + ICON("speaker") + "</button>" + scSlowBtn() + "</div>" +
      '<form class="answer' + (pic ? " sc-withpic" : "") + '" id="sc-form" autocomplete="off">' + pic + '<label class="line" id="sc-line">' + ICON("pencil") +
      '<input id="sc-ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24" placeholder="type the word here" aria-label="Type the word"></label>' +
      '<button type="submit" class="btn primary" id="sc-check">Check</button></form>' + scZhLine(r, "sc-zhc" + (pic ? " sc-zhp" : "")) + hintRow("sc", "sc-fb") +
      '<div class="stamp sc-first" id="sc-stamp" hidden></div>', true);
    const inp = $("sc-ans");
    R.hints = R.hints || {};
    const hk = r.id + (it.back ? ":back" : "");
    const st = R.hints[hk] || (R.hints[hk] = { n: 0, last: "" });
    R.hk = hintKit({ px: "sc", word: r.word, chunks: null, st, inp: () => $("sc-ans"), step: "school", kind: R.kind === "drill" ? "school" : "school_test" });
    $("sc-hear").onclick = () => { scHear(r, 1); if (!inp.readOnly) inp.focus(); };
    $("sc-slow").addEventListener("mousedown", e => e.preventDefault());
    $("sc-slow").onclick = () => { scSlowly(r); if (!inp.readOnly) inp.focus(); };
    inp.addEventListener("keydown", e => { if (R.peek && e.key.length === 1 && !e.ctrlKey && !e.metaKey) inp.value = ""; });   // a new try starts on a clean line
    inp.addEventListener("input", () => {
      if (R.hk) R.hk.typing();   // the word shown by the third hint hides as he types
      if (!R.peek) return; R.peek = false;
      $("sc-line").classList.remove("bad"); const f = $("sc-fb"); f.className = "fb"; f.textContent = "Type it again.";
    });
    $("sc-form").onsubmit = e => { e.preventDefault(); if (!inp.readOnly) scCheck(inp.value); };
    inp.focus();
    Guide.text("Listen. Type the word you hear.", "听一听。把听到的词打出来。");
    scHear(r, 2);
  }
  async function scCheck(val) {
    const R = scRun; if (!R || R.busy) return;
    const it = R.queue[R.i], r = it.r, a = String(val || "").trim(); if (!W.key(a)) return;
    const right = W.same(a, r.word), first = !it.tried, hk = r.id + (it.back ? ":back" : ""), hn = R.hints[hk] ? R.hints[hk].n : 0;
    const counts = first && !it.back && R.kind === "drill";   // the try that counts, exactly as the drill's first try counted before
    it.tried = true; R.busy = true;
    if (counts) {
      R.first[r.id] = right;
      const patch = { tries: (r.tries || 0) + 1, right: (r.right || 0) + (right ? 1 : 0), last_seen: today(), last_right: right };
      Object.assign(r, patch);
      try { const { error } = await sb.from("school_words").update(patch).eq("id", r.id); if (error) banner("No internet? That answer was not saved."); } catch (e) {}
    }
    if (first && right && R.kind === "drill") R.ready[r.id] = true;
    scAttempt(r, R.kind === "drill" ? (counts ? "school" : "school_retry") : "school_test", a, right, hn);
    if (scRun !== R || R.queue[R.i] !== it) return;
    R.busy = false;
    const f = $("sc-fb");
    if (right) {
      W.sfx("right"); $("sc-line").classList.add("good"); $("sc-ans").readOnly = true; f.className = "fb good"; R.hk.right();
      f.innerHTML = ICON("check") + (first ? "Yes! You spelled " + W.esc(r.word) + " without looking." : "Yes! Now you have it.");
      Guide.right(r.word, first ? "test" : "retry");
      if (counts) { const s = $("sc-stamp"); s.innerHTML = "<span>first try</span><b>" + ICON("check") + "</b><span>school</span>"; s.hidden = false; }
      setTimeout(() => { if (scRun === R && R.queue[R.i] === it) scNext(); }, first ? 1300 : 1000);
    } else {
      W.sfx("notyet"); R.miss = R.miss || {}; R.miss[hk] = (R.miss[hk] || 0) + 1;
      R.hk.miss(a);
      if (R.miss[hk] === 2 && R.hk.left()) Guide.wrong(r.word, 2);   // Orbit points to the Hint button; he never says the word
      $("sc-line").classList.add("bad"); f.className = "fb bad";
      f.textContent = "Not yet. Try again.";
      R.peek = true; const inp = $("sc-ans"); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  }
  async function scAttempt(r, kind, answer, correct, hints) {   // for the teacher page and the patterns in his slips; hints: presses before this try
    try { await sb.from("attempts").insert({ student_id: student.id, session_id: todaySession ? todaySession.id : null, quest_id: null, word_id: null, school_word_id: r.id, word: r.word, kind, step: "listen", answer, correct, level_before: null, level_after: null, hints: hints || 0 }); } catch (e) {}
  }
  async function scDrillEnd() {
    const R = scRun, total = R.rows.length, ok = R.rows.filter(r => R.first[r.id]).length, ready = R.rows.filter(r => R.ready[r.id]).length;
    let paid = false;
    if (!scDrillsDone()) {   // one go after each level: 2 diamonds, paid at once (no "completed": it is not a level)
      try {
        const { data, error } = await sb.from("quests").insert({ student_id: student.id, quest_day: null, kind: "school", started_at: new Date().toISOString(), diamonds_earned: 2 }).select().single();
        if (!error && data) { quests.push(data); paid = true; } else banner("No internet? Your diamonds were not saved.");
      } catch (e) {}
      logEvent("school_drill_done", { dictation_date: R.list.date, right: ok, total, ready, missed: R.rows.filter(r => !R.first[r.id]).map(r => r.word), minutes: Math.round((Date.now() - R.startedAt) / 6000) / 10 });
    }
    scLast = scReadyLine(ready);
    scOpen(scHead("School words") + '<div class="sc-mid sc-end"><div class="stamp sc-ok"><span>school</span><b>' + ICON("check") + "</b><span>today</span></div>" +
      scTitle("School words done") + '<p class="sc-score zhk">' + W.esc(scLast) + "</p>" +
      (paid ? '<p class="sc-gems">' + ICON("gem") + "<span>You earned 2 diamonds.</span></p>" : "") +
      scWordList(R.rows, R.ready) +
      (ready < total ? '<p class="hint">Dot words come first tomorrow.</p>' : "") +
      '<p class="hint">' + W.esc(scWhen(R.list.date)) + "</p></div>" +
      '<footer class="pg-foot sc-center"><button type="button" class="btn primary" id="sc-home">' + ICON("home") + "Back to the outpost</button></footer>");
    W.sfx("pop"); $("sc-home").onclick = scHome; $("sc-home").focus();
    renderStats();
    if (ready > 0) Guide.text(scLast + " Well done!", "有 " + ready + " 个词可以去学校听写了。做得好！");
    else Guide.text("Good practice. More tomorrow.", "练得很好。明天再练。");
  }

  // ---- the practice dictation, on paper ----
  function scDictIntro(list) {
    scOpen(scHead("Practice dictation") + scTitle("Practice dictation", "<b>Take</b> paper and a pencil. I <b>say</b> each word two times. <b>Write</b> it on paper.") +
      '<div class="note sc-note">' + ICON("pencil") + '<span class="cap zhk">Like the school dictation</span><p>' + list.rows.length + " words</p>" +
      "<p>" + W.esc(scWhen(list.date)) + "</p></div>" +
      '<footer class="pg-foot"><span class="grow"></span><button type="button" class="btn primary" id="sc-go">I have paper' + ICON("arrow") + "</button></footer>");
    $("sc-go").onclick = () => { scRun = { kind: "dict", list, rows: list.rows.slice(), i: 0, marks: {}, startedAt: Date.now() }; logEvent("school_test_start", { dictation_date: list.date, total: list.rows.length }); scDictWord(); };
    $("sc-go").focus();
